name: Club Discord Notifications

# Posts new book-club comments to Discord using the existing webhook secret.
# The client never sees the webhook URL, so visitors can't spam the channel.
# Runs every 15 minutes; the notifier looks back 16 minutes (slight overlap —
# a rare duplicate ping is harmless, a gap would lose comments).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# ⚠️ `contents: read` is required, not optional — this was `{}` and every
# scheduled run failed at checkout for days.
#
# The job posts to a webhook and touches nothing in the repo, so granting the
# token nothing looked correct. But it still has to *check out the code it
# runs*, and on a private repo a token with no scopes cannot. GitHub will not
# confirm a private repo exists to a caller that cannot read it, so the failure
# arrives as `remote: Repository not found` — an authorization error wearing a
# 404, which reads like a deleted repo or a typo in the URL.
#
# This is still least-privilege: read is the floor for checkout, the webhook
# comes from a secret rather than the token, and nothing here writes.
permissions:
  contents: read

concurrency:
  group: "club-notify"
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v5

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 💬 Post new comments to Discord
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: |
        python -m app.tools.club_discord_notify
