name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_call:  # Allow this workflow to be called by other workflows

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v5
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: 📦 Install dependencies
      run: |
        echo "::group::Installing Python packages"
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        echo "::endgroup::"
    
    - name: 🧪 Run unit tests
      run: |
        echo "::group::Running test suite"
        # ⚠️ pytest is the ONLY Python runner in this repo — do not add a
        # second one. There used to be a run_tests.py (stdlib unittest
        # discovery): it collected 135 tests, CANNOT run the pytest-style
        # modules in tests/ (it reported them as import errors), and still
        # printed green. Deleted 2026-09-05. pytest runs both styles,
        # including every unittest.TestCase — 2,242 cases collected as of
        # 2026-09-05. One runner, whole suite, and no silently-unrun files.
        python -m pytest -q
        echo "::endgroup::"
    
    - name: 📊 Test summary
      if: always()
      run: |
        echo "::notice::Test execution completed. Check logs above for details."
