name: Deploy site (GitHub Pages + Cloudflare Pages)

# Two-lane deploy:
#   - Site root (prod) is ALWAYS built from the `prod` branch. Humans never push
#     to `prod`; it only moves via the "Promote to Prod" workflow (promote.yml),
#     which runs guard checks first.
#   - /dev/ is built from `main` on every push, so main can break freely without
#     affecting prod.
#
# HOSTS (migration in progress — see docs/access/pages-migration.md):
#   - GitHub Pages   skymitch9.github.io/audiobook_catalog/  — LIVE today
#   - Cloudflare Pages (direct upload)                       — parallel publish,
#     INERT until CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID exist as repo
#     secrets. Both hosts receive the SAME assembled `_site`, so the two-lane
#     semantics are identical on both.
#
# ⚠️ The Cloudflare Pages project MUST stay a direct-upload project. Never
#    connect it to this GitHub repo. The Pages git integration puts branch
#    previews on their own HOSTNAME, and site/fb-env.js `detectDevLane()` keys
#    the dev lane on a `/dev/` PATH — on a preview hostname it returns false and
#    the dev lane silently reads/writes PRODUCTION Firestore collections.
#    catalog-platform/docs/DOMAIN_AND_HOSTING.md §2.3.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Manual trigger; promote.yml dispatches this after moving `prod`
    inputs:
      notify:
        description: 'Run new-book detection + Discord notification (set by promote.yml)'
        type: boolean
        default: false

# `contents: write` is for the catalog auto-commit. The `pages:` and
# `id-token:` permissions went with GitHub Pages on 2026-08-10 (cutover step 14)
# — Cloudflare Pages authenticates with an API token, not the GITHUB_TOKEN.
permissions:
  contents: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Run tests first
  test:
    uses: ./.github/workflows/tests.yml

  # Run the JS/vitest suite (site/__tests__) — the only guard for client-side
  # regressions (e.g. review/community output-escaping). Gated like test/lint.
  js-test:
    uses: ./.github/workflows/js-tests.yml

  # Run linting
  lint:
    uses: ./.github/workflows/lint.yml

  # Build only if tests, JS tests and lint pass
  build:
    needs: [test, js-test, lint]
    runs-on: ubuntu-latest

    env:
      # A BOOLEAN, not a value: step-level `if:` cannot read the `secrets`
      # context, but it can read `env`, and job-level `env` can. Nothing here
      # exports the token itself into the job environment.
      # Flips to 'true' the moment BOTH repo secrets exist — that is the
      # Cloudflare cutover switch, and it is off until the owner throws it.
      CF_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      # Cloudflare Pages project name. Must match the project the owner creates
      # (direct upload, no git connection). Its *production branch* must be set
      # to `main`, or every deployment below lands as a preview and the custom
      # domain keeps serving stale content.
      CF_PAGES_PROJECT: audiobook-catalog

    steps:
    - name: 📥 Checkout prod branch (site root)
      uses: actions/checkout@v5
      with:
        ref: prod
        path: prod-src

    - name: 📥 Checkout main branch (dev lane)
      uses: actions/checkout@v5
      with:
        ref: main
        path: main-src

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 📦 Install dependencies
      run: |
        echo "::group::Installing Python packages"
        python -m pip install --upgrade pip
        pip install -r main-src/requirements.txt
        echo "::endgroup::"

    - name: 📊 Generate catalog (dev lane)
      working-directory: main-src
      run: |
        echo "::group::Generating audiobook catalog"
        python -m app.main
        echo "::endgroup::"
      continue-on-error: true
      # Continue even if catalog generation fails (no library in CI);
      # the committed site/ contents are what ship.

    - name: 🛡️ Guard prod content
      # Hard fail — never deploy a missing or placeholder prod site.
      # (Promote.yml runs the full guard suite; this is defense in depth.)
      run: |
        if [ ! -f "prod-src/site/index.html" ]; then
          echo "::error::prod branch has no site/index.html — refusing to deploy"
          exit 1
        fi
        if grep -q "This is a placeholder page" prod-src/site/index.html; then
          echo "::error::prod site/index.html is a placeholder — refusing to deploy"
          exit 1
        fi
        if [ ! -f "prod-src/site/catalog.csv" ]; then
          echo "::error::prod branch has no site/catalog.csv — refusing to deploy"
          exit 1
        fi
        echo "✓ prod content looks sane"

    - name: 🛡️ Guard dev content
      run: |
        if [ ! -f "main-src/site/index.html" ]; then
          echo "::error::main branch has no site/index.html — dev lane is broken (check .gitignore?)"
          exit 1
        fi
        echo "✓ dev content present"

    - name: 🧩 Assemble two-lane artifact
      run: |
        echo "::group::Assembling site (root=prod, /dev=main)"
        mkdir -p _site
        cp -r prod-src/site/. _site/
        rm -rf _site/dev
        mkdir -p _site/dev
        cp -r main-src/site/. _site/dev/
        # ⚠️ THE EBOOK MANIFEST NEVER SHIPS. Owner directive 2026-08-17:
        # "I don't want people scraping my books." site/ebooks.json is
        # gitignored on main as of that day, so main-src cannot carry it —
        # but the PROD branch still holds the last committed copy until a
        # promote moves the removal across, and prod-src/site/. is copied
        # verbatim into the site ROOT. This line is what closes prod on the
        # very next push to main instead of on the next promote, because the
        # workflow file itself comes from the triggering ref.
        # It stays after the promote too: a mechanical guard beats a written
        # rule, and an accidental re-negation in .gitignore would otherwise
        # republish the whole shelf silently.
        rm -f _site/ebooks.json _site/dev/ebooks.json
        if [ -f "_site/ebooks.json" ] || [ -f "_site/dev/ebooks.json" ]; then
          echo "::error::ebooks.json survived the strip — refusing to publish the shelf"
          exit 1
        fi
        echo "✓ ebooks.json is absent from both lanes (gated manifest, not a public file)"
        echo "Root files:  $(find _site -maxdepth 1 -type f | wc -l)"
        echo "Dev files:   $(find _site/dev -maxdepth 1 -type f | wc -l)"
        echo "Total size:  $(du -sh _site | cut -f1)"
        echo "::endgroup::"

    # ---- Cloudflare Pages lane (direct upload) -----------------------------
    # Publishes the SAME `_site` that GitHub Pages gets: root = prod branch,
    # /dev/ = main branch. Because the dev lane stays a PATH, site/fb-env.js
    # `detectDevLane()` behaves identically on both hosts and the dev lane keeps
    # writing *_dev Firestore collections. This is the whole reason direct
    # upload is used instead of the Pages git integration (DOMAIN_AND_HOSTING.md
    # §2.3 / §5).
    #
    # ⚠️ `continue-on-error` was REMOVED on 2026-08-10 (cutover step 14), and its
    # removal is the point of that step. It existed so a Cloudflare failure could
    # not fail the build job and thereby block the GitHub Pages deploy that
    # depended on it — correct while both hosts published, and actively wrong
    # now: with Cloudflare the only publisher, keeping it would turn a failed
    # publish into a green run that shipped nothing.
    - name: ☁️ Publish to Cloudflare Pages
      id: cf_pages
      if: env.CF_CONFIGURED == 'true'
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: >-
          pages deploy _site
          --project-name=${{ env.CF_PAGES_PROJECT }}
          --branch=main
          --commit-dirty=true

    # ---- NO shared-index push here — REMOVED 2026-08-17 --------------------
    # There WAS a "🔗 Push catalog snapshot to shared index" step here
    # (`python -m app.index_push`, guarded by the INDEX_PUSH_TOKEN secret). It
    # is gone, and must not come back. Owner decision 2026-08-17 ("option A"):
    # the LOCAL pipeline is the index's one writer — scripts/sync_to_drive.py
    # STEP 7, running on the machine that owns the library.
    #
    # ⚠️ WHY CI CAN NEVER DO THIS JOB: the snapshot carries the EBOOK rows as
    # well as the audiobooks, and those come from site/ebooks.json — which is
    # GITIGNORED, because this repo is PUBLIC and a tracked manifest is
    # world-readable at a raw URL (owner: "I don't want people scraping my
    # books"). A checkout therefore has no manifest, and because the push is a
    # snapshot REPLACE for the whole `audiobook` source, a CI push does not
    # merely miss new ebooks — it DELETES all 168 ebook rows from estate
    # search, silently, on every deploy. No secret or token fixes that; only
    # having the file does.
    #
    # The `INDEX_PUSH_TOKEN` repo secret was retired the same day (the Worker's
    # INDEX_PUSH_TOKEN_AUDIOBOOK was rotated, so any surviving copy is inert).
    # Runbook: docs/access/PIPELINE.md "STEP 7".

    - name: ⚠️ Cloudflare publish failed (GitHub Pages unaffected)
      if: env.CF_CONFIGURED == 'true' && steps.cf_pages.outcome == 'failure'
      run: |
        echo "::warning::Cloudflare Pages publish FAILED — GitHub Pages is still serving the site."
        echo "::warning::Check the project name (${CF_PAGES_PROJECT}), the API token scopes, and that the project exists. docs/access/pages-migration.md"

    - name: ✅ Build summary
      run: |
        echo "::notice::Two-lane site built (root=prod branch, /dev/=main branch)"
        if [ "$CF_CONFIGURED" = "true" ]; then
          echo "::notice::Cloudflare Pages publish: ${{ steps.cf_pages.outcome }} (project ${CF_PAGES_PROJECT})"
        else
          echo "::notice::Cloudflare Pages publish SKIPPED — CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set. NOTHING WAS PUBLISHED."
        fi

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: ✅ Deployment summary
      run: |
        echo "::notice::Published to Cloudflare Pages by the build job."
        echo "::notice::Live site: ${{ vars.SITE_URL }}"
        echo "::notice::Dev lane:  ${{ vars.SITE_URL }}dev/"

    # ---- New-book notification: only when promote.yml dispatched us ----

    - name: 📥 Checkout code
      if: github.event_name == 'workflow_dispatch' && inputs.notify
      uses: actions/checkout@v5
      with:
        fetch-depth: 2  # Fetch last 2 commits to compare

    - name: 🐍 Set up Python
      if: github.event_name == 'workflow_dispatch' && inputs.notify
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 📦 Install dependencies
      if: github.event_name == 'workflow_dispatch' && inputs.notify
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🔍 Detect new books
      if: github.event_name == 'workflow_dispatch' && inputs.notify
      id: detect_books
      run: |
        python -m app.tools.detect_new_books
      continue-on-error: true

    - name: 📢 Notify Discord
      if: github.event_name == 'workflow_dispatch' && inputs.notify && steps.detect_books.outputs.has_new_books == 'true'
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        # ⚠️ The repo VARIABLE `SITE_URL` is now the ONLY source, and it must
        # stay set. The old `steps.deployment.outputs.page_url` fallbacks died
        # with the GitHub Pages jobs on 2026-08-10 (cutover step 14) — they were
        # removed rather than left in place, because a reference to a step that
        # no longer exists evaluates to empty and would have silently handed the
        # link to send_discord_notification.py's hardcoded old-host default.
        # If this is ever empty, the Discord post links to skymitch9.github.io,
        # which after step 15 does not exist at all.
        SITE_URL: ${{ vars.SITE_URL }}
      run: |
        python -m app.tools.send_discord_notification

    - name: 💾 Save catalog snapshot
      if: github.event_name == 'workflow_dispatch' && inputs.notify && steps.detect_books.outputs.has_new_books == 'true'
      run: |
        python -m app.tools.detect_new_books --update-snapshot
        if [ -f "last_catalog_snapshot.json" ]; then
          git config user.email "nbaslamking@gmail.com"
          git config user.name "BookBuddy Bot"
          git add last_catalog_snapshot.json
          git diff --cached --quiet || git commit -m "chore: Update catalog snapshot [skip ci]"
          git push || true
        fi
