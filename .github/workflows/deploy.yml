name: Deploy site (GitHub Pages + Cloudflare Pages)

# Two-lane deploy:
#   - Site root (prod) is ALWAYS built from the `prod` branch. Humans never push
#     to `prod`; it only moves via the "Promote to Prod" workflow (promote.yml),
#     which runs guard checks first.
#   - /dev/ is built from `main` on every push, so main can break freely without
#     affecting prod.
#
# HOSTS (migration in progress — see docs/access/pages-migration.md):
#   - GitHub Pages   skymitch9.github.io/audiobook_catalog/  — LIVE today
#   - Cloudflare Pages (direct upload)                       — parallel publish,
#     INERT until CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID exist as repo
#     secrets. Both hosts receive the SAME assembled `_site`, so the two-lane
#     semantics are identical on both.
#
# ⚠️ The Cloudflare Pages project MUST stay a direct-upload project. Never
#    connect it to this GitHub repo. The Pages git integration puts branch
#    previews on their own HOSTNAME, and site/fb-env.js `detectDevLane()` keys
#    the dev lane on a `/dev/` PATH — on a preview hostname it returns false and
#    the dev lane silently reads/writes PRODUCTION Firestore collections.
#    catalog-platform/docs/DOMAIN_AND_HOSTING.md §2.3.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Manual trigger; promote.yml dispatches this after moving `prod`
    inputs:
      notify:
        description: 'Run new-book detection + Discord notification (set by promote.yml)'
        type: boolean
        default: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Run tests first
  test:
    uses: ./.github/workflows/tests.yml

  # Run linting
  lint:
    uses: ./.github/workflows/lint.yml

  # Build only if tests and lint pass
  build:
    needs: [test, lint]
    runs-on: ubuntu-latest

    env:
      # A BOOLEAN, not a value: step-level `if:` cannot read the `secrets`
      # context, but it can read `env`, and job-level `env` can. Nothing here
      # exports the token itself into the job environment.
      # Flips to 'true' the moment BOTH repo secrets exist — that is the
      # Cloudflare cutover switch, and it is off until the owner throws it.
      CF_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      # Cloudflare Pages project name. Must match the project the owner creates
      # (direct upload, no git connection). Its *production branch* must be set
      # to `main`, or every deployment below lands as a preview and the custom
      # domain keeps serving stale content.
      CF_PAGES_PROJECT: audiobook-catalog

    steps:
    - name: 📥 Checkout prod branch (site root)
      uses: actions/checkout@v5
      with:
        ref: prod
        path: prod-src

    - name: 📥 Checkout main branch (dev lane)
      uses: actions/checkout@v5
      with:
        ref: main
        path: main-src

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 📦 Install dependencies
      run: |
        echo "::group::Installing Python packages"
        python -m pip install --upgrade pip
        pip install -r main-src/requirements.txt
        echo "::endgroup::"

    - name: 📊 Generate catalog (dev lane)
      working-directory: main-src
      run: |
        echo "::group::Generating audiobook catalog"
        python -m app.main
        echo "::endgroup::"
      continue-on-error: true
      # Continue even if catalog generation fails (no library in CI);
      # the committed site/ contents are what ship.

    - name: 🛡️ Guard prod content
      # Hard fail — never deploy a missing or placeholder prod site.
      # (Promote.yml runs the full guard suite; this is defense in depth.)
      run: |
        if [ ! -f "prod-src/site/index.html" ]; then
          echo "::error::prod branch has no site/index.html — refusing to deploy"
          exit 1
        fi
        if grep -q "This is a placeholder page" prod-src/site/index.html; then
          echo "::error::prod site/index.html is a placeholder — refusing to deploy"
          exit 1
        fi
        if [ ! -f "prod-src/site/catalog.csv" ]; then
          echo "::error::prod branch has no site/catalog.csv — refusing to deploy"
          exit 1
        fi
        echo "✓ prod content looks sane"

    - name: 🛡️ Guard dev content
      run: |
        if [ ! -f "main-src/site/index.html" ]; then
          echo "::error::main branch has no site/index.html — dev lane is broken (check .gitignore?)"
          exit 1
        fi
        echo "✓ dev content present"

    - name: 🧩 Assemble two-lane artifact
      run: |
        echo "::group::Assembling site (root=prod, /dev=main)"
        mkdir -p _site
        cp -r prod-src/site/. _site/
        rm -rf _site/dev
        mkdir -p _site/dev
        cp -r main-src/site/. _site/dev/
        echo "Root files:  $(find _site -maxdepth 1 -type f | wc -l)"
        echo "Dev files:   $(find _site/dev -maxdepth 1 -type f | wc -l)"
        echo "Total size:  $(du -sh _site | cut -f1)"
        echo "::endgroup::"

    # ---- GitHub Pages lane -------------------------------------------------
    # ⚠️ REMOVE-ON-CUTOVER BLOCK A (see docs/access/pages-migration.md, step 14)
    # These two steps, the `deploy` job's first three steps, the `pages:` /
    # `id-token:` permissions and the `github-pages` environment are the whole
    # GitHub Pages path. They stay until the grace period ends.
    - name: 📄 Setup Pages
      uses: actions/configure-pages@v5

    - name: 📦 Upload artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: './_site'
    # ---- end REMOVE-ON-CUTOVER BLOCK A -------------------------------------

    # ---- Cloudflare Pages lane (direct upload) -----------------------------
    # Publishes the SAME `_site` that GitHub Pages gets: root = prod branch,
    # /dev/ = main branch. Because the dev lane stays a PATH, site/fb-env.js
    # `detectDevLane()` behaves identically on both hosts and the dev lane keeps
    # writing *_dev Firestore collections. This is the whole reason direct
    # upload is used instead of the Pages git integration (DOMAIN_AND_HOSTING.md
    # §2.3 / §5).
    #
    # Skipped entirely until both secrets exist, so this commit is inert on the
    # live site. `continue-on-error` keeps a Cloudflare problem from failing the
    # build job and thereby blocking the GitHub Pages deploy job that needs it —
    # drop it together with REMOVE-ON-CUTOVER BLOCK A.
    - name: ☁️ Publish to Cloudflare Pages
      id: cf_pages
      if: env.CF_CONFIGURED == 'true'
      uses: cloudflare/wrangler-action@v3
      continue-on-error: true
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: >-
          pages deploy _site
          --project-name=${{ env.CF_PAGES_PROJECT }}
          --branch=main
          --commit-dirty=true

    - name: ⚠️ Cloudflare publish failed (GitHub Pages unaffected)
      if: env.CF_CONFIGURED == 'true' && steps.cf_pages.outcome == 'failure'
      run: |
        echo "::warning::Cloudflare Pages publish FAILED — GitHub Pages is still serving the site."
        echo "::warning::Check the project name (${CF_PAGES_PROJECT}), the API token scopes, and that the project exists. docs/access/pages-migration.md"

    - name: ✅ Build summary
      run: |
        echo "::notice::Two-lane site built (root=prod branch, /dev/=main branch)"
        if [ "$CF_CONFIGURED" = "true" ]; then
          echo "::notice::Cloudflare Pages publish: ${{ steps.cf_pages.outcome }} (project ${CF_PAGES_PROJECT})"
        else
          echo "::notice::Cloudflare Pages publish SKIPPED — CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set. GitHub Pages only."
        fi

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
    # ⚠️ REMOVE-ON-CUTOVER BLOCK B (see docs/access/pages-migration.md, step 14)
    - name: 🚀 Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
      continue-on-error: true

    - name: 🔁 Retry deploy (Pages transient "try again later" errors)
      id: deployment_retry
      if: steps.deployment.outcome == 'failure'
      uses: actions/deploy-pages@v5
    # ---- end REMOVE-ON-CUTOVER BLOCK B -------------------------------------

    - name: ✅ Deployment summary
      run: |
        echo "::notice::Deployment completed successfully"
        echo "::notice::GitHub Pages prod URL: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}"
        echo "::notice::GitHub Pages dev URL:  ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}dev/"
        echo "::notice::Canonical SITE_URL for notifications: ${{ vars.SITE_URL || steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}"

    # ---- New-book notification: only when promote.yml dispatched us ----

    - name: 📥 Checkout code
      if: github.event_name == 'workflow_dispatch' && inputs.notify
      uses: actions/checkout@v5
      with:
        fetch-depth: 2  # Fetch last 2 commits to compare

    - name: 🐍 Set up Python
      if: github.event_name == 'workflow_dispatch' && inputs.notify
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 📦 Install dependencies
      if: github.event_name == 'workflow_dispatch' && inputs.notify
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🔍 Detect new books
      if: github.event_name == 'workflow_dispatch' && inputs.notify
      id: detect_books
      run: |
        python -m app.tools.detect_new_books
      continue-on-error: true

    - name: 📢 Notify Discord
      if: github.event_name == 'workflow_dispatch' && inputs.notify && steps.detect_books.outputs.has_new_books == 'true'
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        # Repo VARIABLE `SITE_URL` wins when set — that is the one-knob cutover
        # for the Discord link, and it is what keeps this working after
        # REMOVE-ON-CUTOVER BLOCK B goes (deploy-pages' page_url output dies
        # with it; DOMAIN_AND_HOSTING.md §2.7 row 3). The retry fallback also
        # fixes a latent bug: when the first deploy failed and the retry
        # succeeded, page_url was empty and the link silently fell back to
        # send_discord_notification.py's hardcoded default.
        SITE_URL: ${{ vars.SITE_URL || steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
      run: |
        python -m app.tools.send_discord_notification

    - name: 💾 Save catalog snapshot
      if: github.event_name == 'workflow_dispatch' && inputs.notify && steps.detect_books.outputs.has_new_books == 'true'
      run: |
        python -m app.tools.detect_new_books --update-snapshot
        if [ -f "last_catalog_snapshot.json" ]; then
          git config user.email "nbaslamking@gmail.com"
          git config user.name "BookBuddy Bot"
          git add last_catalog_snapshot.json
          git diff --cached --quiet || git commit -m "chore: Update catalog snapshot [skip ci]"
          git push || true
        fi
