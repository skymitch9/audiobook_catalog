name: Promote to Prod

# The ONLY way `prod` (the site root) moves.
#
#   Promote:  Run this workflow with ref = main (the default).
#   Rollback: Run it with ref = any previous prod-* tag (or commit SHA).
#
# Guard checks run first — a gitignored site/, a placeholder index, or a
# shrunken catalog fails the promotion and prod keeps serving the last good
# deploy.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to promote (use a prod-* tag to roll back)'
        default: 'main'
      force:
        description: 'Skip the catalog-shrink check (only for intentional bulk removals)'
        type: boolean
        default: false

permissions:
  contents: write  # push prod branch + tags
  actions: write   # dispatch deploy.yml

concurrency:
  group: "promote"
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout ${{ inputs.ref }}
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0

    - name: 🛡️ Critical paths are tracked, not gitignored
      # ⚠️ site/covers was in this list until 2026-08-10 and is deliberately
      # NOT any more: cover art moved to Cloudflare R2 and site/covers/ is now
      # gitignored on purpose (see .gitignore, and DOMAIN_AND_HOSTING.md
      # §2.6(a)). That removal HAD to ship in the same commit as the
      # .gitignore edit and the `git rm -r --cached site/covers`, or the very
      # next promote would fail on a guard doing its job.
      #
      # Everything else in the list stays. Gitignoring site/ once caused a
      # full outage and this guard is why it cannot happen again — do not
      # "simplify" it.
      #
      # Covers are still gated, just differently, and the check branches on
      # the ref being promoted so that ROLLING BACK to a pre-R2 prod-* tag
      # still works: those refs have covers in git and no manifest, and a flat
      # "manifest must be tracked" rule would refuse every one of them.
      run: |
        fail=0
        for p in site/index.html site/catalog.csv site/static; do
          if git check-ignore -q "$p"; then
            echo "::error::$p is matched by .gitignore — this is the outage bug, refusing to promote"
            fail=1
          fi
        done
        for p in site/index.html site/catalog.csv; do
          if ! git ls-files --error-unmatch "$p" > /dev/null 2>&1; then
            echo "::error::$p is not tracked in git — refusing to promote"
            fail=1
          fi
        done
        # Covers: EITHER committed (refs before 2026-08-10) OR in R2 with a
        # tracked manifest. Never neither.
        #
        # ⚠️ Do NOT branch on `git check-ignore site/covers`. The ignore
        # pattern is `site/covers/`, which matches a DIRECTORY only, and on a
        # fresh CI checkout that directory does not exist — check-ignore then
        # answers "not ignored" and the R2 branch is silently skipped, i.e.
        # the guard stops checking anything in exactly the environment it runs
        # in. Measured on a clean worktree. Branch on what git TRACKS instead.
        if [ -n "$(git ls-files site/covers | head -1)" ]; then
          echo "✓ covers are committed to git on this ref (pre-R2)"
        elif git ls-files --error-unmatch site/covers_manifest.json > /dev/null 2>&1; then
          # encoding= is not optional: the manifest holds non-ASCII author
          # names and open() otherwise uses the locale codec.
          n=$(python3 -c 'import json; print(json.load(open("site/covers_manifest.json", encoding="utf-8"))["count"])' 2>/dev/null || echo '?')
          echo "✓ covers served from Cloudflare R2 ($n objects in the manifest)"
        else
          echo "::error::no covers tracked in git and no site/covers_manifest.json — every cover would 404. Refusing to promote"
          fail=1
        fi
        exit $fail

    - name: 🛡️ Site content is real (not placeholder)
      run: |
        if [ ! -f "site/index.html" ]; then
          echo "::error::site/index.html missing"
          exit 1
        fi
        if grep -q "This is a placeholder page" site/index.html; then
          echo "::error::site/index.html is the CI placeholder — refusing to promote"
          exit 1
        fi
        echo "✓ index.html is real ($(du -h site/index.html | cut -f1))"

    - name: 🛡️ Catalog must not shrink
      if: ${{ !inputs.force }}
      run: |
        python3 - << 'EOF'
        import csv, json, sys

        with open("last_catalog_snapshot.json", encoding="utf-8") as f:
            snapshot_count = len(json.load(f)["book_ids"])
        with open("site/catalog.csv", encoding="utf-8") as f:
            csv_count = sum(1 for _ in csv.DictReader(f))

        TOLERANCE = 3
        print(f"catalog.csv: {csv_count} books, snapshot: {snapshot_count} books")
        if csv_count < snapshot_count - TOLERANCE:
            print(f"::error::Catalog shrank by {snapshot_count - csv_count} books "
                  f"(tolerance {TOLERANCE}). If intentional, re-run with force=true.")
            sys.exit(1)
        print("✓ catalog size OK")
        EOF

    - name: 🛡️ Core features audit (covers, authors, narrators, drive links)
      # Every book must have an author, a narrator, and a cover file on disk;
      # every author must resolve in author_drive_map.json or be explicitly
      # excluded in scripts/audit_exclusions.json.
      run: |
        if [ -f "app/tools/audit_site.py" ]; then
          python3 -m app.tools.audit_site
        else
          echo "::warning::app/tools/audit_site.py not present on this ref (old rollback target?) — skipping core-features audit"
        fi

  promote:
    needs: guard
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout ${{ inputs.ref }}
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0

    - name: 🚀 Move prod branch
      run: |
        sha=$(git rev-parse HEAD)
        echo "Promoting $sha (${{ inputs.ref }}) to prod"
        # Force push is safe: this workflow is the only writer of prod,
        # and rollbacks legitimately move it backward.
        git push origin "+${sha}:refs/heads/prod"

    - name: 🏷️ Tag promotion
      run: |
        tag="prod-$(date -u +%Y%m%d-%H%M%S)"
        git tag "$tag" HEAD
        git push origin "$tag"
        echo "::notice::Tagged $tag — roll back later by promoting this tag"

    - name: 🚀 Trigger deploy
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh workflow run deploy.yml --ref main -f notify=true
        echo "::notice::Deploy dispatched — prod goes live when it finishes"
