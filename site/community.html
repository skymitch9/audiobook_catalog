<!DOCTYPE html>
<html lang="en" data-default-theme="cyberpunk" data-default-mode="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Estate theme system: token contract + pre-paint switcher. Fonts are
     self-hosted under static/fonts/ (no third-party requests). theme.js is
     synchronous on purpose so the stored theme/mode land on <html> before
     first paint; it also migrates the legacy ab_theme key once. -->
<link rel="stylesheet" href="static/css/estate-theme.css">
<link rel="stylesheet" href="static/css/ab-bridge.css">
<script src="static/js/theme.js"></script>
<title>Community - Audiobook Catalog</title>
<link rel="icon" type="image/png" href="static/img/favicon.png">
<style>
/* Palette lives in static/css/estate-theme.css (the --et-* token contract:
   cyberpunk / apple / retro, each light + dark) with ab-bridge.css aliasing
   this page's legacy names (--bg, --neon-*, …) onto it. theme.js stamps
   data-theme/data-mode on <html>; the old html.light mechanism is gone. */
*{box-sizing:border-box}
body{
  margin:0; padding:20px;
  min-height:100vh;
}
#wrap{max-width:900px;margin:0 auto}
h1{
  color:var(--neon-yellow);text-transform:var(--et-title-case);letter-spacing:var(--et-title-spacing);
  text-shadow:var(--et-glow-title);margin:0 0 8px;
  font-family:var(--et-font-display);
}
.nav-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.nav-link{
  display:inline-block;padding:8px 14px;background:var(--bg-2);color:var(--neon-cyan);
  text-decoration:none;border:1px solid var(--border);font-weight:700;font-size:.85em;
  text-transform:var(--et-title-case);letter-spacing:.5px;transition:all .2s;
}
.nav-link:hover{border-color:var(--neon-cyan);box-shadow: var(--et-glow)}
#search-input{
  flex:1;min-width:200px;padding:8px 12px;border:1px solid var(--border);
  background:var(--bg-2);color:var(--text);font-size:.9em;
  font-family:var(--et-font-mono);
}
#search-input:focus{outline:none;border-color:var(--neon-cyan)}
.clubs-banner{
  display:flex;align-items:center;gap:16px;margin-top:16px;padding:20px 24px;
  background:var(--bg-2);border:1px solid var(--neon-cyan);text-decoration:none;color:var(--text);
  clip-path:var(--et-clip-panel);
  transition:box-shadow .2s;
}
.clubs-banner:hover{box-shadow: var(--et-shadow-lift)}
.cb-icon{font-size:2.4em}
.cb-title{display:block;font-size:1.3em;font-weight:700;color:var(--neon-cyan);text-transform:var(--et-title-case);letter-spacing:var(--et-title-spacing);font-family:var(--et-font-display)}
#cb-new-badge{
  padding:2px 9px;border:1px solid var(--neon-magenta);color:var(--neon-magenta);
  font-size:.6em;letter-spacing:.5px;vertical-align:middle;font-family:var(--et-font-mono);
}
.cb-sub{display:block;color:var(--muted);font-size:.92em;margin-top:2px}
.cb-arrow{margin-left:auto;font-size:1.8em;color:var(--neon-cyan)}
.user-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:16px}
.user-card{
  background:var(--bg-2);border:1px solid var(--border);padding:20px;
  clip-path:var(--et-clip-panel);
  transition:border-color .2s; cursor:pointer;
}
.user-card:hover{border-color:var(--neon-magenta)}
.user-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.user-avatar{width:48px;height:48px;border-radius:50%;border:2px solid var(--neon-cyan);object-fit:cover}
.user-name{font-weight:700;font-size:1.2em;color:var(--neon-cyan);text-transform:var(--et-title-case);letter-spacing:.5px}
.user-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0}
.stat-box{background:var(--bg);border:1px solid var(--border);padding:8px;text-align:center}
/* The TBR media split (2026-08-26). Chips, deliberately NOT a stat box:
   the two numbers do not sum to the TBR count beside them, and a box
   would read as another total. */
.tbr-media{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.tbr-media-chip{font-size:.78em;padding:2px 9px;border-radius:999px;border:1px solid var(--border);background:var(--bg);color:var(--muted);white-space:nowrap}
.stat-val{font-size:1.3em;font-weight:700;color:var(--neon-yellow);font-family:var(--et-font-mono)}
.stat-lbl{font-size:.7em;color:var(--muted);text-transform:var(--et-title-case)}
.user-reading{font-size:.9em;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:8px}
.user-reading strong{color:var(--neon-magenta)}
.user-reading img{width:36px;height:auto;border-radius:2px;border:1px solid var(--border)}
.user-favs{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
/* Owner-only estate-admin entry point — quiet by design */
.estate-admin-link{display:inline-block;margin-top:8px;font-size:.82em;color:var(--muted);text-decoration:none}
.estate-admin-link:hover{color:var(--neon-cyan);text-decoration:underline}
.user-favs img{width:44px;height:auto;border-radius:2px;border:1px solid var(--border)}
.fav-chip{
  display:inline-block;padding:3px 8px;margin:2px;font-size:.8em;
  background:var(--bg);border:1px solid var(--border);color:var(--text);
}
.loading{text-align:center;padding:40px;color:var(--muted);font-family:var(--et-font-mono)}
.empty{text-align:center;padding:30px;color:var(--muted)}
#user-count{color:var(--muted);font-size:.85em;font-family:var(--et-font-mono)}
/* User modal */
#user-modal{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.85);z-index:9999;padding:20px;backdrop-filter:blur(4px);
}
#user-modal.open{display:flex}
.user-modal-panel{
  background:var(--bg-2);border:1px solid var(--neon-cyan);
  width:min(520px,92vw);padding:32px;position:relative;
  clip-path:var(--et-clip-panel);
}
.user-modal-close{
  position:absolute;top:12px;right:12px;background:none;border:1px solid var(--neon-magenta);
  color:var(--neon-magenta);width:30px;height:30px;cursor:pointer;font-weight:bold;
}
.user-modal-close:hover{background:var(--neon-magenta);color:#fff}
.um-avatar{width:80px;height:80px;border-radius:50%;border:3px solid var(--neon-cyan);object-fit:cover}
.um-name{font-size:1.6em;font-weight:700;color:var(--neon-cyan);text-transform:var(--et-title-case);letter-spacing:var(--et-title-spacing)}
.um-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.um-stat{background:var(--bg);border:1px solid var(--border);padding:14px;text-align:center}
.um-stat-val{font-size:1.8em;font-weight:700;color:var(--neon-yellow);font-family:var(--et-font-mono)}
.um-stat-lbl{font-size:.75em;color:var(--muted);text-transform:var(--et-title-case)}
.um-section{margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.um-section-title{font-size:.85em;color:var(--neon-magenta);text-transform:var(--et-title-case);letter-spacing:.5px;margin-bottom:8px}
.um-favs{display:flex;gap:8px;flex-wrap:wrap}
.um-years{display:flex;gap:8px;flex-wrap:wrap}
.um-year{
  padding:6px 12px;background:var(--bg);border:1px solid var(--border);
  font-family:var(--et-font-mono);font-size:.9em;color:var(--neon-yellow);
}
.um-year strong{color:var(--muted);font-weight:400;margin-right:6px}
.um-clubs{display:flex;flex-direction:column;gap:8px}
.um-club{
  display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg);
  border:1px solid var(--border);color:var(--neon-cyan);text-decoration:none;font-weight:700;
}
.um-club:hover{border-color:var(--neon-cyan)}
.um-club img{width:32px;height:auto;border:1px solid var(--border)}
.um-club-emoji{font-size:1.4em}
.um-favs img{width:64px;height:auto;border-radius:3px;border:1px solid var(--border)}
@media(max-width:600px){
  body{padding:10px}
  .nav-row{gap:6px}
  .nav-link{flex:1 1 auto;text-align:center;padding:11px 8px;min-height:44px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
  #search-input{width:100%}
  .user-grid{grid-template-columns:1fr}
  .user-card{clip-path:none}
  .user-modal-panel{width:95vw;clip-path:none;padding:16px}
}

/* Sign-in / user chip (shared identity bar) */
#identity-bar{margin-left:auto}
.identity-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.identity-bar__greeting{font-weight:700;color:var(--neon-cyan,#05d9e8)}
.identity-bar__google-btn{
  display:inline-flex;align-items:center;padding:8px 14px;border:1px solid var(--border,#2a2a3a);
  background:var(--bg-2,#12121f);color:var(--text,#e8e6e3);font-weight:700;font-size:.85em;
  cursor:pointer;transition:all .2s;font-family:inherit;
}
.identity-bar__google-btn:hover{border-color:var(--neon-cyan,#05d9e8)}
.identity-bar__google-btn:disabled{opacity:.6;cursor:wait}
.identity-bar__logout-btn{
  background:none;border:1px solid var(--border,#2a2a3a);color:var(--muted,#8a8f98);cursor:pointer;
  font-size:.75em;padding:4px 10px;font-family:inherit;text-transform:var(--et-title-case);letter-spacing:.5px;
}
.identity-bar__logout-btn:hover{border-color:var(--neon-magenta,#ff2a6d);color:var(--neon-magenta,#ff2a6d)}

.nav-link.active{border-color:var(--neon-cyan,#05d9e8);color:var(--neon-yellow,#fcee0a)}


/* =============== CYBERPUNK IDENTITY RESTORES ===============
   Owner, 2026-08-14: "/dev/ and the existing page don't look the same."
   Pre-theme literals (a202f4a), verbatim, scoped to the default theme so
   the other themes keep their honest token rendering. */
html[data-theme="cyberpunk"] h1{letter-spacing:2px}
html[data-theme="cyberpunk"] .nav-link:hover{box-shadow:0 0 8px rgba(5,217,232,.2)}
html[data-theme="cyberpunk"] .cb-title{letter-spacing:1.5px}
html[data-theme="cyberpunk"] .um-name{letter-spacing:1px}
/* Cards/modal drop their clips on small screens (base rules above, by order);
   these higher-specificity restores must not undo that. */
@media(min-width:601px){
  html[data-theme="cyberpunk"] .user-card{clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
  html[data-theme="cyberpunk"] .user-modal-panel{clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
}
</style>
</head>
<body>
<div id="wrap">
  <h1>Community</h1>
  <div class="nav-row">
    <a href="index.html" class="nav-link">Catalog</a>
    <a href="community.html" class="nav-link active">Community</a>
    <a href="clubs.html" class="nav-link">Clubs</a>
    <a href="stats.html" class="nav-link">Stats</a>
    <a href="guess-game.html" class="nav-link">Game</a>
    <input id="search-input" type="search" placeholder="Search users..." />
    <span id="user-count"></span>
    <div id="identity-bar"></div>
  </div>
  <a href="clubs.html" class="clubs-banner">
    <span class="cb-icon">📚</span>
    <span class="cb-text">
      <span class="cb-title">Book Clubs <span id="cb-new-badge" style="display:none"></span></span>
      <!-- COPY TRIM 2026-08-18. Cut "Read together, chapter by chapter —",
           which restated the banner title above it. What is left is now the
           exact tail of the live string this element is REPLACED with once the
           club count loads (see clubs-banner-sub below, "N clubs reading right
           now — …"), so the pre-load fallback and the loaded line read as one
           sentence rather than two different pitches. -->
      <span class="cb-sub" id="clubs-banner-sub">Spoiler-safe chapter discussions, votes, and quotes</span>
    </span>
    <span class="cb-arrow">→</span>
  </a>

  <div id="user-grid" class="user-grid">
    <div class="loading">Loading community...</div>
  </div>
</div>

<!-- User Profile Modal -->
<div id="user-modal">
  <div class="user-modal-panel">
    <button class="user-modal-close" id="user-modal-close">X</button>
    <div id="user-modal-content"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
  import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
  import { col, FIREBASE_CONFIG } from './fb-env.js';
  import { getSession, slugifyName} from './identity.js';
  import { mountAccountModal } from './account-modal.js';
  import { clubActivity } from './club-notify.js';
  import { coverUrl } from './covers-base.js';
  // ⚠️ The ONE fold — see `foldReadingList` in reviews.js. The TBR number on
  // these cards and the number index.html's filter reports must agree, so both
  // read it from the same function rather than each counting documents.
  // ⚠️ `readingListMediaCounts` rides the SAME fold (2026-08-26, owner: "I
  // don't see the tag for what type of media a book is"). It counts folded
  // BOOKS, and its two numbers deliberately do not sum to the total — a book on
  // the list in two media is counted in both, which is what it is.
  import { foldReadingList, readingListMediaCounts } from './reviews.js';

  /**
   * The media split behind a TBR number - owner, 2026-08-26: *"I don't see the
   * tag for what type of media a book is."*
   *
   * WARNING: ONLY NUMBERS ARE INTERPOLATED. `readingListMediaCounts` returns
   * integers this page computed; no Firestore string reaches this markup, which
   * is the rule `community-escaping.test.js` exists to keep.
   *
   * WARNING: the two numbers do NOT sum to the TBR count and are not meant to:
   * a book on the list in both media is counted in both. Rendered as chips,
   * never as a split of a whole.
   *
   * There is no ebook chip, and its absence is deliberate - see
   * `readingListMediaTags` in reviews.js. The ebook shelf is permission-gated,
   * so a public page cannot honestly say what is on it.
   */
  function tbrMediaChips(media) {
    const m = media || { library: 0, audiobook: 0 };
    const lib = Number(m.library) || 0;
    const aud = Number(m.audiobook) || 0;
    if (!lib && !aud) return '';
    const chips = [];
    if (lib) chips.push(`<span class="tbr-media-chip">\u{1F4D5} ${lib} Library</span>`);
    if (aud) chips.push(`<span class="tbr-media-chip">\u{1F3A7} ${aud} Audiobook</span>`);
    return `<div class="tbr-media">${chips.join('')}</div>`;
  }


  // "N new" on the Clubs banner: unread club posts for the signed-in user
  // setTimeout defers past the module body so initializeApp below has run.
  setTimeout(async () => {
    try {
      const s = getSession();
      if (!s) return;
      const activity = await clubActivity(getFirestore(), slugifyName(s.displayName));
      const total = activity.reduce((sum, a) => sum + a.newCount, 0);
      const badge = document.getElementById('cb-new-badge');
      if (badge && total > 0) { badge.textContent = `${total} new`; badge.style.display = 'inline-block'; }
    } catch (e) { console.warn('[notify] banner badge failed:', e); }
  }, 0);

  // Canonical copy lives in site/fb-env.js
  const firebaseConfig = FIREBASE_CONFIG;

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  mountAccountModal(db, app, document.getElementById('identity-bar'));

  const grid = document.getElementById('user-grid');
  const searchInput = document.getElementById('search-input');
  const userCountEl = document.getElementById('user-count');

  // Escape user-controlled profile/review fields before innerHTML assignment.
  // Every sibling page (clubs.html, club.html, club-read.html) defines the same
  // helper for exactly these fields; community.html was the only one omitting
  // it, giving a stored/cross-user XSS on displayName/currentlyReading/
  // favorites/photoURL/club emoji. Mirrors clubs.html:escapeHtml.
  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  // "Estate admin" entry point, shown to the owner only. A convenience link,
  // NOT access control — heygabi.ai/admin is its own gate, and this reads the
  // localStorage mirror, which is editable from devtools. Spoofing it shows
  // you a link to a page that will then refuse you; it grants nothing.
  //
  // ⚠️ Deliberately NOT switched to resolveAdmin() with the rest of the admin
  // gates on 2026-08-16. Different question: this asks "are you the OWNER"
  // (for an off-site link), not "do you hold the site admin role". It is also
  // synchronous, and making it async would delay the page's first render to
  // decide whether to show one convenience link. If this ever gates anything
  // on THIS site, it must move to resolveAdmin() — see identity.js.
  //
  // Community users are display-name-only, so there is no email to carry in
  // a #member fragment; the link lands on the directory itself.
  const _session = getSession();
  const viewerIsOwner =
    !!_session && (_session.email || '').trim().toLowerCase() === 'nbaslamking@gmail.com';
  const estateAdminLink = viewerIsOwner
    ? '<a class="estate-admin-link" href="https://heygabi.ai/admin" target="_blank" rel="noreferrer">Estate admin →</a>'
    : '';

  let allUsers = [];

  async function loadCommunity() {
    try {
      // Fetch profiles and reviews in parallel
      const [profilesSnap, reviewsSnap, readingListsSnap, clubsSnap] = await Promise.all([
        getDocs(collection(db, col('profiles'))),
        getDocs(collection(db, col('reviews'))),
        getDocs(collection(db, col('readingLists'))),
        getDocs(collection(db, col('clubs')))
      ]);

      // Clubs per user (memberSlugs are lowercased display names)
      const clubsByUser = {};
      let clubCount = 0;
      clubsSnap.docs.forEach(d => {
        const data = d.data();
        clubCount++;
        (data.memberSlugs || []).forEach(slug => {
          if (!clubsByUser[slug]) clubsByUser[slug] = [];
          clubsByUser[slug].push({ id: d.id, name: data.name || d.id, cover: data.avatarCoverHref || '', emoji: data.emoji || '📚' });
        });
      });
      const bannerSub = document.getElementById('clubs-banner-sub');
      if (clubCount > 0) {
        bannerSub.textContent = `${clubCount} club${clubCount !== 1 ? 's' : ''} reading right now — spoiler-safe chapter discussions, votes, and quotes`;
      }

      // Build reading list stats per user (TBR only)
      //
      // ⚠️ COUNTED IN BOOKS, NOT DOCUMENTS — owner, 2026-08-26: *"for the tbr
      // list, it's double counting if something is owned in multiple media
      // sources."* A book recorded on this site and in the library catalogue is
      // TWO documents, because each keys its own by a slug of its own spelling
      // of the title. Counting rows counted it twice, on this card and in the
      // filter the card links to.
      //
      // ⚠️ Folded PER PERSON, never across the collection: two people wanting
      // the same book are two intentions, and folding globally would show each
      // of them a count that included the other's.
      //
      // ⚠️ What this still cannot fold is written down in `foldReadingList`'s
      // own header — the bridge that joins a paperback entry to an audiobook
      // one lives in the library's D1 and is not reachable from this page.
      const tbrByUser = {};
      readingListsSnap.docs.forEach(d => {
        const data = d.data();
        const name = (data.displayName || '').toLowerCase();
        if (!name) return;
        if (data.status !== 'tbr') return;
        if (!tbrByUser[name]) tbrByUser[name] = [];
        tbrByUser[name].push(d);
      });
      const readingStats = {};
      Object.keys(tbrByUser).forEach(name => {
        // ⚠️ Folded ONCE and reused. The count and the media split below must
        // be two readings of one fold, not two folds — a breakdown that added
        // up to something other than the number beside it is worse than none.
        const groups = foldReadingList(tbrByUser[name]);
        readingStats[name] = { tbr: groups.length, media: readingListMediaCounts(groups) };
      });

      // Build review stats per user (+ distinct books reviewed per year)
      const reviewStats = {};
      const thisYear = new Date().getFullYear();
      reviewsSnap.docs.forEach(d => {
        const data = d.data();
        const name = (data.displayName || '').toLowerCase();
        if (!name) return;
        if (!reviewStats[name]) reviewStats[name] = { count: 0, totalRating: 0, yearBooks: {} };
        reviewStats[name].count++;
        reviewStats[name].totalRating += data.rating || 0;
        try {
          const y = data.createdAt && data.createdAt.toDate ? data.createdAt.toDate().getFullYear() : null;
          if (y !== null && data.bookId) {
            if (!reviewStats[name].yearBooks[y]) reviewStats[name].yearBooks[y] = new Set();
            reviewStats[name].yearBooks[y].add(data.bookId);
          }
        } catch (e) { /* old reviews without timestamps */ }
      });
      const yearsFor = (stats) => Object.entries(stats.yearBooks || {})
        .map(([y, set]) => ({ year: y, books: set.size }))
        .sort((a, b) => b.year - a.year);
      const readThisYear = (stats) => (stats.yearBooks && stats.yearBooks[thisYear]) ? stats.yearBooks[thisYear].size : 0;

      // Build user list from profiles
      allUsers = [];
      profilesSnap.docs.forEach(d => {
        const data = d.data();
        const nameLower = (data.displayName || '').toLowerCase();
        const stats = reviewStats[nameLower] || { count: 0, totalRating: 0 };
        allUsers.push({
          displayName: data.displayName || d.id,
          clubs: clubsByUser[nameLower] || [],
          readYears: yearsFor(stats),
          readThisYear: readThisYear(stats),
          photoURL: data.photoURL || '',
          currentlyReading: data.currentlyReading || '',
          currentlyReadingCover: data.currentlyReadingCover || '',
          favorites: data.favorites || [],
          favCovers: data.favCovers || {},
          reviewCount: stats.count,
          avgRating: stats.count > 0 ? (stats.totalRating / stats.count).toFixed(1) : '—',
          gameBestStreak: data.gameBestStreak || 0,
          gameAccuracy: data.gameAccuracy || 0,
          booksTbr: (readingStats[nameLower] || {}).tbr || 0,
          tbrMedia: (readingStats[nameLower] || {}).media || { library: 0, audiobook: 0 },
        });
      });

      // Also add users who have reviews but no profile
      reviewsSnap.docs.forEach(d => {
        const data = d.data();
        const nameLower = (data.displayName || '').toLowerCase();
        if (!allUsers.find(u => u.displayName.toLowerCase() === nameLower)) {
          const stats = reviewStats[nameLower] || { count: 0, totalRating: 0 };
          allUsers.push({
            displayName: data.displayName,
            clubs: clubsByUser[nameLower] || [],
            readYears: yearsFor(stats),
            readThisYear: readThisYear(stats),
            photoURL: '',
            currentlyReading: '',
            currentlyReadingCover: '',
            favorites: [],
            favCovers: {},
            reviewCount: stats.count,
            avgRating: stats.count > 0 ? (stats.totalRating / stats.count).toFixed(1) : '—',
            gameBestStreak: 0,
            gameAccuracy: 0,
            booksTbr: (readingStats[nameLower] || {}).tbr || 0,
          tbrMedia: (readingStats[nameLower] || {}).media || { library: 0, audiobook: 0 },
          });
        }
      });

      // Sort by review count descending
      allUsers.sort((a, b) => b.reviewCount - a.reviewCount);

      renderUsers(allUsers);
    } catch (e) {
      grid.innerHTML = '<div class="empty">Failed to load community data.</div>';
      console.error(e);
    }
  }

  function renderUsers(users) {
    userCountEl.textContent = `${users.length} member${users.length !== 1 ? 's' : ''}`;

    if (users.length === 0) {
      grid.innerHTML = '<div class="empty">No users found.</div>';
      return;
    }

    grid.innerHTML = users.map(u => {
      const avatar = u.photoURL
        ? `<img class="user-avatar" src="${escapeHtml(u.photoURL)}" alt="">`
        : `<div class="user-avatar" style="display:flex;align-items:center;justify-content:center;background:var(--border);font-size:1.2em">${escapeHtml(u.displayName.charAt(0).toUpperCase())}</div>`;

      const reading = u.currentlyReading
        ? `<div class="user-reading"><strong>Reading:</strong> <span style="display:inline-flex;align-items:center;gap:6px">${u.currentlyReadingCover ? '<a href="index.html#q=' + encodeURIComponent(u.currentlyReading) + '"><img src="' + coverUrl(u.currentlyReadingCover) + '"></a>' : ''}${escapeHtml(u.currentlyReading)}</span></div>`
        : '';

      const favs = u.favorites.length > 0
        ? `<div class="user-favs">${u.favorites.map(f => {
            const cover = coverUrl(u.favCovers[f] || '');
            return cover
              ? '<a href="index.html#q=' + encodeURIComponent(f) + '"><img src="' + cover + '" title="' + escapeHtml(f) + '"></a>'
              : '<span class="fav-chip">' + escapeHtml(f) + '</span>';
          }).join('')}</div>`
        : '';

      return `
        <div class="user-card" data-name="${escapeHtml(u.displayName.toLowerCase())}">
          <div class="user-header">
            ${avatar}
            <span class="user-name">${escapeHtml(u.displayName)}</span>
          </div>
          <div class="user-stats">
            <div class="stat-box"><a href="index.html#list=reviews&user=${encodeURIComponent(u.displayName)}" style="text-decoration:none"><div class="stat-val">${u.reviewCount}</div><div class="stat-lbl">Reviews</div></a></div>
            <div class="stat-box"><div class="stat-val">${u.avgRating}</div><div class="stat-lbl">Avg Rating</div></div>
            <div class="stat-box"><div class="stat-val">${u.gameBestStreak}</div><div class="stat-lbl">Best Streak</div></div>
            <div class="stat-box"><div class="stat-val">${u.gameAccuracy}%</div><div class="stat-lbl">Game Acc</div></div>
            <div class="stat-box"><a href="index.html#list=tbr&user=${encodeURIComponent(u.displayName)}" style="text-decoration:none"><div class="stat-val">${u.booksTbr}</div><div class="stat-lbl">TBR</div></a></div>
            <div class="stat-box"><div class="stat-val">${u.clubs.length}</div><div class="stat-lbl">Clubs</div></div>
            <div class="stat-box"><div class="stat-val">${u.readThisYear}</div><div class="stat-lbl">Read ${String(new Date().getFullYear()).slice(2)}'</div></div>
          </div>
          ${tbrMediaChips(u.tbrMedia)}
          ${reading}
          ${favs}
          ${estateAdminLink}
        </div>`;
    }).join('');
  }

  // Search filter
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.toLowerCase().trim();
    if (!q) {
      renderUsers(allUsers);
      return;
    }
    const filtered = allUsers.filter(u =>
      u.displayName.toLowerCase().includes(q) ||
      u.currentlyReading.toLowerCase().includes(q) ||
      u.favorites.some(f => f.toLowerCase().includes(q))
    );
    renderUsers(filtered);
  });

  // User modal
  const userModal = document.getElementById('user-modal');
  const userModalContent = document.getElementById('user-modal-content');
  document.getElementById('user-modal-close').addEventListener('click', () => userModal.classList.remove('open'));
  userModal.addEventListener('click', (e) => { if (e.target === userModal) userModal.classList.remove('open'); });

  function openUserModal(user) {
    const avatar = user.photoURL
      ? `<img class="um-avatar" src="${escapeHtml(user.photoURL)}" alt="">`
      : `<div class="um-avatar" style="display:flex;align-items:center;justify-content:center;background:var(--border);font-size:1.6em">${escapeHtml(user.displayName.charAt(0).toUpperCase())}</div>`;

    const reading = user.currentlyReading
      ? `<div class="um-section">
          <div class="um-section-title">Currently Reading</div>
          <div style="display:flex;align-items:center;gap:12px">
            ${user.currentlyReadingCover ? '<a href="index.html#q=' + encodeURIComponent(user.currentlyReading) + '"><img src="' + coverUrl(user.currentlyReadingCover) + '" style="width:56px;height:auto;border-radius:3px;border:1px solid var(--border)"></a>' : ''}
            <span style="font-size:1.05em">${escapeHtml(user.currentlyReading)}</span>
          </div>
        </div>` : '';

    const favs = user.favorites.length > 0
      ? `<div class="um-section">
          <div class="um-section-title">Favorite Books</div>
          <div class="um-favs">${user.favorites.map(f => {
            const cover = coverUrl(user.favCovers[f] || '');
            return cover
              ? '<a href="index.html#q=' + encodeURIComponent(f) + '"><img src="' + cover + '" title="' + escapeHtml(f) + '"></a>'
              : '<span class="fav-chip" style="padding:4px 8px;border:1px solid var(--border);font-size:.85em">' + escapeHtml(f) + '</span>';
          }).join('')}</div>
        </div>` : '';

    userModalContent.innerHTML = `
      <div style="text-align:center;margin-bottom:14px">
        ${avatar}
        <div class="um-name" style="margin-top:8px">${escapeHtml(user.displayName)}</div>
      </div>
      <div class="um-stats">
        <div class="um-stat"><a href="index.html#list=reviews&user=${encodeURIComponent(user.displayName)}" style="text-decoration:none"><div class="um-stat-val">${user.reviewCount}</div><div class="um-stat-lbl">Reviews</div></a></div>
        <div class="um-stat"><div class="um-stat-val">${user.avgRating}</div><div class="um-stat-lbl">Avg Rating</div></div>
        <div class="um-stat"><div class="um-stat-val">${user.gameBestStreak}</div><div class="um-stat-lbl">Best Streak</div></div>
        <div class="um-stat"><div class="um-stat-val">${user.gameAccuracy}%</div><div class="um-stat-lbl">Game Accuracy</div></div>
        <div class="um-stat"><a href="index.html#list=tbr&user=${encodeURIComponent(user.displayName)}" style="text-decoration:none"><div class="um-stat-val">${user.booksTbr}</div><div class="um-stat-lbl">TBR</div></a></div>
        <div class="um-stat"><div class="um-stat-val">${user.clubs.length}</div><div class="um-stat-lbl">Clubs</div></div>
      </div>
      ${tbrMediaChips(user.tbrMedia)}
      ${user.readYears.length ? `
        <div class="um-section">
          <div class="um-section-title">Books Read by Year</div>
          <div class="um-years">${user.readYears.map(y =>
            `<span class="um-year"><strong>${y.year}</strong> ${y.books}</span>`).join('')}</div>
        </div>` : ''}
      ${user.clubs.length ? `
        <div class="um-section">
          <div class="um-section-title">Book Clubs</div>
          <div class="um-clubs">${user.clubs.map(c => `
            <a class="um-club" href="club.html?id=${encodeURIComponent(c.id)}">
              ${c.cover ? `<img src="${coverUrl(c.cover)}" alt="" onerror="this.remove()">` : `<span class="um-club-emoji">${escapeHtml(c.emoji)}</span>`}
              <span>${escapeHtml(c.name)}</span>
            </a>`).join('')}</div>
        </div>` : ''}
      ${reading}
      ${favs}
      ${estateAdminLink ? `<div style="text-align:center;margin-top:10px">${estateAdminLink}</div>` : ''}
    `;
    userModal.classList.add('open');
  }

  // Click handler for user cards (ignore clicks on cover links)
  grid.addEventListener('click', (e) => {
    if (e.target.closest('a')) return;
    const card = e.target.closest('.user-card');
    if (!card) return;
    const name = card.dataset.name;
    const user = allUsers.find(u => u.displayName.toLowerCase() === name);
    if (user) openUserModal(user);
  });

  loadCommunity();
</script>
</body>
</html>
