  async function reload() {
    [club, read, comments, progressAll, members, quotes] = await Promise.all([
      getClub(db, clubId),
      getRead(db, clubId, readId),
      getComments(db, clubId, readId),
      getProgressAll(db, clubId, readId),
      getMembers(db, clubId),
      getQuotes(db, clubId, readId),
    ]);
    [bookPrompts, bookWarnings, userWarnings] = await Promise.all([
      getBookPrompts(read ? read.bookTitle : ''),
      getBookWarnings(read ? read.bookTitle : ''),
      read ? getUserWarnings(db, read.bookTitle).catch(() => []) : [],
    ]);
    if (!club || !read) {
      contentEl.innerHTML = '<div class="empty">Read not found — it may have been removed.</div>';
      return;
    }
    // This read's tagged polls only (untagged/club-wide polls live on
    // club.html). Votes are fetched for every poll, even locked ones —
    // simpler than conditioning the fetch on the lock, and poll counts per
    // read are small; the lock only affects what pollCardHtml renders.
    polls = pollsOn() ? (await getPolls(db, clubId)).filter(p => p.readId === readId) : [];
    pollVotes = {};
    if (polls.length) {
      const lists = await Promise.all(polls.map(p => getPollVotes(db, clubId, p.id)));
      polls.forEach((p, i) => { pollVotes[p.id] = lists[i]; });
    }
    // Ratings only become readable once revealed (firestore.rules denies
    // the read to everyone while blind — see club-reads.js). Gate the
    // fetch on the flag rather than relying on the catch, so the blind
    // window never even attempts a call rules will refuse.
    ratings = (blindRatingsOn() && ratingsAreRevealed(read))
      ? await getRatings(db, clubId, readId).catch(() => [])
      : [];
    markReadSeen(db, mySlug, clubId, readId, read.commentCount || comments.length);
    const backLink = document.getElementById('back-link');
    backLink.href = `club.html?id=${encodeURIComponent(clubId)}`;
    backLink.textContent = `← ${club.name}`;
    document.title = `${read.bookTitle} - Club Read`;
    if (firstRender) {
      lastSeenTs = parseInt(localStorage.getItem(seenKey()) || '0', 10);
      localStorage.setItem(seenKey(), String(Math.floor(Date.now() / 1000)));
      const hash = location.hash.match(/^#c-(.+)$/);
      if (hash) {
        const target = comments.find(c => c.id === hash[1]);
        if (target) {
          if (hasChapters()) {
            const root = target.parentId ? comments.find(p => p.id === target.parentId) || target : target;
            const key = bucketKeyFor(root);
            if (key.startsWith('c')) {
              const pk = partIndexForChapter(+key.slice(1));
              openSections.add(`part${pk}`).add(`pch${pk}`).add(key);
            } else if (key.startsWith('p')) {
              openSections.add(`part${key.slice(1)}`);
            } else openSections.add('general');
          } else {
            openSections.add(target.milestoneId || GENERAL_MILESTONE);
          }
        }
      }
    }
    render();
    if (firstRender) {
      firstRender = false;
      const el = location.hash.startsWith('#c-') ? document.getElementById(location.hash.slice(1)) : null;
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('linked');
      }
    }
  }

  // --- Reading-schedule editor (hosts/mods; static DOM, wired once) --------
  function openSchedModal() {
    const rows = document.getElementById('sched-rows');
    const ms = orderedMilestones();
    rows.innerHTML = ms.map((m, i) => `
      <div class="sched-row">
        <label for="sched-d-${i}" title="${escapeHtml(m.label)}">${escapeHtml(m.label)}</label>
        <input type="date" id="sched-d-${i}" value="${dueAtToDateInput(m.dueAt)}">
      </div>`).join('');
    document.getElementById('sched-spread-start').value = dueAtToDateInput(Date.now());
    document.getElementById('sched-spread-end').value = '';
    document.getElementById('sched-error').textContent = '';
    document.getElementById('sched-modal').style.display = 'flex';
  }

  (function wireSchedModal() {
    const modal = document.getElementById('sched-modal');
    if (!modal) return;
    const close = () => { modal.style.display = 'none'; };
    document.getElementById('sched-close').addEventListener('click', close);
    modal.addEventListener('click', (e) => { if (e.target === modal) close(); });
    document.getElementById('sched-spread').addEventListener('click', () => {
      const errEl = document.getElementById('sched-error');
      errEl.textContent = '';
      const n = orderedMilestones().length;
      const r = spreadScheduleDates(n,
        document.getElementById('sched-spread-start').value,
        document.getElementById('sched-spread-end').value);
      if (r.error) { errEl.textContent = r.error; return; }
      r.dates.forEach((d, i) => {
        const input = document.getElementById(`sched-d-${i}`);
        if (input) input.value = d;
      });
    });
    document.getElementById('sched-clear').addEventListener('click', () => {
      orderedMilestones().forEach((m, i) => {
        const input = document.getElementById(`sched-d-${i}`);
        if (input) input.value = '';
      });
    });
    document.getElementById('sched-save').addEventListener('click', async () => {
      const errEl = document.getElementById('sched-error');
      errEl.textContent = '';
      const dueAts = orderedMilestones().map((m, i) => {
        const input = document.getElementById(`sched-d-${i}`);
        return dateInputToDueAt(input ? input.value : '');
      });
      const r = await setReadSchedule(db, clubId, readId, dueAts);
      if (r.success) { close(); reload(); } else errEl.textContent = r.error;
    });
  })();

  // --- New Poll editor (hosts/mods; static DOM, wired once) ---------------
  // Tagged to one of THIS read's real sections (never General — a poll
  // needs a milestone position to be spoiler-gated against).
  function pollOptionRowHtml() {
    return `<div class="poll-opt-row">
      <input type="text" maxlength="${MAX_POLL_OPTION_LENGTH}" placeholder="Option" />
      <button type="button" class="poll-opt-remove" title="Remove option">&times;</button>
    </div>`;
  }

  function wirePollOptionRemovers() {
    document.querySelectorAll('#poll-options-list .poll-opt-remove').forEach(btn =>
      btn.addEventListener('click', () => {
        const list = document.getElementById('poll-options-list');
        if (list.children.length > MIN_POLL_OPTIONS) btn.closest('.poll-opt-row').remove();
      }));
  }

  function openPollModal() {
    const sectionSel = document.getElementById('poll-section');
    sectionSel.innerHTML = orderedMilestones()
      .map(m => `<option value="${escapeHtml(m.id)}" data-pos="${m.position}">${escapeHtml(m.label)}</option>`)
      .join('');
    document.getElementById('poll-question').value = '';
    document.getElementById('poll-error').textContent = '';
    const list = document.getElementById('poll-options-list');
    list.innerHTML = pollOptionRowHtml() + pollOptionRowHtml();
    wirePollOptionRemovers();
    document.getElementById('poll-modal').style.display = 'flex';
  }

  (function wirePollModal() {
    const modal = document.getElementById('poll-modal');
    if (!modal) return;
    const close = () => { modal.style.display = 'none'; };
    document.getElementById('poll-close').addEventListener('click', close);
    modal.addEventListener('click', (e) => { if (e.target === modal) close(); });
    document.getElementById('poll-add-option').addEventListener('click', () => {
      const list = document.getElementById('poll-options-list');
      if (list.children.length >= MAX_POLL_OPTIONS) return;
      list.insertAdjacentHTML('beforeend', pollOptionRowHtml());
      wirePollOptionRemovers();
    });
    document.getElementById('poll-submit').addEventListener('click', async () => {
      const errEl = document.getElementById('poll-error');
      errEl.textContent = '';
      const sectionSel = document.getElementById('poll-section');
      const opt = sectionSel.selectedOptions[0];
      if (!opt) { errEl.textContent = 'This read has no sections to tag yet.'; return; }
      const question = document.getElementById('poll-question').value;
      const options = [...document.querySelectorAll('#poll-options-list input')].map(i => i.value);
      const r = await createPoll(db, clubId, {
        question,
        options,
        readId,
        milestoneId: opt.value,
        milestonePosition: parseInt(opt.dataset.pos, 10),
      }, session);
      if (!r.success) { errEl.textContent = r.error; return; }
      close();
      reload();
    });
  })();

  // --- Rate-this-book modal (opens after "I'm finished") ------------------
  async function openRateModal() {
    const modal = document.getElementById('cr-rate-modal');
    if (!modal || !read || !session) return;
    document.getElementById('cr-rate-title').textContent = read.bookTitle;
    document.getElementById('cr-rate-error').textContent = '';
    const bookId = bookIdFromTitle(read.bookTitle);
    let mine = null;
    try {
      const revs = await getReviews(db, bookId);
      mine = revs.find(r => (r.displayName || '').toLowerCase() === session.displayName.toLowerCase());
    } catch {}
    const existing = document.getElementById('cr-rate-existing');
    if (mine) {
      existing.style.display = 'block';
      existing.textContent = `You already rated this ${mine.rating}★ — update it below or keep it.`;
      document.getElementById('cr-rate-stars').value = String(mine.rating);
      document.getElementById('cr-rate-text').value = mine.text || '';
      document.getElementById('cr-rate-submit').textContent = 'Update Review';
    } else {
      existing.style.display = 'none';
      document.getElementById('cr-rate-stars').value = '4';
      document.getElementById('cr-rate-text').value = '';
      document.getElementById('cr-rate-submit').textContent = 'Submit Rating';
    }
    modal.style.display = 'flex';
  }

  (function wireRateModal() {
    const modal = document.getElementById('cr-rate-modal');
    if (!modal) return;
    const close = () => { modal.style.display = 'none'; };
    document.getElementById('cr-rate-close').addEventListener('click', close);
    document.getElementById('cr-rate-later').addEventListener('click', close);
    modal.addEventListener('click', (e) => { if (e.target === modal) close(); });
    document.getElementById('cr-rate-submit').addEventListener('click', async () => {
      if (!read || !session) return;
      const errEl = document.getElementById('cr-rate-error');
      errEl.textContent = '';
      const rating = parseFloat(document.getElementById('cr-rate-stars').value);
      const text = document.getElementById('cr-rate-text').value.trim();
      const res = await submitReview(db, bookIdFromTitle(read.bookTitle), session.displayName, rating, text);
      if (res.success) close(); else errEl.textContent = res.error || 'Could not save review.';
    });
  })();

  if (!clubId || !readId) {
    contentEl.innerHTML = '<div class="empty">No read specified.</div>';
  } else {
    reload().catch(e => {
      contentEl.innerHTML = '<div class="empty">Failed to load discussions.</div>';
      console.error(e);
    });
  }
</script>
</body>
