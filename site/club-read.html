<!DOCTYPE html>
<html lang="en" data-default-theme="cyberpunk" data-default-mode="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Estate theme system: token contract + pre-paint switcher. Fonts are
     self-hosted under static/fonts/ (no third-party requests). theme.js is
     synchronous on purpose so the stored theme/mode land on <html> before
     first paint; it also migrates the legacy ab_theme key once. -->
<link rel="stylesheet" href="static/css/estate-theme.css">
<link rel="stylesheet" href="static/css/ab-bridge.css">
<script src="static/js/theme.js"></script>
<title>Club Read - Audiobook Catalog</title>
<link rel="icon" type="image/png" href="static/img/favicon.png">
<style>
/* Palette lives in static/css/estate-theme.css (the --et-* token contract:
   cyberpunk / apple / retro, each light + dark) with ab-bridge.css aliasing
   this page's legacy names (--bg, --neon-*, …) onto it. theme.js stamps
   data-theme/data-mode on <html>; the old html.light mechanism is gone. */
*{box-sizing:border-box}
body{
  margin:0; padding:20px;
  min-height:100vh;
}
/* Keep the fixed estate cog clear of the nav/identity row */
#wrap{max-width:820px;margin:0 auto}
.nav-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.nav-link{
  display:inline-block;padding:8px 14px;background:var(--bg-2);color:var(--neon-cyan);
  text-decoration:none;border:1px solid var(--border);font-weight:700;font-size:.85em;
  text-transform:var(--et-title-case);letter-spacing:.5px;transition:all .2s;cursor:pointer;font-family:inherit;
}
.nav-link:hover{border-color:var(--neon-cyan);box-shadow: var(--et-glow)}
.club-back{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;padding:7px 13px;
  background:var(--bg-2);color:var(--neon-cyan);text-decoration:none;border:1px solid var(--border);
  font-weight:700;font-size:.8em;text-transform:var(--et-title-case);letter-spacing:.5px;transition:all .2s}
.club-back:hover{border-color:var(--neon-cyan);box-shadow: var(--et-glow)}
.read-header{
  background:var(--bg-2);border:1px solid var(--border);padding:20px;margin-bottom:16px;
  display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;
  clip-path:var(--et-clip-panel);
}
.read-cover{width:90px;height:auto;border:1px solid var(--border);flex-shrink:0}
.read-title{
  color:var(--neon-yellow);text-transform:var(--et-title-case);letter-spacing:var(--et-title-spacing);margin:0 0 4px;
  text-shadow:var(--et-glow-title);font-size:1.35em;font-weight:700;
  font-family:var(--et-font-display);
}
.read-author{color:var(--muted);margin:0 0 10px}
.read-club{font-size:.85em;font-family:var(--et-font-mono)}
.read-club a{color:var(--neon-cyan);text-decoration:none}
.progress-row{
  background:var(--bg-2);border:1px solid var(--border);padding:14px 18px;margin-bottom:16px;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;
}
.progress-row label{font-size:.85em;color:var(--muted);text-transform:var(--et-title-case);letter-spacing:.5px}
.progress-row select{
  padding:7px 10px;background:var(--bg);color:var(--text);border:1px solid var(--border);
  font-family:inherit;font-size:.95em;
}
.progress-row select:focus{outline:none;border-color:var(--neon-cyan)}
.finish-me{
  padding:7px 14px;background:none;border:1px solid var(--neon-yellow);color:var(--neon-yellow);
  cursor:pointer;font-weight:700;text-transform:var(--et-title-case);font-size:.75em;letter-spacing:.5px;
  font-family:inherit;
}
.finish-me:hover{background:var(--neon-yellow);color:var(--et-btn-fg)}
.member-progress{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.mp-chip{
  font-size:.75em;padding:2px 8px;border:1px solid var(--border);color:var(--muted);
  font-family:var(--et-font-mono);
}
.mp-chip strong{color:var(--neon-cyan);font-weight:700}
.mp-chip.done{border-color:var(--neon-yellow);color:var(--neon-yellow)}
.mp-chip.done strong{color:var(--neon-yellow)}
.mp-chip.ns{opacity:.55}
.mp-chip.me{border-color:var(--neon-cyan)}
/* Reading-schedule verdicts (feature-gated per club) */
.mp-chip.behind{border-color:var(--neon-magenta)}
.mp-chip .mp-behind{color:var(--neon-magenta);font-weight:700}
.mp-chip .mp-ontrack{color:var(--neon-cyan)}
.ms-due{color:var(--neon-yellow);font-family:var(--et-font-mono);font-weight:400}
.sched-banner{
  background:var(--bg-2);border:1px solid var(--border);border-left:3px solid var(--neon-yellow);
  padding:10px 16px;margin-bottom:16px;font-size:.9em;font-family:var(--et-font-mono);
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;
}
.sched-banner .sb-behind{color:var(--neon-magenta);font-weight:700}
.sched-banner .sb-ontrack{color:var(--neon-cyan);font-weight:700}
.sched-edit-btn{
  background:none;border:1px solid var(--border);color:var(--muted);cursor:pointer;
  font-size:.78em;padding:4px 10px;font-family:inherit;text-transform:var(--et-title-case);letter-spacing:.5px;
}
.sched-edit-btn:hover{border-color:var(--neon-yellow);color:var(--neon-yellow)}
.sched-row{display:flex;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)}
.sched-row:last-child{border-bottom:none}
.sched-row label{flex:1;min-width:0;font-size:.9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sched-row input[type=date],#sched-spread-start,#sched-spread-end{
  padding:5px 8px;background:var(--bg);color:var(--text);border:1px solid var(--border);font-family:inherit;
}
.sched-row input:focus{outline:none;border-color:var(--neon-cyan)}
.sched-tools{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-bottom:12px;
  padding:10px;border:1px dashed var(--border)}
.sched-tools .st-field label{display:block;font-size:.72em;color:var(--muted);text-transform:var(--et-title-case);letter-spacing:.5px;margin-bottom:3px}
.sched-tools button{
  background:none;border:1px solid var(--border);color:var(--muted);cursor:pointer;
  font-size:.75em;padding:6px 10px;font-family:inherit;text-transform:var(--et-title-case);
}
.sched-tools button:hover{border-color:var(--neon-cyan);color:var(--neon-cyan)}
details.milestone{
  background:var(--bg-2);border:1px solid var(--border);margin-bottom:10px;
}
details.milestone summary{
  padding:14px 18px;cursor:pointer;font-weight:700;text-transform:var(--et-title-case);
  letter-spacing:.5px;color:var(--neon-cyan);list-style:none;display:flex;gap:10px;align-items:center;
}
details.milestone summary::-webkit-details-marker{display:none}
details.milestone summary::before{content:'▸';transition:transform .15s}
details[open].milestone summary::before{transform:rotate(90deg)}
.ms-count{margin-left:auto;font-size:.8em;color:var(--muted);font-family:var(--et-font-mono);font-weight:400}
.ms-body{padding:0 18px 16px}
.locked{
  background:var(--bg-2);border:1px dashed var(--border);margin-bottom:10px;
  padding:14px 18px;color:var(--muted);display:flex;gap:10px;align-items:center;
}
.locked .ms-count{margin-left:auto}
.comment{padding:10px 0;border-top:1px solid var(--border)}
.comment.reply{margin-left:34px}
.c-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.c-author{font-weight:700;color:var(--neon-cyan)}
.bot-avatar{
  width:24px;height:24px;border-radius:50%;border:1px solid var(--neon-magenta);
  vertical-align:middle;object-fit:cover;
}
.bot-badge{
  font-size:.7em;padding:1px 6px;border:1px solid var(--neon-magenta);color:var(--neon-magenta);
  font-family:var(--et-font-mono);text-transform:var(--et-title-case);letter-spacing:.5px;
}
.c-date{font-size:.75em;color:var(--muted);font-family:var(--et-font-mono)}
.c-text{margin:4px 0 6px;white-space:pre-wrap;word-break:break-word}
.c-actions{display:flex;gap:10px}
.c-actions button{
  background:none;border:none;color:var(--muted);cursor:pointer;font-size:.75em;
  text-transform:var(--et-title-case);padding:0;font-family:inherit;letter-spacing:.5px;
}
.c-actions button:hover{color:var(--neon-cyan)}
.c-actions button.danger:hover{color:var(--neon-magenta)}
.rx-row{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 6px;align-items:center}
.rx-chip{
  background:var(--bg);border:1px solid var(--border);color:var(--text);cursor:pointer;
  font-size:.8em;padding:2px 8px;font-family:var(--et-font-mono);
}
button.rx-chip:hover{border-color:var(--neon-yellow)}
.rx-chip.mine{border-color:var(--neon-yellow);color:var(--neon-yellow)}
.rx-picker{display:inline-flex;gap:4px}
.rx-picker button{
  background:var(--bg);border:1px solid var(--border);cursor:pointer;font-size:1em;
  padding:2px 6px;
}
.rx-picker button:hover{border-color:var(--neon-cyan)}
.pin-badge{font-size:.72em;color:var(--neon-yellow);text-transform:var(--et-title-case);letter-spacing:.5px}
.ch-chip{
  font-size:.72em;color:var(--neon-magenta);border:1px solid var(--neon-magenta);
  padding:1px 6px;font-family:var(--et-font-mono);
}
.spoiler-box{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);
  background:var(--bg);border:1px dashed var(--border);padding:10px 12px;margin-top:8px;
}
.spoiler-box button{
  background:none;border:1px solid var(--border);color:var(--muted);cursor:pointer;
  font-size:.75em;padding:3px 9px;font-family:inherit;text-transform:var(--et-title-case);
}
.spoiler-box button:hover{border-color:var(--neon-magenta);color:var(--neon-magenta)}
.ch-tag{
  padding:5px 8px;background:var(--bg);color:var(--text);border:1px solid var(--border);
  font-family:inherit;font-size:.85em;max-width:260px;
}
.ch-tag:focus{outline:none;border-color:var(--neon-cyan)}
.composer{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.composer textarea{
  width:100%;min-height:60px;padding:10px;background:var(--bg);color:var(--text);
  border:1px solid var(--border);font-family:inherit;font-size:.95em;resize:vertical;
}
.composer textarea:focus{outline:none;border-color:var(--neon-cyan)}
.composer-row{display:flex;gap:10px;align-items:center}
.composer button{
  padding:7px 16px;background:var(--neon-cyan);color:var(--et-accent-fg);border:none;font-weight:700;
  cursor:pointer;text-transform:var(--et-title-case);font-size:.8em;letter-spacing:.5px;font-family:inherit;
}
.composer button:disabled{opacity:.4;cursor:default}
.char-count{font-size:.75em;color:var(--muted);font-family:var(--et-font-mono)}
.view-switch{display:flex;gap:4px;margin-bottom:10px}
.view-switch .tab{
  padding:8px 16px;background:var(--bg-2);border:1px solid var(--border);
  color:var(--muted);cursor:pointer;font-weight:700;text-transform:var(--et-title-case);
  letter-spacing:.5px;font-size:.8em;font-family:inherit;
}
.view-switch .tab.active{color:var(--neon-cyan);border-color:var(--neon-cyan)}
.quote-card{background:var(--bg-2);border:1px solid var(--border);padding:16px 18px;margin-bottom:10px}
.quote-card blockquote{margin:0 0 8px;font-size:1.1em;line-height:1.5;font-style:italic}
.quote-meta{display:flex;gap:10px;align-items:center;font-size:.8em;color:var(--muted);font-family:var(--et-font-mono)}
.quote-meta button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1em;text-transform:var(--et-title-case);padding:0;font-family:inherit}
.quote-meta button:hover{color:var(--neon-magenta)}
.mention{color:var(--neon-cyan);font-weight:700}
.mention-me{color:var(--neon-yellow)}
.comment.mentions-me{border-left:2px solid var(--neon-yellow);padding-left:10px}
.new-dot{width:8px;height:8px;border-radius:50%;background:var(--neon-yellow);display:inline-block}
.new-count{color:var(--neon-yellow)}
.comment.linked{background:color-mix(in srgb, var(--et-accent) 8%, transparent);outline:1px solid var(--neon-cyan);padding:10px}
.cw-notes{
  background:var(--bg-2);border:1px solid var(--border);padding:10px 16px;margin-bottom:16px;
  color:var(--muted);font-size:.92em;
}
.cw-notes summary{cursor:pointer;color:var(--neon-yellow)}
.cw-notes ul{margin:8px 0 2px;padding-left:20px}
.cw-notes a{color:var(--neon-cyan);font-size:.85em}
.cw-by{color:var(--muted);font-size:.85em}
.cw-add-btn{
  margin:8px 0 2px;padding:4px 10px;background:none;border:1px solid var(--border);
  color:var(--muted);cursor:pointer;font-family:inherit;font-size:.8em;
}
.cw-add-btn:hover{border-color:var(--neon-yellow);color:var(--neon-yellow)}
.cw-del{
  background:none;border:none;color:var(--neon-magenta);cursor:pointer;font-size:.85em;padding:0 3px;
}
.starter-q{
  background:var(--bg);border:1px dashed var(--border);padding:10px 12px;margin:10px 0 4px;
  color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap;
}
.starter-q button{
  background:none;border:1px solid var(--border);color:var(--muted);cursor:pointer;
  font-size:.72em;padding:3px 9px;font-family:inherit;text-transform:var(--et-title-case);
}
.starter-q button:hover{border-color:var(--neon-cyan);color:var(--neon-cyan)}
details.chapters-wrap{border:1px solid var(--border);background:var(--bg);margin-top:14px}
details.chapters-wrap > summary{
  padding:10px 14px;cursor:pointer;color:var(--muted);font-size:.85em;text-transform:var(--et-title-case);
  letter-spacing:.5px;list-style:none;display:flex;gap:10px;align-items:center;
}
details.chapters-wrap > summary::-webkit-details-marker{display:none}
details.chapters-wrap > summary::before{content:'▸';transition:transform .15s}
details.chapters-wrap[open] > summary::before{transform:rotate(90deg)}
.chapters-body{padding:0 10px 10px}
details.milestone.ch-section{margin:6px 0;border-color:var(--border)}
details.milestone.ch-section summary{padding:10px 14px;font-size:.85em;color:var(--text)}
.locked-ch{margin:6px 0;padding:10px 14px;font-size:.85em}
/* Club polls (feature-gated; see clubs.js FEATURE_DEFAULTS.polls) */
.poll-banner{
  background:var(--bg-2);border:1px solid var(--border);border-left:3px solid var(--neon-cyan);
  padding:10px 16px;margin-bottom:16px;font-size:.9em;font-family:var(--et-font-mono);
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;
}
.poll-new-btn{
  background:none;border:1px solid var(--border);color:var(--muted);cursor:pointer;
  font-size:.78em;padding:4px 10px;font-family:inherit;text-transform:var(--et-title-case);letter-spacing:.5px;
}
.poll-new-btn:hover{border-color:var(--neon-cyan);color:var(--neon-cyan)}
.poll-card{background:var(--bg);border:1px solid var(--border);padding:12px 14px;margin:10px 0}
.poll-q{font-weight:700;color:var(--neon-cyan);margin-bottom:8px}
.poll-closed-tag{font-size:.7em;color:var(--muted);border:1px solid var(--border);padding:1px 6px;margin-left:6px;text-transform:var(--et-title-case)}
.poll-options{display:flex;flex-direction:column;gap:6px}
.poll-opt{
  text-align:left;padding:7px 11px;background:var(--bg-2);border:1px solid var(--border);color:var(--text);
  cursor:pointer;font-family:inherit;font-size:.88em;
}
.poll-opt:hover{border-color:var(--neon-cyan);color:var(--neon-cyan)}
.poll-result{position:relative;padding:6px 9px;border:1px solid var(--border);background:var(--bg-2);overflow:hidden;font-size:.88em;cursor:pointer}
.poll-result.mine{border-color:var(--neon-yellow)}
.poll-result-bar{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb, var(--neon-cyan) 18%, transparent);z-index:0}
.poll-result-label{position:relative;z-index:1}
.poll-result-pct{position:relative;z-index:1;float:right;color:var(--muted);font-family:var(--et-font-mono);font-size:.85em}
.poll-total{margin-top:6px;font-size:.78em;color:var(--muted);font-family:var(--et-font-mono)}
.poll-admin{display:flex;gap:8px;margin-top:8px}
.poll-admin button{
  background:none;border:1px solid var(--border);color:var(--muted);cursor:pointer;
  font-size:.7em;padding:3px 8px;font-family:inherit;text-transform:var(--et-title-case);
}
.poll-admin button:hover{border-color:var(--neon-cyan);color:var(--neon-cyan)}
.poll-admin button.danger:hover{border-color:var(--neon-magenta);color:var(--neon-magenta)}
.poll-locked{
  background:var(--bg-2);border:1px dashed var(--border);margin:10px 0;
  padding:10px 14px;color:var(--muted);font-size:.85em;
}
.poll-opt-row{display:flex;gap:6px;margin-bottom:6px}
.poll-opt-row input{
  flex:1;min-width:0;padding:6px 9px;background:var(--bg);color:var(--text);
  border:1px solid var(--border);font-family:inherit;
}
.poll-opt-row input:focus{outline:none;border-color:var(--neon-cyan)}
.poll-opt-remove{
  background:none;border:1px solid var(--border);color:var(--muted);cursor:pointer;
  width:28px;flex-shrink:0;font-weight:bold;
}
.poll-opt-remove:hover{border-color:var(--neon-magenta);color:var(--neon-magenta)}
/* Star display (renderStars() from reviews.js) */
.stars .star{display:inline-block;position:relative}
.stars .star-full{color:var(--neon-yellow)}
.stars .star-half{color:var(--muted);display:inline-block;position:relative}
.stars .star-half .star-half-fill{position:absolute;left:0;top:0;color:var(--neon-yellow);overflow:hidden;width:50%}
.stars .star-empty{color:var(--muted)}
/* Blind ratings reveal (feature-gated; see clubs.js FEATURE_DEFAULTS.blindRatings) */
.rate-banner{
  background:var(--bg-2);border:1px solid var(--border);border-left:3px solid var(--neon-magenta,#ff2a6d);
  padding:12px 16px;margin-bottom:16px;font-size:.9em;
}
.rate-banner.revealed{border-left-color:var(--neon-yellow)}
.rate-banner-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--et-font-mono)}
.rate-mine{margin-top:8px;color:var(--muted)}
.reveal-btn{
  background:none;border:1px solid var(--neon-yellow);color:var(--neon-yellow);cursor:pointer;
  font-weight:700;font-size:.78em;padding:5px 12px;font-family:inherit;text-transform:var(--et-title-case);letter-spacing:.5px;
}
.reveal-btn:hover{background:var(--neon-yellow);color:var(--et-btn-fg)}
.rate-composer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.rate-composer select{padding:7px 9px;background:var(--bg);color:var(--text);border:1px solid var(--border);font-family:inherit}
.rate-composer input[type=text]{
  flex:1;min-width:160px;padding:7px 9px;background:var(--bg);color:var(--text);border:1px solid var(--border);font-family:inherit;
}
.rate-composer select:focus,.rate-composer input:focus{outline:none;border-color:var(--neon-cyan)}
.rate-composer button{
  background:none;border:1px solid var(--neon-cyan);color:var(--neon-cyan);cursor:pointer;
  font-weight:700;font-size:.82em;padding:7px 14px;font-family:inherit;text-transform:var(--et-title-case);letter-spacing:.5px;
}
.rate-composer button:hover{background:var(--neon-cyan);color:var(--et-btn-fg)}
.rate-cards{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.rate-card{background:var(--bg);border:1px solid var(--border);padding:10px 12px;min-width:160px;flex:1 1 200px}
.rate-card.mine{border-color:var(--neon-cyan)}
.rate-card-head{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.rate-after-tag{font-size:.7em;color:var(--muted);border:1px solid var(--border);padding:1px 6px;text-transform:var(--et-title-case)}
.rate-card-comment{margin-top:4px;color:var(--muted);font-size:.9em;font-style:italic}
.archive-banner{
  padding:12px 16px;border:1px solid var(--neon-yellow);background:var(--bg-2);
  color:var(--neon-yellow);margin-bottom:16px;font-size:.95em;
}
.loading,.empty{text-align:center;padding:30px;color:var(--muted);font-family:var(--et-font-mono)}
.error-box{
  padding:12px 16px;border:1px solid var(--neon-magenta);background:var(--bg-2);
  color:var(--neon-magenta);margin-bottom:16px;
}
.notice{
  padding:10px 14px;border:1px solid var(--border);background:var(--bg-2);
  color:var(--muted);margin-bottom:16px;font-size:.9em;
}
.notice a{color:var(--neon-cyan)}
@media(max-width:600px){
  body{padding:10px}
  .read-header{clip-path:none}
  .member-progress{margin-left:0}
  .comment.reply{margin-left:16px}
}

/* Sign-in / user chip (shared identity bar) */
#identity-bar{margin-left:auto}
.identity-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.identity-bar__greeting{font-weight:700;color:var(--neon-cyan,#05d9e8)}
.identity-bar__google-btn{
  display:inline-flex;align-items:center;padding:8px 14px;border:1px solid var(--border,#2a2a3a);

}
.identity-bar__google-btn:hover{border-color:var(--neon-cyan,#05d9e8)}

.identity-bar__logout-btn{
  background:none;border:1px solid var(--border,#2a2a3a);color:var(--muted,#8a8f98);cursor:pointer;

.nav-link.active{border-color:var(--neon-cyan,#05d9e8);color:var(--neon-yellow,#fcee0a)}


/* =============== CYBERPUNK IDENTITY RESTORES ===============
   Owner, 2026-08-14: "/dev/ and the existing page don't look the same."
   Pre-theme literals (a202f4a), verbatim, scoped to the default theme so
   the other themes keep their honest token rendering. */
html[data-theme="cyberpunk"] .nav-link:hover{box-shadow:0 0 8px rgba(5,217,232,.2)}
html[data-theme="cyberpunk"] .club-back:hover{box-shadow:0 0 8px rgba(5,217,232,.2)}
html[data-theme="cyberpunk"] .read-title{letter-spacing:1px}
html[data-theme="cyberpunk"] .finish-me:hover{color:#141406}
html[data-theme="cyberpunk"] .comment.linked{background:rgba(5,217,232,.07)}

/* ===== Buddy-read pace graph (backlog #6) =====
   A member-identity color needs more distinct hues than this page's 3-role
   --neon-* vocabulary (cyan/yellow/magenta only, aliased onto --et-accent/
   --et-accent-2/--et-danger — see ab-bridge.css) can offer, so the pace
   lines get their OWN small categorical palette: the dataviz skill's
   validated 8-hue default instance (fixed order, CVD-checked in both
   modes), light values here and dark values under the same
   :not([data-mode="light"]) guard ab-bridge.css itself uses for its
   cyberpunk dark-by-default literals. */
:root{
  --pace-c1:#2a78d6; --pace-c2:#eb6834; --pace-c3:#1baf7a; --pace-c4:#eda100;
  --pace-c5:#e87ba4; --pace-c6:#008300; --pace-c7:#4a3aa7; --pace-c8:#e34948;
}
:root:not([data-mode="light"]){
  --pace-c1:#3987e5; --pace-c2:#d95926; --pace-c3:#199e70; --pace-c4:#c98500;
  --pace-c5:#d55181; --pace-c6:#008300; --pace-c7:#9085e9; --pace-c8:#e66767;
}
.pace-panel{background:var(--bg-2);border:1px solid var(--border);padding:16px 18px;margin-bottom:16px}
.pace-title{margin:0 0 10px;font-size:1em;text-transform:var(--et-title-case);letter-spacing:.5px;color:var(--neon-yellow)}
.pace-frozen{color:var(--muted);font-weight:400;font-size:.85em;text-transform:none;letter-spacing:0}
.pace-empty{color:var(--muted);font-size:.9em;padding:14px 0;text-align:center;font-family:var(--et-font-mono)}
.pace-svg-wrap{width:100%;overflow-x:auto}
.pace-svg-wrap svg{width:100%;height:auto;display:block;min-width:320px}
.pace-grid{stroke:var(--border);stroke-width:1}
.pace-axis-label{fill:var(--muted);font-size:9px;font-family:var(--et-font-mono)}
.pace-expected{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2,3}
.pace-today{stroke:var(--neon-magenta);stroke-width:1;stroke-dasharray:3,3}
.pace-line{transition:opacity .15s}
.pace-legend{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:10px}
.pace-legend-item{
  display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--muted);
  cursor:pointer;font-family:var(--et-font-mono);font-size:.78em;padding:2px 0;
}
.pace-legend-item:hover,.pace-legend-item.active{color:var(--text)}
.pace-swatch{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
</style>
</head>
<body>
<div id="wrap">
  <div class="nav-row">

    <a href="stats.html" class="nav-link">Stats</a>
    <a href="guess-game.html" class="nav-link">Game</a>
    <div id="identity-bar"></div>
  </div>
  <a id="back-link" href="clubs.html" class="club-back">&larr; Club</a>
  <div id="content"><div class="loading">Loading discussions...</div></div>
</div>

<!-- Rate-this-book modal, shown after a member marks themselves finished -->
<div id="cr-rate-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center;padding:16px">
  <div style="background:var(--bg-2);border:1px solid var(--neon-yellow);max-width:440px;width:100%;padding:20px;position:relative;box-sizing:border-box">
    <button id="cr-rate-close" style="position:absolute;top:8px;right:10px;background:none;border:none;color:var(--muted);font-size:1.4em;line-height:1;cursor:pointer">×</button>
    <h2 style="margin:0 0 4px;color:var(--neon-yellow);text-transform:var(--et-title-case);letter-spacing:var(--et-title-spacing);font-size:1.1em">You finished it! Rate this book</h2>
    <div id="cr-rate-title" style="color:var(--neon-cyan);font-weight:700;margin-bottom:14px"></div>
    <label for="cr-rate-stars" style="display:block;font-size:.8em;color:var(--muted);text-transform:var(--et-title-case);letter-spacing:.5px;margin-bottom:4px">Your rating</label>
    <select id="cr-rate-stars" style="width:100%;padding:8px;background:var(--bg);color:var(--text);border:1px solid var(--border);margin-bottom:14px;box-sizing:border-box">
      <option value="5">★★★★★ (5)</option>
      <option value="4.5">4.5</option>
      <option value="4" selected>★★★★ (4)</option>
      <option value="3.5">3.5</option>
      <option value="3">★★★ (3)</option>
      <option value="2.5">2.5</option>
      <option value="2">★★ (2)</option>
      <option value="1.5">1.5</option>
      <option value="1">★ (1)</option>
      <option value="0.5">0.5</option>
    </select>
    <label for="cr-rate-text" style="display:block;font-size:.8em;color:var(--muted);text-transform:var(--et-title-case);letter-spacing:.5px;margin-bottom:4px">Review (optional — posts to the catalog's reviews)</label>
    <textarea id="cr-rate-text" maxlength="1000" rows="3" style="width:100%;padding:8px;background:var(--bg);color:var(--text);border:1px solid var(--border);margin-bottom:12px;box-sizing:border-box;font-family:inherit"></textarea>
    <div id="cr-rate-existing" style="display:none;color:var(--muted);font-size:.85em;margin-bottom:8px"></div>
    <div id="cr-rate-error" style="color:var(--neon-magenta);font-size:.85em;margin-bottom:8px"></div>
    <button id="cr-rate-submit" class="nav-link" style="width:100%;background:var(--neon-cyan);color:var(--et-accent-fg);border:none;font-weight:700">Submit Rating</button>
    <button id="cr-rate-later" class="nav-link" style="width:100%;margin-top:8px">Maybe later</button>
  </div>
</div>

<!-- Reading-schedule editor (hosts/mods; feature-gated per club) -->
<div id="sched-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center;padding:16px">
  <div style="background:var(--bg-2);border:1px solid var(--neon-yellow);max-width:480px;width:100%;max-height:90vh;overflow-y:auto;padding:20px;position:relative;box-sizing:border-box">
    <button id="sched-close" style="position:absolute;top:8px;right:10px;background:none;border:none;color:var(--muted);font-size:1.4em;line-height:1;cursor:pointer">×</button>
    <h2 style="margin:0 0 4px;color:var(--neon-yellow);text-transform:var(--et-title-case);letter-spacing:var(--et-title-spacing);font-size:1.1em">Reading Schedule</h2>
    <!-- COPY TRIM 2026-08-18 (owner: "Only keep what's mandatory and keep all
         the text short and useful"). Cut: "members see on-track / behind chips
         against them" — that is the feature's downstream effect, visible on
         the read page as the chips themselves, not something the host must
         know to fill this form in. KEPT: "Blank = no due date", which names a
         behaviour of an EMPTY field that nothing else on the page states. -->
    <p style="color:var(--muted);font-size:.85em;margin:0 0 12px">Target dates per section. Blank = no due date.</p>
    <div class="sched-tools">
      <div class="st-field"><label for="sched-spread-start">Start</label><input type="date" id="sched-spread-start"></div>
      <div class="st-field"><label for="sched-spread-end">Finish by</label><input type="date" id="sched-spread-end"></div>
      <button id="sched-spread">Spread evenly</button>
      <button id="sched-clear">Clear all</button>
    </div>
    <div id="sched-rows"></div>
    <div id="sched-error" style="color:var(--neon-magenta);font-size:.85em;min-height:1.2em;margin:8px 0"></div>
    <button id="sched-save" class="nav-link" style="width:100%;background:var(--neon-cyan);color:var(--et-accent-fg);border:none;font-weight:700">Save Schedule</button>
  </div>
</div>

<!-- New Poll editor (hosts/mods; feature-gated per club) — tagged to a
     section of THIS read, spoiler-gated on the section like comments. -->
<div id="poll-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center;padding:16px">
  <div style="background:var(--bg-2);border:1px solid var(--neon-yellow);max-width:480px;width:100%;max-height:90vh;overflow-y:auto;padding:20px;position:relative;box-sizing:border-box">
    <button id="poll-close" style="position:absolute;top:8px;right:10px;background:none;border:none;color:var(--muted);font-size:1.4em;line-height:1;cursor:pointer">×</button>
    <h2 style="margin:0 0 4px;color:var(--neon-yellow);text-transform:var(--et-title-case);letter-spacing:var(--et-title-spacing);font-size:1.1em">New Poll</h2>
    <!-- ⚠️ NOT TRIMMED in the 2026-08-18 copy sweep, deliberately. This is the
         SPOILER GATE for the Section field directly below it: it tells the
         author who will and will not see what they are about to post, which
         they must know BEFORE choosing a section. "(question and results
         both)" is the honest half — a reader would otherwise assume only the
         results are held back. A gate statement is never a candidate for a
         tooltip either; touch devices never show one. -->
    <p style="color:var(--muted);font-size:.85em;margin:0 0 12px">Tagged to a section — hidden (question and results both) from members who haven't reached it yet.</p>
    <label for="poll-section" style="display:block;font-size:.8em;color:var(--muted);text-transform:var(--et-title-case);letter-spacing:.5px;margin-bottom:4px">Section</label>
    <select id="poll-section" style="width:100%;padding:7px 9px;background:var(--bg);color:var(--text);border:1px solid var(--border);font-family:inherit;margin-bottom:12px;box-sizing:border-box"></select>
    <label for="poll-question" style="display:block;font-size:.8em;color:var(--muted);text-transform:var(--et-title-case);letter-spacing:.5px;margin-bottom:4px">Question</label>
    <textarea id="poll-question" maxlength="200" rows="2" style="width:100%;padding:8px;background:var(--bg);color:var(--text);border:1px solid var(--border);margin-bottom:12px;box-sizing:border-box;font-family:inherit" placeholder="Ask something about this section..."></textarea>
    <label style="display:block;font-size:.8em;color:var(--muted);text-transform:var(--et-title-case);letter-spacing:.5px;margin-bottom:4px">Options (2-10)</label>
    <div id="poll-options-list"></div>
    <button type="button" id="poll-add-option" style="margin:2px 0 12px;padding:4px 10px;font-size:.75em;background:none;border:1px solid var(--border);color:var(--muted);cursor:pointer;font-family:inherit;text-transform:var(--et-title-case)">+ Add option</button>
    <div id="poll-error" style="color:var(--neon-magenta);font-size:.85em;min-height:1.2em;margin-bottom:8px"></div>
    <button id="poll-submit" class="nav-link" style="width:100%;background:var(--neon-cyan);color:var(--et-accent-fg);border:none;font-weight:700">Create Poll</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
  import { getFirestore } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
  import { coverUrl } from './covers-base.js';
  import { getSession, slugifyName, resolveSiteAccess, getLiveUser } from './identity.js';
  import { mountAccountModal } from './account-modal.js';
  import {
    getClub, getMembers, clubFeatureEnabled, isManagerUid, canOperateClub,
  } from './clubs.js?v=20260818b';
  import {
    getRead, getComments, addComment, deleteComment,
    toggleReaction, togglePin, REACTION_EMOJI,
    addQuote, getQuotes, deleteQuote, MAX_QUOTE_LENGTH,
    highlightMentions, mentionsUser, getBookPrompts, getBookWarnings,
    setProgress, setChapterProgress, getProgressAll,
    isMilestoneLocked, isCommentSpoiler, groupChapters, GENERAL_MILESTONE, MAX_COMMENT_LENGTH,
    hasSchedule, scheduleStatus, nextDueMilestone, formatDueDate,
    dueAtToDateInput, dateInputToDueAt, spreadScheduleDates, setReadSchedule,
    memberSchedulePosition,
    getPolls, getPollVotes, createPoll, setPollStatus, deletePoll, castVote,
    tallyPollVotes, myPollVote, pollResultsVisible, isPollLocked,
    isNextBookPoll, pollOptionContentHtml,
    MIN_POLL_OPTIONS, MAX_POLL_OPTIONS, MAX_POLL_OPTION_LENGTH,
    rateBook, revealRatings, getRatings, ratingsAreRevealed, deleteRating,
    tallyRatings, isRatingAfterReveal, sortRatingsForReveal, getMyStoredRating,
    MAX_RATING_COMMENT_LENGTH,
    computePaceGraphModel, paceAxisLabel, paceScaleX, paceScaleY, assignPaceColors,
  } from './club-reads.js?v=20260816b';
  import { addUserWarning, getUserWarnings, deleteUserWarning } from './user-warnings.js';
  import { markReadSeen } from './club-notify.js';
  import { submitReview, bookIdFromTitle, getReviews, renderStars } from './reviews.js';
  import { FIREBASE_CONFIG } from './fb-env.js';

  // Canonical copy lives in site/fb-env.js
  const firebaseConfig = FIREBASE_CONFIG;
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  mountAccountModal(db, app, document.getElementById('identity-bar'));

  const session = getSession();
  const mySlug = session ? slugifyName(session.displayName) : null;
  const params = new URLSearchParams(window.location.search);
  const clubId = params.get('club');
  const readId = params.get('read');
  const contentEl = document.getElementById('content');

  let club = null, read = null, comments = [], progressAll = [], members = [];
  let quotes = [];
  let polls = [];       // this read's tagged polls only (club-wide polls live on club.html)
  let pollVotes = {};   // pollId -> votes[]
  let ratings = [];      // blind ratings — only populated once ratingsAreRevealed(read) (see reload())
  let bookPrompts = null;   // AI starter questions for hosts (toggleable per club)
  let bookWarnings = null;  // published content warnings with sources
  let userWarnings = [];    // reader-added warnings from this site
  let view = 'discussions'; // 'discussions' | 'quotes' | 'pace'
  let pacePinned = null;    // legend-pinned member slug on the Pace tab (click/tap to highlight)
  let lastSeenTs = 0;       // seconds; comments newer than this get a NEW dot
  let firstRender = true;
  const openSections = new Set([GENERAL_MILESTONE]);
  let replyTo = null; // comment id an inline reply composer is open for
  let reactingTo = null; // comment id with the emoji picker open
  const revealedSpoilers = new Set(); // comment ids the viewer chose to reveal

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  const myRole = () => (members.find(m => m.slug === mySlug) || {}).role || null;
  // Site admin gets the host/mod controls on every read — same break-glass
  // as club.html. The site MODERATOR (three-tier model) gets the OPERATIONAL
  // subset: content deletes, schedule, polls, and — since the 2026-08-17
  // MANAGECLUB SPLIT — the ratings REVEAL; never the AI-prompt/pin host
  // tools. Resolves async; re-render.
  // Phase 2 of the auth migration: the answer comes from the worker's
  // /api/me capability list (server-verified) via resolveSiteAccess, which
  // falls back to the old site_roles read if the worker is unreachable —
  // see identity.js. Presentation only; enforcement is unchanged.
  let siteAccess = null;
  resolveSiteAccess(db, app).then((access) => {
    if (access) { siteAccess = access; if (read) render(); }
  }).catch(() => {});
  // The Firebase Auth uid, for the club-island gates that key on managerUids
  // (the reveal control since the 2026-08-17 MANAGECLUB SPLIT). Null for a
  // signed-out or legacy display-name session, which changes nothing.
  let liveUid = null;
  getLiveUser(app).then((user) => {
    liveUid = user ? user.uid : null;
    if (read) render();
  }).catch(() => {});
  const siteCan = (cap) => !!siteAccess && siteAccess.capabilities.includes(cap);
  const isMod = () => ['host', 'moderator'].includes(myRole()) || siteCan('manageClub');
  // The operational gate — mirrors canOperateClub in clubs.js/firestore.rules.
  const canOperate = () => isMod() || siteCan('operateClub');
  // The READ LIFECYCLE gate (MANAGECLUB SPLIT, 2026-08-17). On this page that
  // is the ratings reveal. It was isMod() — display-name host/mod plus the
  // site admin — which both drew the button for a display-name host rules
  // would refuse AND hid it from the site moderator rules now admits.
  //
  // Two halves, the same idiom club.html uses for the webhook: `mayRunReads`
  // is the UI precondition (who should see a manager control at all), and
  // canOperateClub() is the RULES MIRROR (who the write actually succeeds
  // for). Both must hold, or the control is not drawn and the banner says why.
  const mayRunReads = () => canOperate() || isManagerUid(club, liveUid);
  const siteRoleName = () =>
    (siteCan('manageClub') ? 'admin' : (siteCan('operateClub') ? 'moderator' : null));
  const canRunReads = () => mayRunReads() && canOperateClub(club, liveUid, siteRoleName());
  // Reader content-note removal (the 2026-08-17 delete split): your own note
  // always, anyone's note for a site moderator+ — 'operateClub' is exactly the
  // capability firestore.rules' canDeleteUserWarning() and the worker's
  // warning.modDelete gate are written against. Club host/mod does NOT count
  // here: content notes are site-wide, not club-scoped, so this asks
  // siteCan('operateClub') rather than canOperate().
  const canModerateWarnings = () => siteCan('operateClub');
  const cwDelBtn = (w) => {
    const isOwn = !!session
      && (w.displayName || '').toLowerCase() === session.displayName.toLowerCase();
    const asMod = !isOwn && canModerateWarnings();
    if (!isOwn && !asMod) return '';
    const title = isOwn ? 'Remove your warning' : 'Remove this note (site moderator)';
    return ` <button class="cw-del" data-cw-del="${escapeHtml(w.id)}"${asMod ? ' data-cw-mod="1"' : ''} title="${title}">✕</button>`;
  };
  const myProgress = () => {
    const p = progressAll.find(p => p.slug === mySlug);
    return p ? p.milestonePosition : -1;
  };
  const isArchived = () => read && read.status !== 'active';
  const chapterTitles = () => (read && read.chapterTitles) || [];
  const hasChapters = () => chapterTitles().length > 0;
  const myChapter = () => {
    const p = progressAll.find(p => p.slug === mySlug);
    return p && typeof p.chapterIndex === 'number' ? p.chapterIndex : -1;
  };
  const chLabel = (i) => `Ch ${i + 1}: ${chapterTitles()[i] || ''}`;
  const memberNames = () => members.map(m => m.displayName);
  const seenKey = () => `ab_seen_${clubId}_${readId}`;
  const parts = () => groupChapters(chapterTitles());
  const partIndexForChapter = (ch) => parts().findIndex(g => ch >= g.start && ch <= g.end);

  // Reading schedule (feature-gated per club; see clubs.js FEATURE_DEFAULTS)
  const schedOn = () => !!club && clubFeatureEnabled(club, 'readingSchedule');
  const schedActive = () => schedOn() && !isArchived() && hasSchedule(read.milestones);
  const orderedMilestones = () => [...(read.milestones || [])].sort((a, b) => a.position - b.position);
  const milestoneDueByPosition = (pos) => {
    if (!schedOn()) return null;
    const m = (read.milestones || []).find(x => x.position === pos);
    return m && typeof m.dueAt === 'number' ? m.dueAt : null;
  };
  const dueTag = (dueAt) => dueAt ? `<span class="ms-due">due ${escapeHtml(formatDueDate(dueAt))}</span> · ` : '';

  // Club polls (feature-gated; see clubs.js FEATURE_DEFAULTS.polls). Tagged
  // polls store a cached milestonePosition at creation, so the spoiler gate
  // is a plain number comparison against the SAME position the reading
  // schedule already computes — no separate "poll progress" concept.
  const pollsOn = () => !!club && clubFeatureEnabled(club, 'polls');
  const myPollPosition = () => {
    const p = progressAll.find(x => x.slug === mySlug);
    return memberSchedulePosition(read.milestones, p, hasChapters());
  };
  const pollsForPosition = (pos) => polls.filter(p => p.milestonePosition === pos);

  // Blind ratings reveal (feature-gated; see clubs.js FEATURE_DEFAULTS.blindRatings
  // and the "Blind ratings reveal" section of club-reads.js for the full
  // trust-model rationale). While blind, `ratings` stays empty (rules deny
  // the read to everyone) and the viewer's own pick comes from the
  // localStorage mirror instead.
  const blindRatingsOn = () => !!club && clubFeatureEnabled(club, 'blindRatings');
  const ratingTimestampMs = (ts) => (ts && typeof ts.toMillis === 'function' ? ts.toMillis() : null);

  // Buddy-read pace graph (feature-gated; see clubs.js FEATURE_DEFAULTS.paceGraph
  // and the "Buddy-read pace graph" section of club-reads.js for the
  // history-shape and rendering-model rationale). The expected-pace
  // reference line reuses read.milestones[].dueAt directly (hasSchedule),
  // independent of whether the readingSchedule TOGGLE is currently on for
  // this club — same "reuse the underlying data, not the feature flag"
  // precedent as the poll spoiler gate.
  const paceGraphOn = () => !!club && clubFeatureEnabled(club, 'paceGraph');
  const memberName = (slug) => {
    const m = members.find(x => x.slug === slug);
    return (m && m.displayName) || slug;
  };

  // Bucket key for a comment on a chapter-based read:
  // 'general' | 'p<partIdx>' (part-level) | 'c<chapterIdx>' (chapter-level).
  // Legacy comments with only a milestoneId map to the part containing the
  // milestone's first chapter.
  function bucketKeyFor(c) {
    if (typeof c.chapterIndex === 'number') return `c${c.chapterIndex}`;
    if (typeof c.partIndex === 'number') return `p${Math.min(c.partIndex, parts().length - 1)}`;
    const msId = c.milestoneId || GENERAL_MILESTONE;
    if (msId !== GENERAL_MILESTONE) {
      const m = read.milestones.find(x => x.id === msId);
      if (m && typeof m.chStart === 'number') return `p${partIndexForChapter(m.chStart)}`;
    }
    return 'general';
  }

  function bucketComments() {
    const map = {};
    for (const c of comments) {
      const key = c.parentId
        ? null // replies attach to their parent's bucket during render
        : bucketKeyFor(c);
      if (key) (map[key] = map[key] || []).push(c);
    }
    return map;
  }
  // Chapter <option>s grouped into <optgroup>s (real Part/Book headings when
  // the titles have them, otherwise chunks of 25) so long books stay usable.
  function chapterOptionsHtml(selectedIndex) {
    const titles = chapterTitles();
    const groups = groupChapters(titles);
    const opt = (i) =>
      `<option value="${i}" ${selectedIndex === i ? 'selected' : ''}>${escapeHtml(chLabel(i))}</option>`;
    if (groups.length <= 1) {
      return titles.map((t, i) => opt(i)).join('');
    }
    return groups.map(g => {
      const opts = [];
      for (let i = g.start; i <= g.end; i++) opts.push(opt(i));
      return `<optgroup label="${escapeHtml(g.label)}">${opts.join('')}</optgroup>`;
    }).join('');
  }

  function fmtDate(ts) {
    try { return ts && ts.toDate ? ts.toDate().toLocaleDateString() : ''; } catch { return ''; }
  }

  function commentThreadHtml(milestoneId, explicitTop, target) {
    const inSection = explicitTop !== undefined ? null : comments
      .filter(c => (c.milestoneId || GENERAL_MILESTONE) === milestoneId)
      .sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
    const topLevel = (explicitTop !== undefined ? [...explicitTop] : inSection.filter(c => !c.parentId))
      .sort((a, b) => (b.isPinned === true) - (a.isPinned === true)
        || (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
    const repliesFor = id => comments.filter(c => c.parentId === id)
      .sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));

    // Comment removal is a moderation power (three-tier model): own comment,
    // club host/mod, site admin, or site moderator.
    const canDelete = c => session && (c.slug === mySlug || canOperate());

    const reactionChips = (c) => {
      const reactions = c.reactions || {};
      const chips = Object.entries(reactions).map(([emoji, who]) => {
        const mine = mySlug && who.includes(mySlug);
        return session
          ? `<button class="rx-chip ${mine ? 'mine' : ''}" data-react="${c.id}" data-emoji="${emoji}" title="${escapeHtml(who.join(', '))}">${emoji} ${who.length}</button>`
          : `<span class="rx-chip" title="${escapeHtml(who.join(', '))}">${emoji} ${who.length}</span>`;
      }).join('');
      const picker = reactingTo === c.id
        ? `<span class="rx-picker">${REACTION_EMOJI.map(e =>
            `<button data-react="${c.id}" data-emoji="${e}">${e}</button>`).join('')}</span>`
        : '';
      return chips || picker ? `<div class="rx-row">${chips}${picker}</div>` : '';
    };

    const one = (c, isReply) => {
      const tagged = typeof c.chapterIndex === 'number';
      const spoiler = !isArchived() && hasChapters()
        && isCommentSpoiler(c.chapterIndex, myChapter()) && !revealedSpoilers.has(c.id);
      if (spoiler) {
        return `
          <div class="comment ${isReply ? 'reply' : ''} spoiler-box">
            <span>\ud83d\udd12 Spoiler — tagged ${escapeHtml(chLabel(c.chapterIndex))} by ${escapeHtml(c.displayName)}</span>
            <button data-reveal="${c.id}">Reveal anyway</button>
          </div>`;
      }
      const isNew = (c.createdAt?.seconds || 0) > lastSeenTs && c.slug !== mySlug;
      const mentionsMe = session && mentionsUser(c.text, session.displayName);
      return `
      <div class="comment ${isReply ? 'reply' : ''} ${mentionsMe ? 'mentions-me' : ''}" id="c-${c.id}">
        <div class="c-head">
          ${c.isBot ? '<img class="bot-avatar" src="static/img/gabi.png" alt="GABI">' : ''}
          <span class="c-author">${escapeHtml(c.displayName)}</span>
          ${c.isBot ? '<span class="bot-badge" title="AI starter question">AI</span>' : ''}
          <span class="c-date">${fmtDate(c.createdAt)}</span>
          ${isNew ? '<span class="new-dot" title="New since your last visit"></span>' : ''}
          ${tagged && hasChapters() ? `<span class="ch-chip" title="${escapeHtml(chLabel(c.chapterIndex))}">@ Ch ${c.chapterIndex + 1}</span>` : ''}
          ${c.isPinned ? '<span class="pin-badge">\ud83d\udccc pinned</span>' : ''}
        </div>
        <div class="c-text">${highlightMentions(c.text, memberNames(), session ? session.displayName : null)}</div>
        ${reactionChips(c)}
        <div class="c-actions">
          <button data-link="${c.id}" title="Copy a link to this comment">Link</button>
          ${session ? `<button data-react-open="${c.id}">React</button>` : ''}
          ${!isReply && session ? `<button data-reply="${c.id}" data-ms="${escapeHtml(milestoneId)}">Reply</button>` : ''}
          ${!isReply && isMod() ? `<button data-pin="${c.id}">${c.isPinned ? 'Unpin' : 'Pin'}</button>` : ''}
          ${canDelete(c) ? `<button class="danger" data-del="${c.id}">Delete</button>` : ''}
        </div>
        ${replyTo === c.id ? composerHtml(milestoneId, c.id, hasChapters() ? { part: c.partIndex, chapter: c.chapterIndex } : undefined) : ''}
      </div>`;
    };

    const list = topLevel.map(c => one(c, false) + repliesFor(c.id).map(r => one(r, true)).join('')).join('');
    const canCompose = session && (!isArchived() || milestoneId === GENERAL_MILESTONE);
    const footer = canCompose
      ? composerHtml(milestoneId, null, target)
      : (session ? '' : '<div class="notice">Sign in on the <a href="index.html">catalog page</a> to join the discussion.</div>');
    return (list || '<div class="empty" style="padding:14px">No comments yet — start the discussion!</div>') + footer;
  }

  // One AI starter question per section for hosts/mods (club-toggleable).
  // "Post this" publishes it under the GABI identity, tagged to the whole
  // part (not an individual chapter).
  function starterQuestionHtml(milestoneId, partGroup, partIdx) {
    if (!bookPrompts || !isMod() || isArchived()) return '';
    if (club.promptsEnabled === false) return '';
    if (milestoneId === GENERAL_MILESTONE) return '';
    let matches;
    if (partGroup) {
      matches = bookPrompts.filter(p => p.chapter_index >= partGroup.start && p.chapter_index <= partGroup.end);
    } else {
      const m = read.milestones.find(x => x.id === milestoneId);
      if (!m) return '';
      matches = typeof m.chStart === 'number'
        ? bookPrompts.filter(p => p.chapter_index >= m.chStart && p.chapter_index <= m.chEnd)
        : bookPrompts;
    }
    if (!matches.length) return '';
    const pick = matches[Math.floor(Math.random() * matches.length)];
    return `
      <div class="starter-q">
        \ud83d\udca1 <em>${escapeHtml(pick.question)}</em>
        <button data-use-prompt data-ms-target="${escapeHtml(milestoneId || GENERAL_MILESTONE)}"
          data-part="${typeof partIdx === 'number' ? partIdx : ''}"
          data-q="${escapeHtml(pick.question)}">Post as GABI</button>
      </div>`;
  }

  function composerHtml(milestoneId, parentId, target) {
    // target (chapter-based reads): {part} = part-level, {chapter} = chapter
    // thread, {} = General. The bucket is implicit — no tag dropdown needed.
    const targetAttrs = target !== undefined
      ? ` data-part="${typeof target.part === 'number' ? target.part : ''}" data-chapter="${typeof target.chapter === 'number' ? target.chapter : ''}"`
      : '';
    const tagSelect = (target === undefined && hasChapters()) ? `
          <select class="ch-tag" title="Optional: tag the chapter you're at — readers who aren't there yet see this comment as a spoiler">
            <option value="">No chapter tag</option>
            ${chapterOptionsHtml(!parentId ? myChapter() : -2)}
          </select>` : '';
    const hint = target !== undefined && typeof target.part === 'number' && typeof target.chapter !== 'number'
      ? `<span class="char-count">part-level — no exact chapter needed</span>` : '';
    return `
      <div class="composer" data-composer data-ms="${escapeHtml(milestoneId)}" data-parent="${parentId || ''}"${targetAttrs}>
        <textarea maxlength="${MAX_COMMENT_LENGTH}" placeholder="${parentId ? 'Write a reply...' : 'Add to the discussion...'}"></textarea>
        <div class="composer-row">
          <button data-post>Post</button>${tagSelect}${hint}
          <span class="char-count">0 / ${MAX_COMMENT_LENGTH}</span>
        </div>
      </div>`;
  }

  // Poll card for one tagged poll. Locking mirrors the section lock right
  // above it (isMilestoneLocked) but via isPollLocked/myPollPosition, since
  // a chaptered read's sections don't use the abstract "position" number the
  // way non-chaptered sections do — memberSchedulePosition bridges both.
  //
  // backlog #3b: this page's "New Poll" composer never offers the 'next
  // book' type (see openPollModal below) — next-book polls are club-wide by
  // nature (readId always null, same reasoning as the TBR list living on
  // club.html rather than here), so getPolls()'s readId===readId filter
  // means one can never actually reach this function. The option renderer
  // below still goes through the shared pollOptionContentHtml so this page
  // would render a book-ref option correctly if that ever changed, rather
  // than silently mis-rendering `[object Object]`.
  function pollCardHtml(poll) {
    const locked = !isArchived() && isPollLocked(poll, myPollPosition());
    if (locked) {
      const ms = (read.milestones || []).find(m => m.id === poll.milestoneId);
      return `<div class="poll-locked">🔒 A poll unlocks at <strong>${escapeHtml(ms ? ms.label : 'a later section')}</strong></div>`;
    }
    const votes = pollVotes[poll.id] || [];
    const myVote = myPollVote(votes, mySlug);
    const showResults = pollResultsVisible(poll, myVote !== null, canOperate());
    const { counts, total } = tallyPollVotes(poll.options, votes);
    const canVote = session && myRole() && poll.status === 'open' && !isArchived();
    const optionsHtml = poll.options.map((opt, i) => {
      const pct = total > 0 ? Math.round((counts[i] / total) * 100) : 0;
      const mine = myVote === i;
      const label = pollOptionContentHtml(poll, opt);
      if (canVote && !showResults) {
        return `<button class="poll-opt" data-poll-vote="${poll.id}" data-opt="${i}">${label}</button>`;
      }
      return `
        <div class="poll-result${mine ? ' mine' : ''}"${canVote ? ` data-poll-vote="${poll.id}" data-opt="${i}" role="button" tabindex="0"` : ''}>
          <div class="poll-result-bar" style="width:${pct}%"></div>
          <span class="poll-result-label">${label}${mine ? ' ✓' : ''}</span>
          <span class="poll-result-pct">${showResults ? `${pct}% (${counts[i]})` : ''}</span>
        </div>`;
    }).join('');
    return `
      <div class="poll-card">
        <div class="poll-q">📊 ${escapeHtml(poll.question)}${poll.status === 'closed' ? ' <span class="poll-closed-tag">Closed</span>' : ''}</div>
        <div class="poll-options">${optionsHtml}</div>
        ${showResults ? `<div class="poll-total">${total} vote${total !== 1 ? 's' : ''}</div>` : ''}
        ${canOperate() ? `
          <div class="poll-admin">
            <button data-poll-toggle="${poll.id}" data-status="${poll.status}">${poll.status === 'open' ? 'Close poll' : 'Reopen poll'}</button>
            <button class="danger" data-poll-del="${poll.id}">Delete</button>
          </div>` : ''}
      </div>`;
  }

  // Entry point banner: poll count + "+ New Poll" for mods. Renders nothing
  // when the feature is off, matching schedBannerHtml's pattern.
  function pollBannerHtml() {
    if (!pollsOn() || isArchived()) return '';
    const newBtn = canOperate() ? '<button class="poll-new-btn" id="poll-new-btn">+ New Poll</button>' : '';
    if (!polls.length && !newBtn) return '';
    return `<div class="poll-banner">📊 ${polls.length} poll${polls.length !== 1 ? 's' : ''} in this read<span style="margin-left:auto">${newBtn}</span></div>`;
  }

  // Blind ratings banner: a rate composer + count while blind, a sorted
  // reveal ceremony with an average headline once a manager reveals.
  function ratingsBannerHtml() {
    if (!blindRatingsOn()) return '';
    const revealed = ratingsAreRevealed(read);
    const count = read.ratingCount || 0;
    // Unlike most manager/member actions on this page, rating is allowed on
    // BOTH active and finished/abandoned reads (per spec) — a book stays
    // ratable after the club moves on, so no !isArchived() gate here.
    const canRate = !!(session && myRole());
    // Blind: read my own pick back from the localStorage mirror (Firestore
    // denies the real read to everyone until reveal — see club-reads.js).
    // Revealed: the real doc, now that `ratings` was actually fetched.
    const mine = revealed
      ? ratings.find(r => r.slug === mySlug) || null
      : (canRate ? getMyStoredRating(clubId, readId, mySlug) : null);
    const starOptions = [5, 4.5, 4, 3.5, 3, 2.5, 2, 1.5, 1, 0.5].map(v =>
      `<option value="${v}" ${mine && mine.rating === v ? 'selected' : ''}>${v}★</option>`).join('');
    const composer = canRate ? `
      <div class="rate-composer">
        <select id="rate-stars">${starOptions}</select>
        <input type="text" id="rate-comment" maxlength="${MAX_RATING_COMMENT_LENGTH}"
          placeholder="Optional one-line comment" value="${escapeHtml(mine ? (mine.comment || '') : '')}">
        <button id="rate-submit">${mine ? 'Update rating' : 'Submit rating'}</button>
      </div>` : '';

    if (!revealed) {
      // The reveal is a read-lifecycle action: this club's bound managers, or
      // a site moderator (MANAGECLUB SPLIT, 2026-08-17). Someone whose
      // display-name role says host but whose account is not on the roster
      // gets the reason instead of a button rules would refuse.
      const revealBtn = canRunReads() && count > 0
        ? `<button class="reveal-btn" id="reveal-ratings-btn">🎉 Reveal ratings</button>` : '';
      const revealNote = (!revealBtn && mayRunReads() && count > 0)
        ? 'Revealing is done by the accounts on this club\'s manager roster, or by a site moderator — yours isn\'t one of them yet, so the button would be refused. Secure your role on the club page, or ask a site moderator or admin to add your account.'
        : '';
      const mineTxt = canRate
        ? (mine ? `Your rating: ${renderStars(mine.rating)}${mine.comment ? ` — "${escapeHtml(mine.comment)}"` : ''}`
                : "You haven't rated yet — only you can see your own pick until reveal.")
        : '';
      return `
        <div class="rate-banner">
          <div class="rate-banner-head">🌟 Blind ratings — ${count} of ${members.length} member${members.length !== 1 ? 's' : ''} rated so far. Ratings stay hidden until revealed.${revealBtn ? `<span style="margin-left:auto">${revealBtn}</span>` : ''}</div>
          ${revealNote ? `<div class="rate-mine">${revealNote}</div>` : ''}
          ${mineTxt ? `<div class="rate-mine">${mineTxt}</div>` : ''}
          ${composer}
        </div>`;
    }

    const { average, count: n } = tallyRatings(ratings);
    const revealedAtMs = ratingTimestampMs(read.revealedAt);
    const cards = sortRatingsForReveal(ratings).map(r => {
      const after = isRatingAfterReveal(ratingTimestampMs(r.createdAt), revealedAtMs);
      // Rating removal is a moderation power (three-tier model), POST-REVEAL
      // only: while blind nobody (moderators included) can even read the
      // subcollection, so no affordance exists to show.
      const delBtn = canOperate()
        ? ` <button class="danger" data-rating-del="${escapeHtml(r.slug)}" data-name="${escapeHtml(r.displayName)}" title="Remove this rating (moderation)" style="margin-left:auto;background:none;border:1px solid var(--border);color:var(--neon-magenta);cursor:pointer;font-size:.7em;padding:2px 6px">Remove</button>`
        : '';
      return `
        <div class="rate-card${r.slug === mySlug ? ' mine' : ''}">
          <div class="rate-card-head" style="display:flex;align-items:center;gap:6px"><strong>${escapeHtml(r.displayName)}</strong>${after ? ' <span class="rate-after-tag">after reveal</span>' : ''}${delBtn}</div>
          ${renderStars(r.rating)}
          ${r.comment ? `<div class="rate-card-comment">"${escapeHtml(r.comment)}"</div>` : ''}
        </div>`;
    }).join('');
    return `
      <div class="rate-banner revealed">
        <div class="rate-banner-head">🎉 Ratings revealed — average ${average.toFixed(1)}★ (${n} rating${n !== 1 ? 's' : ''})</div>
        <div class="rate-cards">${cards || '<span style="color:var(--muted)">No ratings yet.</span>'}</div>
        ${canRate ? `<div class="rate-mine">${mine ? '' : "Rating now will post visibly, marked “after reveal.”"}</div>${composer}` : ''}
      </div>`;
  }

  function sectionHtml(id, label, position) {
    const inSectionAll = comments.filter(c => (c.milestoneId || GENERAL_MILESTONE) === id);
    const count = inSectionAll.length;
    const newCount = inSectionAll.filter(c => (c.createdAt?.seconds || 0) > lastSeenTs && c.slug !== mySlug).length;
    const milestone = read.milestones.find(m => m.id === id);
    const chStart = milestone && typeof milestone.chStart === 'number' ? milestone.chStart : null;
    const locked = !isArchived() && (
      hasChapters()
        ? (chStart !== null && id !== GENERAL_MILESTONE && myChapter() < chStart)
        : isMilestoneLocked(position, myProgress(), id)
    );
    const due = milestone && typeof milestone.dueAt === 'number' && schedOn() ? milestone.dueAt : null;
    if (locked) {
      return `
        <div class="locked">
          <span>🔒 ${escapeHtml(label)} — ${hasChapters() ? "you haven't reached this yet" : 'update your progress to view'} (spoilers ahead)</span>
          <span class="ms-count">${dueTag(due)}${count} comment${count !== 1 ? 's' : ''}</span>
        </div>`;
    }
    const open = openSections.has(id) ? 'open' : '';
    return `
      <details class="milestone" data-ms-section="${escapeHtml(id)}" ${open}>
        <summary>${escapeHtml(label)}<span class="ms-count">${dueTag(due)}${newCount ? `<span class="new-count">${newCount} new</span> · ` : ''}${count} comment${count !== 1 ? 's' : ''}</span></summary>
        <div class="ms-body">${pollsForPosition(position).map(pollCardHtml).join('')}${starterQuestionHtml(id)}${commentThreadHtml(id)}</div>
      </details>`;
  }

  function render() {
    if (view === 'pace' && !paceGraphOn()) view = 'discussions'; // feature turned off mid-session
    const cover = read.coverHref
      ? `<img class="read-cover" src="${escapeHtml(coverUrl(read.coverHref))}" alt="" onerror="this.remove()">` : '';
    // One chip per club member (not just those who set progress), furthest
    // along first, with an explicit Finished state.
    const lastPos = hasChapters() ? chapterTitles().length - 1
      : (read.milestones.length ? Math.max(...read.milestones.map(m => m.position)) : -1);
    // On-track / behind verdicts come from the reading schedule when the
    // club has the feature on and dates are set; 'none' renders nothing.
    const showSched = schedActive();
    const now = Date.now();
    const progressChips = members
      .map(m => {
        const p = progressAll.find(x => x.slug === m.slug);
        let pos = -1, label = 'Not started';
        if (hasChapters()) {
          if (p && typeof p.chapterIndex === 'number' && p.chapterIndex >= 0) {
            pos = Math.min(p.chapterIndex, lastPos);
            label = parts()[partIndexForChapter(pos)].label;
          }
        } else if (p && p.milestonePosition >= 0) {
          pos = p.milestonePosition;
          label = (read.milestones.find(ms => ms.position === pos) || {}).label || '?';
        }
        const done = pos >= 0 && pos >= lastPos;
        if (done) label = 'Finished ✓';
        const name = m.displayName || (p && p.displayName) || m.slug;
        const sched = showSched && !done
          ? scheduleStatus(read.milestones, p, hasChapters(), now)
          : { status: 'none', behindBy: 0 };
        return { name, pos, done, label, me: m.slug === mySlug, sched };
      })
      .sort((a, b) => b.pos - a.pos || a.name.localeCompare(b.name))
      .map(c => {
        const verdict = c.sched.status === 'behind'
          ? ` · <span class="mp-behind">behind</span>`
          : c.sched.status === 'on-track' ? ` · <span class="mp-ontrack">on track</span>` : '';
        return `<span class="mp-chip${c.done ? ' done' : c.pos < 0 ? ' ns' : ''}${c.me ? ' me' : ''}${c.sched.status === 'behind' ? ' behind' : ''}"${
          c.sched.status === 'behind' ? ` title="${c.sched.behindBy} scheduled section${c.sched.behindBy !== 1 ? 's' : ''} past due"` : ''
        }><strong>${escapeHtml(c.name)}</strong> ${escapeHtml(c.label)}${verdict}</span>`;
      })
      .join('');

    const myPart = myChapter() >= 0 ? partIndexForChapter(Math.min(myChapter(), chapterTitles().length - 1)) : -1;
    const options = hasChapters()
      ? `<option value="-1" ${myChapter() === -1 ? 'selected' : ''}>Not started</option>` + parts().map((g, k) =>
          `<option value="${g.end}" ${myPart === k ? 'selected' : ''}>${escapeHtml(g.label)}</option>`).join('')
      : [`<option value="-1" ${myProgress() === -1 ? 'selected' : ''}>Not started</option>`]
          .concat(read.milestones.map(m =>
            `<option value="${m.position}" ${myProgress() === m.position ? 'selected' : ''}>${escapeHtml(m.label)}</option>`))
          .join('');

    contentEl.innerHTML = `
      <div class="read-header">
        ${cover}
        <div>
          <h1 class="read-title">${escapeHtml(read.bookTitle)}</h1>
          <p class="read-author">${escapeHtml(read.bookAuthor)}</p>
          <div class="read-club">Read by <a href="club.html?id=${encodeURIComponent(clubId)}">${escapeHtml(club.name)}</a></div>
        </div>
      </div>

      ${(bookWarnings || userWarnings.length || session) ? `
        <details class="cw-notes">
          <summary>\u26a0 Content notes (${(bookWarnings || []).length + userWarnings.length})</summary>
          <ul>${(bookWarnings || []).map(w =>
            `<li>${escapeHtml(w.label)} <a href="${escapeHtml(w.source_url)}" target="_blank" rel="noopener">source</a></li>`).join('')}${userWarnings.map(w =>
            `<li>${escapeHtml(w.label)} <span class="cw-by">— added by ${escapeHtml(w.displayName)}</span>${cwDelBtn(w)}</li>`).join('')}</ul>
          ${session && !isArchived() ? '<button id="cw-add" class="cw-add-btn">+ Add a warning</button>' : ''}
        </details>` : ''}
      ${isArchived() ? `
        <div class="archive-banner">This read is ${escapeHtml(read.status)} — discussions are archived. All sections are open (no spoiler locks); new comments only in General.</div>` : ''}
      ${session && myRole() && !isArchived() ? `
        <div class="progress-row">
          <label for="progress-select">${hasChapters() ? "I'm in:" : "I've finished through:"}</label>
          <select id="progress-select">${options}</select>
          <button id="finished-btn" class="finish-me" title="Mark the whole book finished">I'm finished ✓</button>
          <div class="member-progress">${progressChips}</div>
        </div>` : `
        <div class="progress-row"><div class="member-progress" style="margin-left:0">${progressChips}</div></div>`}
      ${schedBannerHtml()}
      ${pollBannerHtml()}
      ${ratingsBannerHtml()}
      <div class="view-switch">
        <button class="tab ${view === 'discussions' ? 'active' : ''}" data-view="discussions">Discussions</button>
        <button class="tab ${view === 'quotes' ? 'active' : ''}" data-view="quotes">Quotes (${quotes.length})</button>
        ${paceGraphOn() ? `<button class="tab ${view === 'pace' ? 'active' : ''}" data-view="pace">Pace</button>` : ''}
      </div>
      ${view === 'quotes' ? renderQuotes() : view === 'pace' ? paceGraphHtml() : (hasChapters() ? renderPartsHierarchy() : `
      ${sectionHtml(GENERAL_MILESTONE, 'General (no spoilers)', -1)}
      ${read.milestones.map(m => sectionHtml(m.id, m.label, m.position)).join('')}`)}
    `;
    wireEvents();
    if (view === 'pace') wirePaceEvents();
  }

  // Schedule banner: next due section + the viewer's own verdict. Renders
  // nothing when the club feature is off; when on but no dates are set yet,
  // hosts/mods get the entry point to create one.
  function schedBannerHtml() {
    if (!schedOn() || isArchived()) return '';
    const scheduled = hasSchedule(read.milestones);
    // Schedule editing is OPERATIONAL — the site moderator gets it too.
    const editBtn = canOperate()
      ? `<button class="sched-edit-btn" id="sched-edit-btn">${scheduled ? 'Edit schedule' : 'Set a reading schedule'}</button>`
      : '';
    if (!scheduled) {
      return editBtn
        ? `<div class="sched-banner">📅 No reading schedule yet.<span style="margin-left:auto">${editBtn}</span></div>`
        : '';
    }
    const now = Date.now();
    const next = nextDueMilestone(read.milestones, now);
    const nextTxt = next
      ? `Next due: <strong>${escapeHtml(next.label)}</strong> by ${escapeHtml(formatDueDate(next.dueAt))}`
      : 'All scheduled sections are past due';
    let mine = '';
    if (session && myRole()) {
      const p = progressAll.find(x => x.slug === mySlug);
      const st = scheduleStatus(read.milestones, p, hasChapters(), now);
      if (st.status === 'behind') {
        mine = ` — <span class="sb-behind">you're behind (${st.behindBy} section${st.behindBy !== 1 ? 's' : ''})</span>`;
      } else if (st.status === 'on-track') {
        mine = ` — <span class="sb-ontrack">you're on track</span>`;
      } else if (st.status === 'done') {
        mine = ` — <span class="sb-ontrack">finished ✓</span>`;
      }
    }
    return `<div class="sched-banner">📅 ${nextTxt}${mine}${editBtn ? `<span style="margin-left:auto">${editBtn}</span>` : ''}</div>`;
  }

  // Parts are the primary sections; chapters nest inside, expandable —
  // audiobook folks comment at part level, page-number folks drill into
  // the exact chapter.
  function renderPartsHierarchy() {
    const buckets = bucketComments();
    const isNewC = c => (c.createdAt?.seconds || 0) > lastSeenTs && c.slug !== mySlug;
    const titles = chapterTitles();

    const generalTop = buckets['general'] || [];
    const out = [sectionShell('general', 'General (no spoilers)', generalTop,
      commentThreadHtml(GENERAL_MILESTONE, generalTop, {}))];

    parts().forEach((g, k) => {
      const partTop = buckets[`p${k}`] || [];
      const chapterTops = [];
      for (let i = g.start; i <= g.end; i++) chapterTops.push(buckets[`c${i}`] || []);
      const keyOfRoot = (c) => {
        const root = c.parentId ? (comments.find(p => p.id === c.parentId) || c) : c;
        return bucketKeyFor(root);
      };
      const inThisPart = (key) =>
        key === `p${k}` || (key[0] === 'c' && +key.slice(1) >= g.start && +key.slice(1) <= g.end);
      const partAll = comments.filter(c => inThisPart(keyOfRoot(c)));
      const totalCount = partAll.length;
      const newCount = partAll.filter(isNewC).length;

      const partDue = milestoneDueByPosition(k);
      const locked = !isArchived() && myChapter() < g.start;
      if (locked) {
        out.push(`
          <div class="locked">
            <span>🔒 ${escapeHtml(g.label)} — you haven't reached this yet (spoilers ahead)</span>
            <span class="ms-count">${dueTag(partDue)}${totalCount} comment${totalCount !== 1 ? 's' : ''}</span>
          </div>`);
        return;
      }

      const chapterSections = chapterTops.map((top, j) => {
        const i = g.start + j;
        const chLocked = !isArchived() && i > myChapter();
        const cCount = top.length;
        if (chLocked) {
          return `
            <div class="locked locked-ch">
              <span>🔒 ${escapeHtml(chLabel(i))}</span>
              <span class="ms-count">${cCount} comment${cCount !== 1 ? 's' : ''}</span>
            </div>`;
        }
        return sectionShell(`c${i}`, chLabel(i), top,
          commentThreadHtml(GENERAL_MILESTONE, top, { chapter: i }), 'ch-section');
      }).join('');

      const chCommentCount = chapterTops.reduce((s, l) => s + l.length, 0);
      const body = `
        ${pollsForPosition(k).map(pollCardHtml).join('')}
        ${starterQuestionHtml(null, g, k)}
        ${commentThreadHtml(GENERAL_MILESTONE, partTop, { part: k })}
        <details class="chapters-wrap" ${openSections.has(`pch${k}`) ? 'open' : ''} data-ms-section="pch${k}">
          <summary>Chapters ${g.start + 1}–${g.end + 1}<span class="ms-count">${chCommentCount} chapter comment${chCommentCount !== 1 ? 's' : ''}</span></summary>
          <div class="chapters-body">${chapterSections}</div>
        </details>`;
      out.push(sectionShell(`part${k}`, g.label, null,
        body, '', `${dueTag(partDue)}${newCount ? `<span class="new-count">${newCount} new</span> · ` : ''}${totalCount} comment${totalCount !== 1 ? 's' : ''}`));
    });
    return out.join('');
  }

  function sectionShell(key, label, topComments, bodyHtml, extraClass = '', countHtml = null) {
    const count = topComments ? topComments.length : 0;
    const counter = countHtml !== null ? countHtml : `${count} comment${count !== 1 ? 's' : ''}`;
    const open = openSections.has(key) ? 'open' : '';
    return `
      <details class="milestone ${extraClass}" data-ms-section="${escapeHtml(key)}" ${open}>
        <summary>${escapeHtml(label)}<span class="ms-count">${counter}</span></summary>
        <div class="ms-body">${bodyHtml}</div>
      </details>`;
  }

  function renderQuotes() {
    const canDeleteQuote = q => session && (q.slug === mySlug || canOperate());
    const cards = quotes.map(q => {
      const spoiler = !isArchived() && hasChapters()
        && isCommentSpoiler(q.chapterIndex, myChapter()) && !revealedSpoilers.has(q.id);
      if (spoiler) {
        return `
          <div class="quote-card spoiler-box">
            <span>\ud83d\udd12 Spoiler quote — tagged ${escapeHtml(chLabel(q.chapterIndex))}, saved by ${escapeHtml(q.displayName)}</span>
            <button data-reveal="${q.id}">Reveal anyway</button>
          </div>`;
      }
      return `
        <div class="quote-card">
          <blockquote>\u201c${escapeHtml(q.text)}\u201d</blockquote>
          <div class="quote-meta">
            ${typeof q.chapterIndex === 'number' ? `<span class="ch-chip">@ Ch ${q.chapterIndex + 1}</span>` : ''}
            <span>saved by ${escapeHtml(q.displayName)}</span>
            ${canDeleteQuote(q) ? `<button class="danger" data-quote-del="${q.id}">Delete</button>` : ''}
          </div>
        </div>`;
    }).join('');
    const composer = session && myRole() && !isArchived() ? `
      <div class="composer" id="quote-composer">
        <textarea id="quote-text" maxlength="${MAX_QUOTE_LENGTH}" placeholder="A line worth keeping..."></textarea>
        <div class="composer-row">
          <button id="quote-save">Save Quote</button>
          ${hasChapters() ? `<select class="ch-tag" id="quote-tag"><option value="">No chapter tag</option>${chapterOptionsHtml(myChapter())}</select>` : ''}
        </div>
      </div>` : '';
    return `
      ${cards || '<div class="empty">No quotes saved yet — drop the lines that hit.</div>'}
      ${composer}
    `;
  }

  // Buddy-read pace graph (backlog #6). Hand-built inline SVG — no charting
  // library, matching the rest of this no-build-step site. All the geometry
  // (series, expected-schedule line, shared time/position domain) comes
  // from computePaceGraphModel() in club-reads.js; this function only turns
  // that data into markup. Axis is numeric/percent only — see the spoiler
  // note on the "Buddy-read pace graph" section in club-reads.js for why no
  // section title ever appears here.
  const PACE_W = 640, PACE_H = 220, PACE_PAD_L = 34, PACE_PAD_R = 12, PACE_PAD_T = 10, PACE_PAD_B = 22;
  function paceGraphHtml() {
    const finishedAtMs = ratingTimestampMs(read.finishedAt);
    const model = computePaceGraphModel(
      progressAll, read.milestones, hasChapters(),
      { status: read.status, finishedAtMs }, Date.now());

    if (model.empty) {
      return `<div class="pace-panel">
        <h3 class="pace-title">Pace</h3>
        <div class="pace-empty">No progress recorded yet — this fills in as members update where they are.</div>
      </div>`;
    }

    const plotW = PACE_W - PACE_PAD_L - PACE_PAD_R;
    const plotH = PACE_H - PACE_PAD_T - PACE_PAD_B;
    const x = (ms) => PACE_PAD_L + paceScaleX(ms, model.startMs, model.endMs, plotW);
    const y = (pos) => PACE_PAD_T + paceScaleY(pos, model.maxPosition, plotH);

    const memberSlugs = Object.keys(model.seriesByMember).sort((a, b) => memberName(a).localeCompare(memberName(b)));
    const colors = assignPaceColors(memberSlugs);

    const gridLines = [0, .25, .5, .75, 1].map(f => {
      const yy = PACE_PAD_T + plotH * (1 - f);
      const label = paceAxisLabel(Math.round(f * model.maxPosition), model.maxPosition);
      return `<line class="pace-grid" x1="${PACE_PAD_L}" x2="${PACE_W - PACE_PAD_R}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}"/>` +
        `<text class="pace-axis-label" x="${PACE_PAD_L - 6}" y="${(yy + 3).toFixed(1)}" text-anchor="end">${label}</text>`;
    }).join('');

    const expectedLine = model.expected.length > 1
      ? `<polyline class="pace-expected" points="${model.expected.map(pt => `${x(pt.atMs).toFixed(1)},${y(pt.position).toFixed(1)}`).join(' ')}"/>`
      : '';

    const lines = memberSlugs.filter(slug => model.seriesByMember[slug].length).map(slug => {
      const series = model.seriesByMember[slug];
      const c = colors[slug];
      const pts = series.map(pt => `${x(pt.atMs).toFixed(1)},${y(pt.position).toFixed(1)}`).join(' ');
      const dash = c.dashed ? ' stroke-dasharray="6,4"' : '';
      const last = series[series.length - 1];
      const name = escapeHtml(memberName(slug));
      const markers = series.map(pt =>
        `<circle cx="${x(pt.atMs).toFixed(1)}" cy="${y(pt.position).toFixed(1)}" r="8" fill="transparent">` +
        `<title>${name} — ${paceAxisLabel(pt.position, model.maxPosition)} — ${escapeHtml(new Date(pt.atMs).toLocaleDateString())}</title></circle>`
      ).join('');
      return `<g class="pace-line" data-member="${escapeHtml(slug)}">
        <polyline points="${pts}" fill="none" stroke="${c.color}" stroke-width="2"${dash}/>
        <circle cx="${x(last.atMs).toFixed(1)}" cy="${y(last.position).toFixed(1)}" r="3.5" fill="${c.color}"/>
        ${markers}
      </g>`;
    }).join('');

    const todayLine = model.todayMs != null
      ? `<line class="pace-today" x1="${x(model.todayMs).toFixed(1)}" x2="${x(model.todayMs).toFixed(1)}" y1="${PACE_PAD_T}" y2="${PACE_H - PACE_PAD_B}"/>` +
        `<text class="pace-axis-label" x="${x(model.todayMs).toFixed(1)}" y="${PACE_H - 6}" text-anchor="middle">today</text>`
      : '';

    const legend = memberSlugs.map(slug => {
      const c = colors[slug];
      return `<button type="button" class="pace-legend-item${pacePinned === slug ? ' active' : ''}" data-pace-legend="${escapeHtml(slug)}">` +
        `<span class="pace-swatch" style="background:${c.color}${c.dashed ? ';border:1px dashed var(--muted)' : ''}"></span>${escapeHtml(memberName(slug))}</button>`;
    }).join('');

    return `<div class="pace-panel">
      <h3 class="pace-title">Pace${model.frozen ? ' <span class="pace-frozen">(finished — frozen)</span>' : ''}</h3>
      <div class="pace-svg-wrap">
        <svg viewBox="0 0 ${PACE_W} ${PACE_H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Member progress over time">
          ${gridLines}${expectedLine}${lines}${todayLine}
        </svg>
      </div>
      <div class="pace-legend">${legend}</div>
    </div>`;
  }

  // Legend hover highlights a member's line; click/tap pins it (so touch
  // devices, which don't reliably fire hover, still get the "highlight one
  // member" interaction the brief asks for).
  function wirePaceEvents() {
    const panel = contentEl.querySelector('.pace-panel');
    if (!panel) return;
    const setActive = (slug) => {
      panel.querySelectorAll('.pace-line').forEach(g => {
        g.style.opacity = (!slug || g.dataset.member === slug) ? '1' : '.18';
      });
      panel.querySelectorAll('.pace-legend-item').forEach(b => {
        b.classList.toggle('active', !!slug && b.dataset.paceLegend === slug);
      });
    };
    panel.querySelectorAll('[data-pace-legend]').forEach(btn => {
      btn.addEventListener('mouseenter', () => { if (!pacePinned) setActive(btn.dataset.paceLegend); });
      btn.addEventListener('mouseleave', () => { if (!pacePinned) setActive(pacePinned); });
      btn.addEventListener('click', () => {
        pacePinned = pacePinned === btn.dataset.paceLegend ? null : btn.dataset.paceLegend;
        setActive(pacePinned);
      });
    });
  }

  function showError(msg) {
