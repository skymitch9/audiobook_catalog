<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Keep this page out of search results. It is UNLISTED, not protected: on a
     public GitHub Pages site anyone with the URL can fetch it, and the admin
     check below is client-side only (see docs/TODO.md handoff 2026-08-04).
     The pipeline trigger is safe regardless — it needs a token that is never
     shipped in this file. -->
<meta name="robots" content="noindex, nofollow">
<title>Admin - Audiobook Catalog</title>
<link rel="icon" type="image/png" href="static/img/favicon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f141a; color: #e7eef7;
    padding: 20px; min-height: 100vh;
  }
  .container { max-width: 800px; margin: 0 auto; }
  h1 { margin-bottom: 8px; }
  .subtitle { color: #9fb0c6; margin-bottom: 20px; }
  .auth-gate { padding: 20px; background: #1a2330; border: 1px solid #263241; border-radius: 12px; margin-bottom: 20px; }
  .auth-gate p { margin-bottom: 10px; }
  #identity-bar { margin-bottom: 20px; }
  .identity-bar { padding: 10px 14px; border-radius: 10px; background: #1a2330; border: 1px solid #263241; }
  .identity-bar--logged-in { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .identity-bar__greeting { font-weight: 600; }
  .identity-bar__logout-btn { padding: 6px 14px; border: 1px solid #2b3a4d; border-radius: 8px; background: #1a2330; color: #e7eef7; cursor: pointer; }
  .identity-bar__logout-btn:hover { background: #16324a; }
  .identity-bar--logged-out { text-align: left; }
  .identity-bar__form { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .identity-bar__label { display: flex; align-items: center; gap: 4px; font-size: .9rem; color: #9fb0c6; }
  .identity-bar__input { padding: 6px 10px; border: 1px solid #263241; border-radius: 8px; background: #0f141a; color: #e7eef7; font-size: .9rem; }
  .identity-bar__buttons { display: flex; gap: 6px; }
  .identity-bar__register-btn, .identity-bar__signin-btn { padding: 6px 14px; border: 1px solid #2b3a4d; border-radius: 8px; background: #1a2330; color: #e7eef7; cursor: pointer; }
  .identity-bar__register-btn:hover, .identity-bar__signin-btn:hover { background: #16324a; }
  .identity-bar__error { color: #e53e3e; font-size: .85rem; display: block; }
  .denied { padding: 40px; text-align: center; color: #e53e3e; font-size: 1.2rem; }
  .user-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  .user-table th, .user-table td { padding: 10px 12px; border: 1px solid #263241; text-align: left; }
  .user-table th { background: #1a2330; color: #9fb0c6; }
  .user-table tr:nth-child(even) { background: #121820; }
  .reset-btn {
    padding: 4px 12px; border: 1px solid #e53e3e; border-radius: 6px;
    background: transparent; color: #e53e3e; cursor: pointer; font-size: .85rem;
  }
  .reset-btn:hover { background: #e53e3e20; }
  .reset-btn:disabled { opacity: .5; cursor: not-allowed; }
  .status { font-size: .8rem; margin-left: 8px; }
  .status--ok { color: #48bb78; }
  .status--reset { color: #f6ad55; }
  .back-link { display: inline-block; margin-top: 20px; color: #667eea; text-decoration: none; }
  .back-link:hover { text-decoration: underline; }
  .loading { color: #9fb0c6; padding: 20px; }

  /* ---- Pipeline status card ---- */
  .pl-section { margin: 24px 0; }
  .pl-section h2 { font-size: 1.1rem; margin-bottom: 12px; }
  .pl-card { background: #1a2330; border: 1px solid #263241; border-radius: 12px; padding: 16px; }
  .pl-card--running { border-color: #3b6ea5; }
  .pl-card--failed  { border-color: #e53e3e; }
  .pl-card--partial, .pl-card--unknown { border-color: #f6ad55; }
  .pl-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .pl-dot { width: 10px; height: 10px; border-radius: 50%; background: #4a5568; flex: none; }
  .pl-dot--running { background: #4299e1; animation: pl-pulse 1.4s ease-in-out infinite; }
  .pl-dot--success { background: #48bb78; }
  .pl-dot--failed  { background: #e53e3e; }
  .pl-dot--partial, .pl-dot--unknown { background: #f6ad55; }
  @keyframes pl-pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .pl-dot--running { animation: none; } }
  .pl-state { font-size: .8rem; letter-spacing: .06em; color: #9fb0c6; }
  .pl-when, .pl-trigger { font-size: .8rem; color: #6b7f96; margin-left: auto; }
  .pl-trigger { margin-left: 0; }
  .pl-steps { list-style: none; margin: 0; padding: 0; }
  .pl-step { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; font-size: .9rem; }
  .pl-step--pending { color: #55677d; }
  .pl-step--done    { color: #9fb0c6; }
  .pl-step--active  { color: #e7eef7; font-weight: 600; }
  .pl-step--failed  { color: #e53e3e; }
  .pl-step--skipped { color: #55677d; font-style: italic; }
  .pl-step__mark  { width: 1em; flex: none; text-align: center; }
  .pl-step__detail { color: #6b7f96; font-size: .82rem; font-weight: 400; }
  .pl-progress { margin: 4px 0 8px 1.6em; }
  .pl-progress__bar { height: 6px; background: #0f141a; border-radius: 4px; overflow: hidden; border: 1px solid #263241; }
  .pl-progress__bar span { display: block; height: 100%; background: #4299e1; transition: width .3s ease; }
  .pl-progress__label { font-size: .78rem; color: #9fb0c6; margin-top: 4px; word-break: break-word; }
  .pl-summary { margin-top: 12px; padding-top: 10px; border-top: 1px solid #263241; font-size: .85rem; color: #9fb0c6; }
  .pl-error { background: #e53e3e1a; border: 1px solid #e53e3e55; color: #ffb4b4;
              padding: 8px 10px; border-radius: 8px; font-size: .85rem; margin-bottom: 10px; word-break: break-word; }
  .pl-hint { color: #6b7f96; font-size: .85rem; margin-top: 8px; }
  .pl-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .pl-run-btn { padding: 9px 18px; border: 1px solid #48bb78; border-radius: 8px;
                background: #48bb7818; color: #48bb78; cursor: pointer; font-size: .95rem; font-weight: 600; }
  .pl-run-btn:hover:not(:disabled) { background: #48bb7830; }
  .pl-run-btn:disabled { opacity: .5; cursor: not-allowed; }
  .pl-token-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .pl-token-row input { flex: 1 1 260px; padding: 7px 10px; border: 1px solid #263241;
                        border-radius: 8px; background: #0f141a; color: #e7eef7; font-size: .85rem; }
  .pl-token-row button { padding: 7px 14px; border: 1px solid #2b3a4d; border-radius: 8px;
                         background: #1a2330; color: #e7eef7; cursor: pointer; }
  .pl-msg { font-size: .85rem; }
  .pl-msg--ok { color: #48bb78; }
  .pl-msg--err { color: #e53e3e; }
  .pl-hist { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: .85rem; }
  .pl-hist th, .pl-hist td { padding: 7px 10px; border: 1px solid #263241; text-align: left; }
  .pl-hist th { background: #1a2330; color: #9fb0c6; font-weight: 600; }
  .pl-hist__title { font-size: .95rem; margin-top: 20px; color: #9fb0c6; }
  .pl-hist__state--success { color: #48bb78; }
  .pl-hist__state--failed  { color: #e53e3e; }
  .pl-hist__state--partial { color: #f6ad55; }
  .pl-table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<div class="container">
  <h1>🔧 Admin Panel</h1>
  <p class="subtitle">Manage user accounts</p>

  <div id="identity-bar"></div>

  <!-- Populated only for the admin; see checkAccess() below. -->
  <section class="pl-section" id="pipeline-section" hidden>
    <h2>📡 Sync pipeline</h2>
    <div id="pipeline-status"><div class="loading">Loading status…</div></div>
    <div class="pl-actions">
      <button id="pl-run-btn" class="pl-run-btn" type="button">▶ Run pipeline now</button>
      <span id="pl-msg" class="pl-msg"></span>
    </div>
    <div class="pl-token-row" id="pl-token-row">
      <input id="pl-token" type="password" autocomplete="off" spellcheck="false"
             placeholder="PIPELINE_TRIGGER_TOKEN (from .env) — stored on this device only">
      <button id="pl-token-save" type="button">Save token</button>
    </div>
    <p class="pl-hint">
      The token is what makes a run request real — the machine ignores requests without it.
      It is kept in this browser's localStorage and never committed.
    </p>
    <div class="pl-table-wrap" id="pipeline-history"></div>
  </section>

  <div id="admin-content"></div>

  <a href="index.html" class="back-link">← Back to Catalog</a>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
  import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
  import { col } from './fb-env.js';
  import { renderIdentityBar, getSession, adminResetPassword } from './identity.js';
  import {
    watchStatus, loadHistory, requestRun, getToken, setToken,
  } from './pipeline-status.js';

  const firebaseConfig = {
    apiKey: "AIzaSyDgAblkxzVxl7nFbd7jXOo6PpuNPsJw11Y",
    authDomain: "audiobook-catalog.firebaseapp.com",
    projectId: "audiobook-catalog",
    storageBucket: "audiobook-catalog.firebasestorage.app",
    messagingSenderId: "68492219785",
    appId: "1:68492219785:web:7cbe57dda8712377f0bd58"
  };

  const ADMIN_NAME = '!Sky';
  let db = null;

  try {
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
  } catch (e) {
    console.warn('Firebase init failed:', e);
  }

  function checkAccess() {
    const content = document.getElementById('admin-content');
    const session = getSession();

    if (!session || session.displayName !== ADMIN_NAME) {
      content.innerHTML = '<div class="denied">⛔ Access denied. Sign in as admin.</div>';
      return;
    }

    initPipelinePanel(session);
    loadUsers();
  }

  let unsubscribeStatus = null;

  function initPipelinePanel(session) {
    const section = document.getElementById('pipeline-section');
    if (!db) {
      section.hidden = false;
      document.getElementById('pipeline-status').innerHTML =
        '<div class="pl-card pl-card--failed"><div class="pl-error">Firebase unavailable — status cannot load.</div></div>';
      return;
    }
    section.hidden = false;

    unsubscribeStatus = watchStatus(db, document.getElementById('pipeline-status'));
    loadHistory(db, document.getElementById('pipeline-history'));

    const tokenInput = document.getElementById('pl-token');
    const msg = document.getElementById('pl-msg');
    if (getToken()) {
      tokenInput.placeholder = 'Token saved on this device — paste again to replace';
    }

    document.getElementById('pl-token-save').addEventListener('click', () => {
      const v = tokenInput.value.trim();
      if (v.length < 16) {
        msg.textContent = 'That token looks too short.';
        msg.className = 'pl-msg pl-msg--err';
        return;
      }
      setToken(v);
      tokenInput.value = '';
      tokenInput.placeholder = 'Token saved on this device — paste again to replace';
      msg.textContent = 'Token saved.';
      msg.className = 'pl-msg pl-msg--ok';
    });

    const runBtn = document.getElementById('pl-run-btn');
    runBtn.addEventListener('click', async () => {
      runBtn.disabled = true;
      msg.textContent = 'Requesting…';
      msg.className = 'pl-msg';
      try {
        msg.textContent = await requestRun(db, session.displayName);
        msg.className = 'pl-msg pl-msg--ok';
      } catch (e) {
        msg.textContent = e.message || String(e);
        msg.className = 'pl-msg pl-msg--err';
      } finally {
        // Long enough that an impatient second click can't stack requests; the
        // watcher's cooldown is the real guard, this is just UI courtesy.
        setTimeout(() => { runBtn.disabled = false; }, 15000);
      }
    });
  }

  window.addEventListener('beforeunload', () => {
    if (unsubscribeStatus) unsubscribeStatus();
  });

  async function loadUsers() {
    const content = document.getElementById('admin-content');
    content.innerHTML = '<div class="loading">Loading users…</div>';

    try {
      const snapshot = await getDocs(collection(db, col('users')));
      const users = [];
      snapshot.forEach(d => users.push({ id: d.id, ...d.data() }));

      users.sort((a, b) => (a.displayName || '').localeCompare(b.displayName || ''));

      let html = '<table class="user-table"><thead><tr><th>Display Name</th><th>Status</th><th>Action</th></tr></thead><tbody>';

      users.forEach(u => {
        const isReset = u.passwordReset === true;
        const statusHtml = isReset
          ? '<span class="status status--reset">🔄 Reset pending</span>'
          : '<span class="status status--ok">✅ Active</span>';

        html += `<tr>
          <td>${escapeHtml(u.displayName || u.id)}</td>
          <td>${statusHtml}</td>
          <td><button class="reset-btn" data-name="${escapeHtml(u.displayName || u.id)}" ${isReset ? 'disabled' : ''}>Reset Password</button></td>
        </tr>`;
      });

      html += '</tbody></table>';
      content.innerHTML = html;

      // Attach click handlers
      content.querySelectorAll('.reset-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const name = btn.dataset.name;
          if (!confirm(`Reset password for "${name}"? They will be prompted to set a new passphrase on next login.`)) return;

          btn.disabled = true;
          btn.textContent = 'Resetting…';

          const result = await adminResetPassword(name, db);
          if (result.success) {
            btn.textContent = 'Done ✓';
            const statusCell = btn.closest('tr').querySelector('.status');
            if (statusCell) {
              statusCell.className = 'status status--reset';
              statusCell.innerHTML = '🔄 Reset pending';
            }
          } else {
            btn.textContent = 'Failed';
            alert(result.error);
            btn.disabled = false;
            btn.textContent = 'Reset Password';
          }
        });
      });
    } catch (e) {
      content.innerHTML = '<div class="denied">Failed to load users.</div>';
      console.error(e);
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // Render identity bar
  const identityBarEl = document.getElementById('identity-bar');
  if (identityBarEl && db) {
    renderIdentityBar(identityBarEl, db, {
      onAuthChange: () => checkAccess()
    });
  }

  checkAccess();
</script>
</body>
</html>
