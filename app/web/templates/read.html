<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!--
  THE READER — viewer phase 1b, 2026-08-17. One book at a time, in the browser,
  behind the same gate as the shelf.

  ⚠️ THIS FILE IS A TEMPLATE. It lives in app/web/templates/ and is copied
  VERBATIM to site/read.html by app/writers.py (STATIC_TEMPLATE_PAGES, the same
  convention ebooks.html and guess-game.html already use). Edit it HERE — an
  edit to site/read.html is wiped by the next catalog build.

  ⚠️ THE LOGIC IS NOT IN THIS FILE, and that is not tidiness. site/reader.js is
  an external module because /read's Content-Security-Policy (site/_headers) is
  `script-src 'self'` plus gstatic, with NO 'unsafe-inline' — this page handles
  a large binary from a credentialed endpoint and is the first page on this
  origin that wants a CSP at all. An inline <script> here would be blocked in
  production and nowhere else, which is the worst kind of bug to find.

  WHERE IT LIVES, and the trailing-slash trap. The canonical URL is
  ebooks.heygabi.ai/read?b=<anchor> — EXTENSIONLESS and with NO trailing slash.
  Both halves are load-bearing:
    * Cloudflare Pages 308s /read.html to /read, and ebooks-door passes
      responses through VERBATIM, so a .html link escapes the redirect onto the
      audiobook host and bounces the reader off ebooks.heygabi.ai entirely.
      That exact bug was measured on /ebooks.html on 2026-08-17.
    * /read/ (with the slash) would re-base every relative URL on this page —
      reader.js, fb-env.js, identity.js, the vendored pdf.js — onto /read/,
      where none of them exist.
  The dev lane is a PATH, not a host: /dev/read?b=<anchor> on
  audiobooks.heygabi.ai. Every asset reference here is RELATIVE for exactly
  that reason, so the dev lane loads the dev copies.

  ⚠️ ebooks-door needs no change. It proxies every non-/ path verbatim, so
  /read arrives on ebooks.heygabi.ai the moment the page exists on PROD — and
  not before. Until this is promoted it is reviewable only on the dev lane.

  THE GATE IS SERVER-SIDE AND IS NOT HERE. This page decides nothing: the
  Worker (GET /api/ebooks/manifest and GET /api/ebook/:anchor/file) verifies a
  Firebase ID token and requires the estate's `vis_ebooks` grant on EVERY
  request, including every range. A person who deletes the gate markup with
  devtools gets a 401, not a book.

  ⚠️ READING IS `vis_ebooks`, NOT `download`. The ladder's `download`
  capability floors at `admin` and governs taking a file away — a surface that
  does not exist yet. Nothing on this page consults it, and nothing should:
  gating the reader on it would lock every ordinary member out of the books
  they were granted.

  BOTH FORMATS, since viewer phase 2 (2026-08-17). A PDF renders onto ONE
  canvas (#rd-stage); an EPUB is paginated by foliate-js into #rd-book. The bar
  is shared and re-labels itself, because a reader does not care which renderer
  is underneath — but the two pagers are separate elements, because "page 7 of
  392" and "Chapter 3 · 12%" are different facts and a reflowable book has no
  page 7.

  ⚠️ THE EPUB IS READ OVER BYTE RANGES, and the shell has to allow for it: the
  393 MiB White Sand Omnibus opens in 18 range requests totalling 664 KB
  (measured 2026-08-17). Nothing in this page may hand the renderer a whole
  file — see site/epub-loader.js's header for the trap.

  SAVE YOUR SPOT, since viewer phase 3 (2026-08-17, owner: "for reading ebooks
  we also need to have it save your spot. this will be so important for pwa").
  Nothing on this page decides any of it — site/reading-position.js owns the
  store, the key and the reconcile, and its header is the thing to read. The
  page's only contribution is #rd-resume: the cross-device OFFER, which ships
  hidden and is revealed only when another device's position is both newer and
  elsewhere. ⚠️ It is an offer, never a jump — sync that relocates a reader
  mid-sentence without asking is the complaint every syncing reader collects.

  theme.js is kept, and only theme.js: the shared account modal exposes an
  Appearance section that drives window.estateTheme, and without the script
  those controls would be silently dead. Like the shelf, this page has one
  theme — its own — and honours the resolved data-mode stamp for light/dark
  with a prefers-color-scheme fallback so the palette is right even if scripts
  never run.

  READING MODES, 2026-08-17 (owner: "we need to be able to set the pages white
  and the font black or vice versa as well as make it match the theme").
  read-mode.js stamps <html data-read-mode="paper|ink">, or removes it for the
  third mode, "match theme" — which is not a stamp at all but the existing
  data-mode cascade left to answer. ⚠️ It is a SECOND classic script in <head>
  for the same reason theme.js is one: reader.js is a module, modules are
  deferred, and a mode applied after first paint is a flash of white page for
  everybody who chose black. And it is a FILE rather than an inline stamp
  because the CSP forbids inline scripts here.

  SWIPE TO TURN, same day (owner: "we need a way to swipe to change pages").
  ⚠️ Nothing about it is in this file. A reflowable EPUB is turned by foliate's
  OWN touch handling, which was already vendored; the PDF stage and a
  fixed-layout EPUB's iframes are wired by reader.js through site/swipe.js. The
  one thing this page contributes is `touch-action` on the two stages, which is
  what lets a browser scroll vertically while the gesture is still being judged.

  ⚠️ THE FAULT PANEL, 2026-08-18 — #rd-fault, and the reason it exists is the
  P1 it was written after. On PROD, on an iPhone, this page rendered its ENTIRE
  chrome — masthead, resolved title, Page control, arrows, footer — and an
  EMPTY BORDERED BOX where the book goes, with no error anywhere. The cause was
  `frame-ancestors 'none'` in site/_headers refusing foliate's own blob: iframe
  on WebKit (and only on WebKit); the throw landed inside an iframe `load`
  listener, so the promise reader.js awaited never settled and no catch on this
  page could ever have run. THE LESSON IS NOT THE CSP, it is that a reader with
  no way to say what happened turns a ten-minute bug into a mystery: the owner
  had a screenshot of an empty rectangle and nothing else. #rd-fault is the
  answer — every failure now renders a heading, a plain instruction, and the
  error's OWN WORDS in a selectable monospace block, so a phone in another room
  can read us a sentence. reader.js owns when it appears, including a watchdog
  for the case above, where nothing fails and nothing succeeds.

  ⚠️ NO LINK BACK TO THE AUDIOBOOK SITE, since 2026-08-17 (owner: "ebooks has a
  link to audiobooks on the reader page. remove that we dont need to go back to
  audiobnook page"). Same decision as the removed 📖 Ebooks button on the
  audiobook homepage: they are deliberately different sites now. The way out of
  this page is the SHELF. tests/test_site_pages.py pins it.
-->
<script src="static/js/theme.js"></script>
<script src="read-mode.js"></script>
<title>Read — The Household Shelf</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%239d4a1c'/%3E%3Cpath d='M32 18c-4.5-3.4-10.5-4.6-17-4.6v32c6.5 0 12.5 1.2 17 4.6 4.5-3.4 10.5-4.6 17-4.6v-32c-6.5 0-12.5 1.2-17 4.6z' fill='%23f6f1e6'/%3E%3Cpath d='M32 18v32' stroke='%239d4a1c' stroke-width='2.5' fill='none'/%3E%3C/svg%3E">
<style>
/* The shelf's paper-and-ink palette, carried over so the reader is plainly the
   same place. Both schemes are complete: light on :root, dark applied twice —
   once for theme.js's resolved data-mode stamp, once as a prefers-color-scheme
   fallback for a scriptless load. No colour lives in only one scheme.
   The --bg/--text/--border/--muted/--neon-* names are ALIASES the shared
   account-modal.js reads, pointed at this page's own inks. */
:root{
  --paper:#f6f1e6; --card:#fdfaf2; --ink:#2c2418; --ink-faint:#8a7d66;
  --rule:#ddd2ba; --accent:#9d4a1c; --accent-deep:#7d3a14; --caution:#8f2f2b;
  --stage:#e8e0cf;        /* the desk the page sits on */
  --bg:var(--paper); --bg-2:var(--card); --text:var(--ink);
  --border:var(--rule); --muted:var(--ink-faint);
  --neon-cyan:var(--accent); --neon-yellow:var(--ink); --neon-magenta:var(--caution);
  --et-bg:var(--paper); --et-glow:none; --et-title-case:none;
  --et-font-mono:ui-monospace,Consolas,'Courier New',monospace;
  --serif:Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua',serif;
  --sans:system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:ui-monospace,Consolas,'Courier New',monospace;

  /* ⚠️ THE READING SURFACE IS ITS OWN PAIR OF TOKENS, separate from the page
     chrome. --page/--page-ink are what a BOOK is printed on: the EPUB stage's
     background and the colours reader.js pushes into foliate through
     setStyles. In "match theme" they carry the SAME values as --card/--ink,
     which is what the reader has always done; the two modes below take them
     somewhere the chrome does not go (pure white, pure black). Keeping them
     separate is what lets the toolbar stay the shelf's warm cream while the
     page itself is plain white.
     ⚠️ LITERAL VALUES, not `var(--card)`. reader.js reads these back out with
     getComputedStyle to build foliate's stylesheet, and a custom property
     whose value is another var() reference is the one shape where "what does
     getComputedStyle return" stops being obvious. Repeating three hex codes
     costs nothing; a colour that resolves to the empty string in one browser
     and silently falls back to the hard-coded default in epubStyles() would
     cost an afternoon. It also keeps this file's own rule — no colour lives
     in only one scheme. */
  --page:#fdfaf2; --page-ink:#2c2418;
}
html[data-mode="dark"]{
  --paper:#201b13; --card:#2a241a; --ink:#eae1cf; --ink-faint:#a3957c;
  --rule:#453c2c; --accent:#d68f57; --accent-deep:#e5a878; --caution:#d07a6c;
  --stage:#171309;
  --page:#2a241a; --page-ink:#eae1cf;
}
@media (prefers-color-scheme: dark){
  html:not([data-mode="light"]){
    --paper:#201b13; --card:#2a241a; --ink:#eae1cf; --ink-faint:#a3957c;
    --rule:#453c2c; --accent:#d68f57; --accent-deep:#e5a878; --caution:#d07a6c;
    --stage:#171309;
    --page:#2a241a; --page-ink:#eae1cf;
  }
}

/* ═══════════════════ THE THREE READING MODES (2026-08-17) ═══════════════════
   Owner: "we need to be able to set the pages white and the font black or vice
   versa as well as make it match the theme." site/read-mode.js stamps the
   attribute BEFORE FIRST PAINT (it is a classic script in <head>, beside
   theme.js, for exactly that reason) and persists the choice per device.

     paper   white page, black text
     ink     black page, white text
     match   NO ATTRIBUTE AT ALL — the blocks above already answer it, in both
             directions, including for a scriptless load. A third block whose
             only job was to not exist would be worse than none.

   ⚠️ EACH MODE IS WRITTEN TWICE AND THE SECOND SELECTOR IS THE LOAD-BEARING
   ONE. `html[data-read-mode="ink"]` scores (0,1,1); the dark fallback above,
   `html:not([data-mode="light"])` inside a media query, scores (0,2,1) and
   BEATS it. Written the obvious single-selector way, "paper" silently does
   nothing for anybody whose OS is dark and who never opened the theme cog —
   a mode that appears to be selected and changes not one pixel. Adding
   `[data-mode]` (theme.js always stamps it) ties the score and wins on source
   order. Both selectors, always, or the mode is a lie in half the world.

   The mode carries the CHROME with it as well as the page: a black page in a
   cream toolbar reads as a broken render rather than a choice. */
html[data-read-mode="paper"],
html[data-read-mode="paper"][data-mode]{
  --paper:#f2f2f2; --card:#ffffff; --ink:#141414; --ink-faint:#5f5f5f;
  --rule:#d0d0d0; --accent:#8a3f16; --accent-deep:#6d3110; --caution:#8f2f2b;
  --stage:#dedede;
  --page:#ffffff; --page-ink:#000000;
}
html[data-read-mode="ink"],
html[data-read-mode="ink"][data-mode]{
  --paper:#0c0c0c; --card:#161616; --ink:#f0f0f0; --ink-faint:#9b9b9b;
  --rule:#343434; --accent:#e0a06a; --accent-deep:#f0b884; --caution:#e08878;
  --stage:#000000;
  --page:#000000; --page-ink:#ffffff;
}

*{box-sizing:border-box}
body{
  margin:0; padding:20px 16px; min-height:100vh;
  background:var(--paper); color:var(--ink);
  font-family:var(--serif); line-height:1.5;
}
#wrap{max-width:1100px;margin:0 auto}

.masthead{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;
  padding-bottom:12px;border-bottom:3px double var(--rule);margin-bottom:16px}
.masthead-id{flex:1;min-width:220px}
.eyebrow{font-family:var(--sans);font-size:.72em;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink-faint);text-decoration:none}
.eyebrow:hover{color:var(--accent)}
h1{margin:2px 0 0;font-family:var(--serif);font-weight:700;font-size:2.1em;
  letter-spacing:-.01em;line-height:1.1}
h1 .tail{color:var(--accent)}
#identity-bar{margin-left:auto;font-family:var(--sans)}
#identity-bar #account-btn{border-radius:8px}

/* The gate / every closed state. A designed state, not an error state: a
   signed-out visitor should meet a closed door that looks made. */
#rd-gate{max-width:520px;margin:48px auto;padding:28px 26px;background:var(--card);
  border:1px solid var(--rule);border-radius:14px;text-align:center;
  box-shadow:0 1px 0 var(--rule)}
#rd-gate h2{margin:0 0 10px;font-family:var(--serif);font-size:1.35rem;font-weight:600}
#rd-gate p{margin:0 0 18px;color:var(--ink-faint);line-height:1.55;font-size:.95rem}
.rd-act{display:inline-block;padding:10px 20px;border:0;border-radius:9px;
  background:var(--accent);color:var(--card);font:inherit;font-weight:600;
  cursor:pointer;text-decoration:none}
.rd-act:hover{background:var(--accent-deep)}
.rd-act.quiet{background:transparent;color:var(--accent);
  border:1px solid var(--rule);margin-left:8px}
.rd-act.quiet:hover{background:transparent;border-color:var(--accent)}
.rd-act[hidden]{display:none}

/* The reader shell */
#rd-shell[hidden]{display:none}
.rd-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  font-family:var(--sans);font-size:.9rem;margin-bottom:10px}
#rd-title{flex:1;min-width:180px;font-family:var(--serif);font-size:1.05rem;
  font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd-bar button{padding:6px 11px;border:1px solid var(--rule);border-radius:8px;
  background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.rd-bar button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.rd-bar button:disabled{opacity:.4;cursor:default}
.rd-pager{display:flex;gap:6px;align-items:center;color:var(--ink-faint)}
#rd-page-now{width:4.5em;padding:6px 8px;border:1px solid var(--rule);
  border-radius:8px;background:var(--card);color:var(--ink);
  font:inherit;font-family:var(--mono);text-align:right}
#rd-page-total{font-family:var(--mono);color:var(--ink-faint)}
.rd-back{font-family:var(--sans);font-size:.85rem;color:var(--accent);
  text-decoration:none;border-bottom:1px solid var(--rule)}
.rd-back:hover{border-bottom-color:var(--accent)}

/* ⚠️ `touch-action:pan-y` is what makes SWIPE-TO-TURN cooperate with reading.
   The browser keeps handling vertical scroll itself (so a long page still
   scrolls at 60fps while the gesture is undecided) and stops treating a
   horizontal drag as a scroll, which is what leaves it free to become a page
   turn. It does NOT disable pinch-zoom: site/swipe.js refuses a turn whenever
   a second finger appears or the visual viewport is magnified. */
#rd-stage{position:relative;background:var(--stage);border:1px solid var(--rule);
  border-radius:12px;padding:14px;min-height:60vh;display:flex;
  align-items:flex-start;justify-content:center;overflow:auto;touch-action:pan-y pinch-zoom}
/* ⚠️ `display:flex` beats the `hidden` attribute's UA `display:none`, so the
   PDF stage needs this or it stays on screen underneath an open EPUB. */
#rd-stage[hidden]{display:none}
/* ⚠️ The canvas is painted white by reader.js before every render. A PDF page
   is transparent where it has no content, and an unpainted canvas is BLACK in
   a dark-mode browser — which reads as "the book failed to load". */
#rd-canvas{max-width:100%;height:auto;box-shadow:0 2px 14px rgba(0,0,0,.28);
  background:#fff;border-radius:2px}
/* ⚠️ INK MODE ON A PDF IS AN INVERSION, and it is honest about it. pdf.js
   renders fixed pages onto a canvas — there is no text layer to recolour and no
   stylesheet to overrule, so the only lever is the whole rendered image.
   `invert(1) hue-rotate(180deg)` is the standard pair: invert flips light and
   dark AND rotates every hue to its opposite, and the hue-rotate puts the hues
   back, so a black-on-white page becomes white-on-black while a red diagram
   stays red instead of turning cyan.
   ⚠️ It inverts PHOTOGRAPHS AND ARTWORK too, and there is no way for it not to.
   reader.js says so on the page (#rd-mode-note) rather than leaving somebody to
   discover that a map has gone to negative. "paper" needs no rule: a PDF page
   is already printed on white. */
html[data-read-mode="ink"] #rd-canvas{filter:invert(1) hue-rotate(180deg)}
/* The EPUB stage. foliate-js paginates into a shadow DOM inside <foliate-view>,
   which needs a DEFINITE height to lay columns out against — a percentage of an
   auto-height parent collapses to nothing and the book renders blank.
   ⚠️ --page, not --card: this is the surface the book is printed on, and the
   two part company in paper/ink mode. It must agree with the colours reader.js
   pushes into foliate through setStyles, or a reflowable book sits as a white
   rectangle on a black stage with a visible seam at its margin. */
#rd-book{background:var(--page);border:1px solid var(--rule);border-radius:12px;
  height:min(78vh,940px);overflow:hidden}
#rd-book[hidden]{display:none}
#rd-book foliate-view{display:block;width:100%;height:100%}
#rd-loc{font-family:var(--sans);color:var(--ink-faint);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:26ch}
.rd-pager[hidden]{display:none}

/* The reading-mode control. Small, but a real 38px touch target: this bar is
   used one-handed on a phone, where the type-size buttons beside it are already
   the smallest thing anyone should have to hit. A native <select> on purpose —
   it gets the platform's own picker (a wheel on iOS, a sheet on Android),
   keyboard support and a screen-reader name for free, where three custom
   toggles would need all of it rebuilt. ⚠️ Its <option>s are BUILT by
   read-mode.js from that file's registry, never written here: a page carrying
   its own list is exactly how theme.js's theme list drifted across four sites. */
.rd-mode{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans)}
.rd-mode-label{color:var(--ink-faint);font-size:.82rem;letter-spacing:.04em;
  text-transform:uppercase}
#rd-mode{min-height:38px;padding:6px 9px;border:1px solid var(--rule);
  border-radius:8px;background:var(--card);color:var(--ink);font:inherit;
  font-family:var(--sans);font-size:.88rem;cursor:pointer}
#rd-mode:hover{border-color:var(--accent)}
#rd-mode:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* The honest line under the bar — an inversion that also inverts photographs,
   or a fixed-layout book whose pages cannot be recoloured at all. It exists so
   neither of those is something a reader has to discover. Filled and revealed
   by reader.js; ships hidden and empty. */
#rd-mode-note{width:100%;margin:-4px 0 6px;font-family:var(--sans);
  font-size:.8rem;line-height:1.45;color:var(--ink-faint)}
#rd-mode-note[hidden]{display:none}

/* The cross-device resume offer. A quiet strip above the book, not a modal:
   it must never cover the text it is offering to leave. `display:flex` beats
   the `hidden` attribute's UA `display:none`, so it needs the explicit rule
   the PDF stage needed for the same reason. */
#rd-resume{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  margin-bottom:10px;padding:9px 13px;border:1px solid var(--rule);
  border-left:3px solid var(--accent);border-radius:9px;background:var(--card);
  font-family:var(--sans);font-size:.88rem;color:var(--ink-faint)}
#rd-resume[hidden]{display:none}
#rd-resume-why{flex:1;min-width:180px;color:var(--ink)}
#rd-resume button{padding:5px 11px;border:1px solid var(--rule);border-radius:8px;
  background:transparent;color:var(--accent);font:inherit;cursor:pointer}
#rd-resume button:hover{border-color:var(--accent)}
#rd-resume-jump{background:var(--accent);color:var(--card);border-color:var(--accent)}
#rd-resume-jump:hover{background:var(--accent-deep)}

/* ⚠️ THE BUSY LAYER LIVES ON THE WRAPPER, NOT INSIDE THE PDF STAGE, and that
   moved on 2026-08-18. It used to be a child of #rd-stage — which openEpub()
   HIDES — so an EPUB that was still opening, or one that had hung, showed no
   spinner at all: an empty bordered box, identical to a failure. Half the
   iPhone P1's "no error shown anywhere" was this. #rd-view is the positioned
   wrapper both stages share, so one overlay serves both renderers. */
#rd-view{position:relative}
#rd-busy{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-family:var(--sans);font-size:.9rem;
  color:var(--ink-faint);background:color-mix(in srgb,var(--stage) 72%,transparent);
  border-radius:12px}
#rd-busy[hidden]{display:none}

/* ═════════════════ THE FAULT PANEL — 2026-08-18 ═════════════════
   ⚠️ THE READER MUST NEVER FAIL SILENTLY AGAIN. This panel is what a failure
   looks like when it happens INSIDE the book area — after the shell is already
   on screen, where closed()'s gate card cannot reach because the gate is a
   different part of the page.

   It exists because of the P1 that produced it: on every WebKit browser, the
   prod CSP's `frame-ancestors 'none'` was refusing foliate's own blob: iframe
   (see site/_headers), the throw happened inside an iframe `load` listener, and
   the promise reader.js was awaiting NEVER SETTLED. No rejection, no catch, no
   closed() — a bordered empty box and a person with nothing to tell us.

   So it takes three inputs, all of them worded (ROLES.md §1e):
     1. a heading naming what failed;
     2. a plain sentence saying what to do about it;
     3. ⚠️ THE TECHNICAL LINE, in a monospace block, deliberately SELECTABLE
        and deliberately visible. It is the error's own message plus its first
        stack frame, and its whole job is to be a sentence the owner can read
        aloud down a phone. A "something went wrong" with the detail hidden in
        a console nobody can open on iOS is the failure this replaces.
   `display:block` beats the hidden attribute's UA rule, the same trap
   #rd-stage and #rd-resume each needed. */
#rd-fault{padding:22px 20px;background:var(--card);border:1px solid var(--rule);
  border-left:3px solid var(--caution);border-radius:12px}
#rd-fault[hidden]{display:none}
#rd-fault h2{margin:0 0 8px;font-family:var(--serif);font-size:1.2rem;font-weight:600}
#rd-fault p{margin:0 0 14px;color:var(--ink-faint);line-height:1.55;font-size:.95rem;
  font-family:var(--sans)}
#rd-fault-detail{display:block;margin:0 0 16px;padding:10px 12px;background:var(--paper);
  border:1px solid var(--rule);border-radius:8px;font-family:var(--mono);
  font-size:.78rem;line-height:1.5;color:var(--ink);white-space:pre-wrap;
  word-break:break-word;-webkit-user-select:text;user-select:text}
#rd-fault-detail[hidden]{display:none}
#rd-fault-acts{display:flex;gap:8px;flex-wrap:wrap}

.rd-footer{margin-top:18px;padding-top:12px;border-top:3px double var(--rule);
  color:var(--ink-faint);font-size:.82em;line-height:1.55}
.rd-footer a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--rule)}

@media(max-width:600px){
  body{padding:14px 8px}
  h1{font-size:1.7em}
  #rd-stage{padding:8px;border-radius:9px}
}
</style>
</head>
<body>
<div id="wrap">
  <div class="masthead">
    <div class="masthead-id">
      <a class="eyebrow" href="https://heygabi.ai">heygabi.ai</a>
      <h1>Read<span class="tail">.</span></h1>
    </div>
    <div id="identity-bar"></div>
  </div>

  <!-- Ships VISIBLE with a neutral "checking" line, because Firebase reads its
       persisted session asynchronously: a page that renders "signed out"
       immediately shows a signed-in reader a flash of the sign-in button (the
       bug admin.js found live on 2026-08-14). Nothing decisive renders until
       the auth state resolves, or the 8s backstop fires for a blocked
       gstatic. -->
  <div id="rd-gate">
    <h2 id="rd-gate-title">Opening the book</h2>
    <p id="rd-gate-why">Checking your sign-in…</p>
    <button type="button" class="rd-act" id="rd-gate-signin" hidden>Sign in with Google</button>
    <a class="rd-act quiet" id="rd-gate-back" href="ebooks" hidden>Back to the shelf</a>
    <!-- THE DEV-LANE CURTAIN's way out, and the ONE control on this page that
         is deliberately absolute rather than relative. Every other link here is
         relative so the dev lane loads dev copies (see the header) — but this
         one exists precisely to leave the dev lane, so `ebooks` would send a
         curtained reader straight back to the page that just curtained them.
         Ships hidden; site/dev-lane.js's verdict is what reveals it, and it is
         never shown on a promoted page. -->
    <a class="rd-act quiet" id="rd-gate-prod" href="https://ebooks.heygabi.ai" hidden>Go to the regular shelf</a>
  </div>

  <div id="rd-shell" hidden>
    <div class="rd-bar">
      <a class="rd-back" href="ebooks">&#x2190; Shelf</a>
      <span id="rd-title"></span>
      <!-- Shared by both renderers, and re-labelled by reader.js: on a PDF
           these zoom the page, on an EPUB they size the type. -->
      <button type="button" id="rd-zoom-out" aria-label="Zoom out">&#x2212;</button>
      <button type="button" id="rd-zoom-in" aria-label="Zoom in">+</button>
      <!-- READING MODES (owner, 2026-08-17). ⚠️ The <option>s are BUILT by
           read-mode.js from its own registry and anything written here is
           replaced — the page owns the control's PLACE, that file owns its
           contents. This is theme.js's rule, applied for the same reason: a
           fourth mode must be one edit, not a hunt through markup. The empty
           element is deliberate, not an oversight. -->
      <label class="rd-mode" for="rd-mode">
        <span class="rd-mode-label">Page</span>
        <select id="rd-mode" aria-label="Page colours"></select>
      </label>
      <div class="rd-pager" id="rd-pager">
        <button type="button" id="rd-prev" aria-label="Previous page">&#x2190;</button>
        <!-- ⚠️ PDF ONLY. A reflowable EPUB has no stable page number to type
             into, so this is hidden rather than shown-and-lying. -->
        <span class="rd-pager" id="rd-pager-pdf">
          <input id="rd-page-now" type="number" min="1" step="1" value="1" aria-label="Page number" />
          <span>/ <span id="rd-page-total">?</span></span>
        </span>
        <span class="rd-pager" id="rd-pager-epub" hidden><span id="rd-loc"></span></span>
        <button type="button" id="rd-next" aria-label="Next page">&#x2192;</button>
      </div>
      <!-- The one thing a display mode cannot do quietly. See #rd-mode-note's
           CSS: an inverted PDF inverts its photographs, and a fixed-layout
           EPUB's pages are images with the type baked in and cannot be
           recoloured at all. Both get a sentence rather than a surprise. -->
      <p id="rd-mode-note" hidden></p>
    </div>

    <!-- SAVE YOUR SPOT — the cross-device offer, and it is an OFFER.
         ⚠️ It appears only when the stored position from ANOTHER device is
         newer than this one's AND points somewhere else. It never moves the
         page by itself: a reader relocated mid-sentence without being asked is
         the single most common complaint about every syncing reader ever
         shipped. Ships hidden; reader.js fills and reveals it. -->
    <div id="rd-resume" hidden>
      <span id="rd-resume-why"></span>
      <button type="button" id="rd-resume-jump">Jump there</button>
      <button type="button" id="rd-resume-stay">Stay here</button>
    </div>

    <!-- ⚠️ THE WRAPPER IS LOAD-BEARING, added 2026-08-18. #rd-busy is
         `position:absolute; inset:0` and used to sit INSIDE #rd-stage — which
         openEpub() hides. So the whole EPUB open ran with no spinner: an empty
         bordered box that looked exactly like the failure it was sometimes
         hiding. One positioned wrapper, one overlay, both renderers. -->
    <div id="rd-view">
      <div id="rd-stage">
        <canvas id="rd-canvas" width="1" height="1"></canvas>
      </div>

      <!-- The EPUB stage. Empty until reader.js mounts <foliate-view> into it,
           so a PDF reader never pays for the EPUB stack. -->
      <div id="rd-book" hidden></div>

      <!-- ⚠️ THE FAULT PANEL. Ships hidden; reader.js fills and reveals it from
           window.onerror, from unhandledrejection, from every catch around
           opening or rendering a book, AND from the watchdog that fires when a
           book neither opens nor fails. #rd-fault-detail carries the error's
           own words so the owner has a SENTENCE to read down a phone instead
           of an empty box to describe. See the CSS block above for the P1 that
           made this non-negotiable. -->
      <div id="rd-fault" hidden>
        <h2 id="rd-fault-title"></h2>
        <p id="rd-fault-why"></p>
        <code id="rd-fault-detail" hidden></code>
        <div id="rd-fault-acts">
          <button type="button" class="rd-act" id="rd-fault-retry">Try again</button>
          <a class="rd-act quiet" id="rd-fault-back" href="ebooks">Back to the shelf</a>
        </div>
      </div>

      <div id="rd-busy" hidden>Fetching the page…</div>
    </div>
  </div>

  <!-- ⚠️ THE AUDIOBOOK LINK IS GONE, on the owner's word (2026-08-17): "ebooks
       has a link to audiobooks on the reader page. remove that we dont need to
       go back to audiobnook page". The two are deliberately different sites —
       the same decision that removed the 📖 Ebooks button from the audiobook
       homepage. The way out of the reader is the SHELF, and nothing else. Do
       not add it back "for convenience"; tests/test_site_pages.py fails on it. -->
  <div class="rd-footer">
    <div>
      One book at a time, streamed straight from the household library — nothing
      is downloaded to this device. Back to the <a href="ebooks">shelf</a>.
    </div>
  </div>
</div>

<script type="module" src="reader.js"></script>
</body>
</html>
