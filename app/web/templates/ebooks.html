<!--
  THIS PAGE IS ITS OWN THING (owner, 2026-08-17: "make it seem like it's own
  custom page. Also let it have its own theme"). It is the household's shared
  ebook shelf, served at ebooks.heygabi.ai through the estate door; its parent
  is the estate front door (heygabi.ai), NOT the audiobook catalog. It does
  not sit in the audiobook nav family and it does not import the audiobook
  site's estate-theme.css / ab-bridge.css - the whole look lives in the
  <style> block below: paper-and-ink, one sienna accent, light + dark.

  BOOKSHELF, NOT A LIST (owner, 2026-08-17: "it can't be a raw list"). The
  page is a cover-first grid: real cover art where the manifest resolved one
  (cover_url - sibling audiobook cover or the epub's own embedded image, both
  served from R2), and a typographic paper-spine placeholder for the rest.
  The placeholder is the NORM-QUALITY path, not an error state: with zero
  covers resolved the shelf must still look designed. Tapping a book opens
  its reading card (a dialog in the page's own idiom).

  theme.js is deliberately KEPT (and only theme.js): the shared account modal
  (account-modal.js, an auth widget this page must not fork) exposes an
  Appearance section that drives window.estateTheme, and without the script
  those controls would be silently dead. This page ignores data-theme
  entirely - it has exactly one theme, its own - but honours the resolved
  data-mode stamp for light/dark, with a prefers-color-scheme fallback so the
  palette is right even if scripts never run.
-->
<script src="static/js/theme.js"></script>
<title>Ebooks — The Household Shelf</title>

<!--
  ⚠️ PERMISSION-GATED SINCE 2026-08-17 (owner directive: "ebooks should be
  like the other site where we grant permission to view it. I don't want
  people scraping my books"). This file is now a SHIM: the markup, the theme
  and every line of the bookshelf below are unchanged, but the data no longer
  comes from a public file. site/ebooks.json left the deployment AND left git
  (the repo is public, so shipping it there would have moved a door in front
  of an open window); the manifest lives in a private R2 bucket and is served
  by GET https://audiobook-api.heygabi.ai/api/ebooks/manifest, which verifies
  a Firebase ID token and requires the estate's `ebooks` visibility grant.

  So the page has three states and each says which one it is, in words
  (ROLES.md §1e): signed out / signed in but not approved / approved but
  without the ebook grant. None of them renders a single book.

  NO DOWNLOADS FROM HERE, still — and since 2026-08-17 there IS a Read button
  on every card, which is not the same thing. It is a LINK to /read, a separate
  page that does its own sign-in and its own gated range requests; no file is
  reachable from this page. `can_download` rides the gated answer (the LADDER's
  `download`, admin+) for a future download affordance and is deliberately NOT
  consulted by the Read button: reading is the estate's `vis_ebooks` grant that
  opened this shelf, and gating Read on `download` would show every member a
  shelf none of them could read.

  BOTH FORMATS carry the button since viewer phase 2 (2026-08-17). EPUB cards
  previously carried a NOTE instead, because the reader answered an honest "not
  yet" for that format and a button onto a refusal is a dead affordance. The
  reader opens both now, so the note is gone. ⚠️ And there is deliberately no
  size gate on the three oversized EPUBs: they are read over HTTP byte ranges
  like every other book (the 393 MiB omnibus opens in 18 requests totalling
  664 KB), so a refusal card for them would refuse books that work.

  PDFs ARE HIDDEN BY DEFAULT (owner, 2026-08-17). They are game handbooks and
  household documents rather than books, and they are the one format with
  nothing to extract a cover from - so instead of hunting covers for them, the
  control row carries a "Show PDFs" checkbox, unticked. Hidden means hidden
  EVERYWHERE: out of the grid, out of this page's search, and out of the format
  chips. The preference persists in localStorage (key `eb:showPdfs`).

  EVERY BOOK HAS AN ANCHOR (same day). Each tile's element id is the manifest's
  own `anchor` field, which app/index_push.py also builds the estate-search
  `detail_url` from (https://ebooks.heygabi.ai/#<anchor>), so a search result
  lands on the book rather than the top of a 168-tile shelf. ⚠️ ONE
  implementation of that id, in scripts/build_ebook_manifest.ebook_anchor();
  this page READS it and must never recompute it - a drifted copy would break
  every deep link silently, with the page simply failing to scroll. A deep link
  to a PDF turns the checkbox on rather than being a dead link.

  CONTENT NOTES, 2026-08-17 (the ebooks half of the owner's "port content
  warning feature over to all physical book and the ebook site"). Each reading
  card carries a compact notes block: published pipeline warnings plus readers'
  own, from the estate-wide `user_content_warnings` store the book modal on
  audiobooks.heygabi.ai and library.heygabi.ai already share. ⚠️ Drawn by
  site/ebook-notes.js, which CALLS site/user-warnings.js — no second copy of
  the store, the doc id, the 80-char bound or the delete rules exists. ⚠️ And
  the notes are keyed by `audiobook_title` (the manifest's record of what the
  AUDIOBOOK catalog calls this book), NOT by the epub's own title: see that
  module's header for why keying on the ebook's own spelling fails silently in
  both directions.

  THE DEV-LANE CURTAIN, 2026-08-17 (owner: "i need a way in the estate to
  manage dev access for ebook ... make devops always able to see dev envs").
  When this page is served under /dev/, a signed-in visitor without effective
  dev access is shown a worded curtain instead of the shelf. ⚠️ A CURTAIN, NOT
  A LOCK: it guards no bytes and is not meant to. The real lock is the estate's
  `vis_ebooks` grant, enforced server-side on the manifest and on every range,
  identically on both lanes and untouched by any of this. site/dev-lane.js owns
  every decision — including why "we could not tell" opens the shelf rather
  than closing it. ⚠️ Lane-aware, never host-aware: a promoted page makes no
  extra call at all.

  The manifest is fetched client-side WITH A BEARER, so a pipeline refresh
  updates this page with no HTML rebuild. ⚠️ Bearer-per-request, never a
  signed URL: a copied URL must be a 401, and a signed URL cannot be revoked
  mid-session. This file is a TEMPLATE:
  it lives in app/web/templates/ and is copied verbatim to site/ebooks.html by
  app/writers.py (same convention as guess-game.html). Edit it HERE - edits to
  site/ebooks.html are wiped by the next build.
-->
<style>
/* ============================ THE SHELF THEME ============================
   Paper-and-ink with one confident accent (burnt sienna). Both palettes are
   complete: light is the paper default on :root; dark is applied twice with
   identical values - once for theme.js's resolved data-mode stamp, once as a
   prefers-color-scheme fallback for a scriptless load. No colour may live in
   only one scheme.

   The --bg / --bg-2 / --text / --border / --muted / --neon-* names are NOT
   the audiobook palette leaking back in: they are ALIASES the shared
   account-modal.js (auth widget) reads, pointed at this page's own inks so
   the sign-in chip and modal wear the shelf's colours. */
:root{
  --paper:#f6f1e6;        /* page ground: warm paper */
  --card:#fdfaf2;         /* card / control surface: cream */
  --ink:#2c2418;          /* body ink */
  --ink-faint:#8a7d66;    /* secondary ink */
  --rule:#ddd2ba;         /* hairlines and borders */
  --accent:#9d4a1c;       /* the one accent: burnt sienna */
  --accent-deep:#7d3a14;  /* accent, pressed/hover */
  --caution:#8f2f2b;      /* oxblood: provisional metadata, errors */

  /* book-cloth tones for the typographic spine placeholders - four muted
     binding colours in the paper family, so a coverless shelf still reads
     as a deliberate bookcase rather than a wall of missing images */
  --cloth-1:#8a5a33;      /* tan leather */
  --cloth-2:#5f6650;      /* moss cloth */
  --cloth-3:#575d72;      /* slate ink */
  --cloth-4:#7c3b30;      /* oxblood buckram */
  --cloth-ink:#f6f1e6;    /* paper-coloured lettering on the cloth */
  --cloth-rule:rgba(246,241,230,.55);

  --fmtchip-bg:rgba(246,241,230,.92);
  --fmtchip-ink:#5a4a33;
  --fmtchip-line:rgba(44,36,24,.18);
  --overlay:rgba(30,24,14,.55);
  --tile-shadow:0 1px 3px rgba(0,0,0,.16);
  --tile-shadow-hover:0 4px 12px rgba(0,0,0,.2);

  /* aliases for the shared auth widget (account-modal.js) */
  --bg:var(--paper); --bg-2:var(--card); --text:var(--ink);
  --border:var(--rule); --muted:var(--ink-faint);
  --neon-cyan:var(--accent); --neon-yellow:var(--ink);
  --neon-magenta:var(--caution);
  --et-bg:var(--paper);   /* theme.js syncs <meta theme-color> from this */
  --et-glow:none; --et-title-case:none;
  --et-font-mono:ui-monospace,Consolas,'Courier New',monospace;

  --serif:Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua',serif;
  --sans:system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:ui-monospace,Consolas,'Courier New',monospace;
}
/* dark: lamplit ink-and-paper - via the estate mode stamp… */
html[data-mode="dark"]{
  --paper:#201b13; --card:#2a241a; --ink:#eae1cf; --ink-faint:#a3957c;
  --rule:#453c2c; --accent:#d68f57; --accent-deep:#e5a878; --caution:#d07a6c;
  --cloth-1:#6b4526; --cloth-2:#49503c; --cloth-3:#424859; --cloth-4:#5f2c23;
  --cloth-ink:#eae1cf; --cloth-rule:rgba(234,225,207,.4);
  --fmtchip-bg:rgba(32,27,19,.88); --fmtchip-ink:#d9cdb4;
  --fmtchip-line:rgba(234,225,207,.2);
  --overlay:rgba(10,8,4,.66);
  --tile-shadow:0 1px 3px rgba(0,0,0,.5);
  --tile-shadow-hover:0 4px 14px rgba(0,0,0,.55);
}
/* …and via the OS preference when no explicit light choice is stamped */
@media (prefers-color-scheme: dark){
  html:not([data-mode="light"]){
    --paper:#201b13; --card:#2a241a; --ink:#eae1cf; --ink-faint:#a3957c;
    --rule:#453c2c; --accent:#d68f57; --accent-deep:#e5a878; --caution:#d07a6c;
    --cloth-1:#6b4526; --cloth-2:#49503c; --cloth-3:#424859; --cloth-4:#5f2c23;
    --cloth-ink:#eae1cf; --cloth-rule:rgba(234,225,207,.4);
    --fmtchip-bg:rgba(32,27,19,.88); --fmtchip-ink:#d9cdb4;
    --fmtchip-line:rgba(234,225,207,.2);
    --overlay:rgba(10,8,4,.66);
    --tile-shadow:0 1px 3px rgba(0,0,0,.5);
    --tile-shadow-hover:0 4px 14px rgba(0,0,0,.55);
  }
}

*{box-sizing:border-box}
body{
  margin:0; padding:28px 20px;
  min-height:100vh;
  background:var(--paper); color:var(--ink);
  font-family:var(--serif);
  line-height:1.5;
}
#wrap{max-width:1060px;margin:0 auto}

/* Masthead: eyebrow to the estate front door, serif wordmark, double rule */
.masthead{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;
  padding-bottom:14px;border-bottom:3px double var(--rule);margin-bottom:18px}
.masthead-id{flex:1;min-width:220px}
.eyebrow{
  font-family:var(--sans);font-size:.72em;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink-faint);text-decoration:none;
}
.eyebrow:hover{color:var(--accent)}
h1{
  margin:2px 0 0;font-family:var(--serif);font-weight:700;
  font-size:2.6em;letter-spacing:-.01em;color:var(--ink);line-height:1.1;
}
h1 .tail{color:var(--accent)}
.tagline{margin-top:2px;color:var(--ink-faint);font-style:italic;font-size:.95em}

/* Controls */
.controls-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;
  font-family:var(--sans)}
#eb-search{
  flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--rule);
  border-radius:8px;background:var(--card);color:var(--ink);font-size:.92em;
  font-family:var(--sans);
}
#eb-search::placeholder{color:var(--ink-faint)}
#eb-search:focus{outline:none;border-color:var(--accent)}
#eb-sort{
  padding:9px 10px;border:1px solid var(--rule);border-radius:8px;
  background:var(--card);color:var(--ink);font-size:.9em;font-family:var(--sans);
}
.format-chip{
  padding:6px 13px;border:1px solid var(--rule);border-radius:999px;
  background:var(--card);color:var(--ink-faint);font-weight:600;font-size:.78em;
  cursor:pointer;letter-spacing:.06em;text-transform:uppercase;
  font-family:var(--sans);transition:all .15s;
}
.format-chip:hover{border-color:var(--accent);color:var(--accent)}
.format-chip.on{border-color:var(--accent);background:var(--accent);color:var(--paper)}
#eb-count{color:var(--ink-faint);font-size:.85em;font-family:var(--sans)}

/* "Show PDFs" — same pill silhouette as the format chips, so the control row
   still reads as one family, but a checkbox because it is a preference (it
   persists) rather than a transient filter. */
.eb-toggle{
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  padding:6px 13px;border:1px solid var(--rule);border-radius:999px;
  background:var(--card);color:var(--ink-faint);font-weight:600;font-size:.78em;
  letter-spacing:.06em;text-transform:uppercase;font-family:var(--sans);
  transition:border-color .15s,color .15s;user-select:none;
}
/* display:inline-flex above would otherwise beat the [hidden] attribute the
   script sets when the library has no PDFs at all. */
.eb-toggle[hidden]{display:none}
.eb-toggle:hover{border-color:var(--accent);color:var(--accent)}
.eb-toggle input{accent-color:var(--accent);margin:0;cursor:pointer}
.eb-toggle:has(input:checked){border-color:var(--accent);color:var(--accent)}
.eb-toggle:focus-within{outline:2px solid var(--accent);outline-offset:2px}

/* A book arrived at by its #anchor: a brief accent frame, so a deep link from
   estate search lands on something visibly pointed-at rather than dumping the
   reader mid-grid with no idea which tile was meant. */
@keyframes eb-anchor-glow{
  from{box-shadow:0 0 0 3px var(--accent)}
  to{box-shadow:0 0 0 3px transparent}
}
.eb-tile.eb-anchored .eb-cover{animation:eb-anchor-glow 2.4s ease-out 1}

/* ============================ THE BOOKSHELF ============================ */
.eb-shelf{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));
  gap:24px 16px;margin-top:16px;
}
.eb-tile{
  display:flex;flex-direction:column;gap:8px;padding:0;border:0;margin:0;
  background:none;cursor:pointer;text-align:left;font:inherit;color:inherit;
  border-radius:8px;
}
.eb-tile:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.eb-tile:hover .eb-cover{box-shadow:var(--tile-shadow-hover);transform:translateY(-2px)}

/* The cover face: real art when the manifest resolved a cover_url; the
   typographic spine underneath is ALWAYS rendered and simply covered by the
   image, so a failed image load falls back to a designed spine, never to a
   broken-image glyph. */
.eb-cover{
  position:relative;aspect-ratio:2/3;border-radius:6px;overflow:hidden;
  background:var(--card);box-shadow:var(--tile-shadow);
  transition:box-shadow .15s,transform .15s;
}
.eb-cover img{
  display:none;width:100%;height:100%;object-fit:cover;
}
.eb-cover.has-img img{display:block}
.eb-cover.has-img .eb-spine{display:none}

/* Typographic spine placeholder: paper lettering on book cloth, with the
   page's double-rule signature top and bottom. Deliberate, never broken. */
.eb-spine{
  position:absolute;inset:0;display:flex;flex-direction:column;
  justify-content:center;align-items:center;gap:9px;padding:26px 12px;
  text-align:center;background:var(--cloth-1);color:var(--cloth-ink);
}
.eb-cover.cloth-2 .eb-spine{background:var(--cloth-2)}
.eb-cover.cloth-3 .eb-spine{background:var(--cloth-3)}
.eb-cover.cloth-4 .eb-spine{background:var(--cloth-4)}
.eb-spine::before,.eb-spine::after{
  content:"";position:absolute;left:9px;right:9px;height:0;
  border-top:3px double var(--cloth-rule);
}
.eb-spine::before{top:10px}
.eb-spine::after{bottom:10px}
.eb-spine-title{
  font-family:var(--serif);font-weight:700;font-size:.95em;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;
}
.eb-spine-author{
  font-family:var(--sans);font-size:.64em;letter-spacing:.14em;
  text-transform:uppercase;opacity:.85;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

/* Format badge, corner chip on the cover */
.eb-fmt{
  position:absolute;top:7px;right:7px;padding:2px 8px;border-radius:999px;
  font-family:var(--sans);font-size:.62em;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;background:var(--fmtchip-bg);color:var(--fmtchip-ink);
  border:1px solid var(--fmtchip-line);
}

/* Caption under the cover */
.eb-cap{display:block;min-width:0}
.eb-cap-title{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-weight:700;font-size:.88em;line-height:1.3;
}
.eb-cap-author{
  display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--ink-faint);font-size:.78em;font-style:italic;margin-top:1px;
}

/* ============================ THE READING CARD ============================
   Tap a book, get its card: a dialog in the page's own idiom. */
#eb-card-overlay{
  position:fixed;inset:0;background:var(--overlay);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:18px;
}
#eb-card-overlay[hidden]{display:none}
.eb-card{
  position:relative;background:var(--card);color:var(--ink);
  border:1px solid var(--rule);border-radius:14px;padding:24px;
  max-width:600px;width:100%;max-height:min(88vh,660px);overflow:auto;
  box-shadow:0 14px 44px rgba(0,0,0,.35);
}
.eb-card-close{
  position:absolute;top:10px;right:10px;width:32px;height:32px;
  border:1px solid var(--rule);border-radius:999px;background:var(--paper);
  color:var(--ink-faint);font-family:var(--sans);font-size:1.05em;line-height:1;
  cursor:pointer;
}
.eb-card-close:hover{border-color:var(--accent);color:var(--accent)}
.eb-card-body{display:flex;gap:22px;align-items:flex-start}
.eb-card-media{flex:0 0 158px;width:158px}
.eb-card-media .eb-cover{box-shadow:var(--tile-shadow)}
.eb-card-info{flex:1;min-width:0}
.eb-card-info h2{
  margin:0;font-family:var(--serif);font-weight:700;font-size:1.35em;
  line-height:1.25;letter-spacing:-.01em;
}
.eb-card-author{color:var(--accent);font-style:italic;margin-top:3px}
.eb-meta{
  margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);
  display:grid;grid-template-columns:auto 1fr;gap:5px 16px;
  font-family:var(--sans);font-size:.85em;
}
.eb-meta .k{color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;font-size:.82em;padding-top:2px}
.eb-meta .v{color:var(--ink)}
.eb-meta .v.mono{font-family:var(--mono);font-size:.92em}
.eb-provisional{
  display:inline-block;margin-top:12px;padding:3px 10px;
  border:1px dashed var(--caution);border-radius:999px;
  color:var(--caution);font-size:.72em;letter-spacing:.04em;font-style:italic;
  font-family:var(--sans);cursor:help;
}
.eb-folder{color:var(--ink-faint);font-size:.78em;font-family:var(--mono)}
.eb-audio-link{
  display:inline-block;margin-top:14px;font-family:var(--sans);font-size:.9em;
  color:var(--accent);text-decoration:none;border-bottom:1px solid var(--rule);
  /* Breathing room before the Read link that follows it on the card (owner,
     2026-08-17: "the also on audio -> is super close to the Read -> lets give
     them a bit of space to breathe").
     ⚠️ SECOND PASS 2026-08-18, same ask repeated: 22px still read as crowded.
     `.eb-read` is a FILLED pill (9px 18px of padding), and a filled shape
     optically begins at its background edge, so the gap beside it needs to be
     wider than it would be beside another plain link. The margin lives on the
     LINK, never on the button: cards with no audiobook twin draw `.eb-read`
     alone, where a left margin would shove it off the card's left edge. */
  margin-right:34px;
}
.eb-audio-link:hover{color:var(--accent-deep);border-bottom-color:var(--accent)}

/* ======================= CONTENT NOTES (2026-08-17) =======================
   The ebooks half of "port content warning feature over to all physical book
   and the ebook site". Published pipeline notes + readers' own, drawn by
   site/ebook-notes.js into a slot the reading card provides. Compact on
   purpose: it sits UNDER the metadata in a dialog that is already full, so it
   reads as a footnote to the book rather than a second panel competing with
   it. Sans for the apparatus, serif inherited for the note text itself. */
.eb-notes{
  margin-top:16px;padding-top:12px;border-top:1px solid var(--rule);
  font-family:var(--sans);font-size:.85em;
}
.eb-notes-h{
  margin:0 0 6px;font-family:var(--sans);font-size:.78em;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);
}
.eb-notes-status{color:var(--ink-faint);margin:6px 0 2px;font-style:italic}
/* Provenance: WHICH title these notes were looked up under. Never decoration —
   a subtitle-extension join can pull a sibling volume's notes, and saying so
   costs one line (the same rule the library's panel follows). */
.eb-notes-prov{
  color:var(--ink-faint);font-size:.92em;margin:2px 0 6px;
  border-left:2px solid var(--rule);padding-left:8px;
}
.eb-notes-prov em{color:var(--ink);font-style:italic}
.eb-notes-list{margin:4px 0 6px;padding-left:18px;color:var(--ink)}
.eb-notes-list li{margin:2px 0;font-family:var(--serif);font-size:1.02em}
.eb-notes-by{color:var(--ink-faint);font-size:.82em;font-family:var(--sans)}
.eb-notes-src{color:var(--accent);font-size:.8em;font-family:var(--sans)}
.eb-notes-x{
  background:none;border:0;color:var(--caution);cursor:pointer;padding:0 4px;
  font-family:var(--sans);font-size:.9em;line-height:1;
}
.eb-notes-x:hover{color:var(--accent-deep)}
.eb-notes-x:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.eb-notes-add{
  margin-top:6px;padding:4px 11px;border:1px solid var(--rule);border-radius:999px;
  background:none;color:var(--ink-faint);font-family:var(--sans);font-size:.92em;
  cursor:pointer;transition:border-color .15s,color .15s;
}
.eb-notes-add:hover{border-color:var(--accent);color:var(--accent)}
.eb-notes-empty{color:var(--ink-faint);font-style:italic}

@media(max-width:540px){
  .eb-card{padding:18px}
  .eb-card-body{flex-direction:column;align-items:center}
  .eb-card-media{flex:0 0 auto;width:150px}
  .eb-card-info{width:100%}
}

/* The READ action on a reading card (viewer phase 1b, 2026-08-17; both formats
   since phase 2). ⚠️ `.eb-read-note` below is the EPUB "not yet" line phase 2
   removed — kept because the same shape is the right one for any future
   card-level explanation, and deleting a two-line rule to re-add it is churn. */
.eb-read{display:inline-block;margin-top:14px;padding:9px 18px;border-radius:9px;
  background:var(--accent);color:var(--card);font-family:var(--sans);
  font-weight:600;font-size:.9em;text-decoration:none}
.eb-read:hover{background:var(--accent-deep);color:var(--card)}
.eb-read-note{display:block;margin-top:8px;font-family:var(--sans);
  font-size:.78em;color:var(--ink-faint);line-height:1.5}
.loading{text-align:center;padding:40px;color:var(--ink-faint);font-style:italic}
/* The permission gate (2026-08-17). It is a designed state, not an error
   state: a signed-out visitor should meet a closed shelf that looks made,
   not a broken page. Same paper-and-ink idiom as the reading card. */
#eb-gate{max-width:520px;margin:48px auto;padding:28px 26px;background:var(--card);
  border:1px solid var(--rule);border-radius:14px;text-align:center;
  box-shadow:0 1px 0 var(--rule)}
#eb-gate h2{margin:0 0 10px;font-family:var(--serif);font-size:1.35rem;color:var(--ink);font-weight:600}
#eb-gate p{margin:0 0 18px;color:var(--ink-faint);line-height:1.55;font-size:.95rem}
/* `text-decoration:none` because this class dresses a <button> AND (since the
   dev-lane curtain, 2026-08-17) an <a>, and an underlined pill looks broken. */
#eb-gate .eb-gate-act{display:inline-block;padding:10px 20px;border:0;border-radius:9px;
  background:var(--accent);color:var(--card);font:inherit;font-weight:600;cursor:pointer;
  text-decoration:none}
#eb-gate .eb-gate-act:hover{background:var(--accent-deep)}
#eb-gate .eb-gate-act[hidden]{display:none}
.empty{text-align:center;padding:30px;color:var(--ink-faint);font-style:italic;grid-column:1/-1}
.load-error{
  margin-top:16px;padding:16px;border:1px solid var(--caution);border-radius:10px;
  background:var(--card);color:var(--ink);grid-column:1/-1;
}
.eb-footer{
  margin-top:30px;padding-top:14px;border-top:3px double var(--rule);
  color:var(--ink-faint);font-size:.85em;line-height:1.55;
}
.eb-footer a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--rule)}
.eb-footer a:hover{color:var(--accent-deep);border-bottom-color:var(--accent)}
#eb-generated{font-family:var(--mono)}
@media(max-width:600px){
  body{padding:16px 10px}
  h1{font-size:2.1em}
  .masthead{gap:10px}
  #eb-search{width:100%}
  .eb-shelf{grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:18px 10px}
  .eb-spine{padding:20px 8px;gap:6px}
  .eb-spine-title{font-size:.82em}
}

/* Sign-in / user chip: the shared widget's mount, dressed in shelf colours */
#identity-bar{margin-left:auto;font-family:var(--sans)}
#identity-bar #account-btn{border-radius:8px}

/* -- Multi-select mode -- */
.eb-tile.eb-selected .eb-cover{
  outline:3px solid var(--accent);outline-offset:-3px;
}
.eb-tile.eb-selected{opacity:.85}
.eb-tile .eb-sel-check{
  position:absolute;top:7px;left:7px;width:20px;height:20px;
  accent-color:var(--accent);z-index:5;pointer-events:none;
}
#eb-bulk-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  padding:12px 20px;background:var(--card);border-top:1px solid var(--rule);
  box-shadow:0 -2px 12px rgba(0,0,0,.2);display:none;align-items:center;gap:12px;
  font-family:var(--sans);animation:eb-bulk-slide .2s ease-out;
}
#eb-bulk-bar[hidden]{display:none}
@keyframes eb-bulk-slide{from{transform:translateY(100%)}to{transform:translateY(0)}}
.eb-bulk-count{font-weight:600;font-size:.9em;white-space:nowrap}
.eb-bulk-act{
  padding:8px 16px;border:0;border-radius:8px;
  background:var(--accent);color:var(--card);font-weight:600;cursor:pointer;
  font-family:var(--sans);font-size:.88em;
}
.eb-bulk-act:hover{background:var(--accent-deep)}
.eb-bulk-act:disabled{opacity:.5;cursor:default}
.eb-bulk-cancel{
  margin-left:auto;padding:8px 14px;border:1px solid var(--rule);border-radius:8px;
  background:var(--card);color:var(--ink);cursor:pointer;font-family:var(--sans);font-size:.88em;
}
.eb-bulk-cancel:hover{border-color:var(--accent);color:var(--accent)}
.eb-bulk-progress{font-size:.85em;color:var(--ink-faint)}
</style>
</head>
<body>
<div id="wrap">
  <div class="masthead">
    <div class="masthead-id">
      <a class="eyebrow" href="https://heygabi.ai">heygabi.ai</a>
      <h1>Ebooks<span class="tail">.</span></h1>
      <div class="tagline">The household&#x27;s shared shelf</div>
    </div>
    <div id="identity-bar"></div>
  </div>

  <!-- The gate. Ships VISIBLE with a neutral "checking" line, because
       Firebase reads its persisted session asynchronously: a page that
       renders "signed out" immediately shows a signed-in reader a flash of
       the sign-in button (the bug admin.js found live on 2026-08-14). The
       button itself ships hidden and nothing decisive renders until the auth
       state resolves — or the 8s backstop fires for a blocked gstatic. -->
  <div id="eb-gate">
    <h2 id="eb-gate-title">The shelf is closed</h2>
    <p id="eb-gate-why">Checking your sign-in…</p>
    <button type="button" class="eb-gate-act" id="eb-gate-signin" hidden>Sign in with Google</button>
    <!-- THE DEV-LANE CURTAIN's way out, and the ONE absolute link on this page.
         Everything else here is relative so the /dev/ lane loads dev copies —
         but this exists precisely to LEAVE the dev lane, and a relative
         `ebooks` would send a curtained reader straight back to the page that
         just curtained them. Ships hidden; only site/dev-lane.js's verdict
         reveals it, and never on a promoted page. -->
    <a class="eb-gate-act" id="eb-gate-prod" href="https://ebooks.heygabi.ai" hidden>Go to the regular shelf</a>
  </div>

  <div class="controls-row" id="eb-controls" hidden>
    <input id="eb-search" type="search" placeholder="Search title, author, filename..." aria-label="Search ebooks" />
    <select id="eb-sort" aria-label="Sort ebooks">
      <option value="title">Sort by Title</option>
      <option value="author">Sort by Author</option>
      <option value="modified">Sort by Newest</option>
      <option value="size">Sort by Size</option>
    </select>
    <span id="eb-format-chips"></span>
    <!-- Owner, 2026-08-17: PDFs get no cover hunt; they get a checkbox, off by
         default. Hidden means hidden - out of the grid, out of the search, and
         out of the format chips - until this is ticked. The preference sticks
         (localStorage), because someone who wants the PDFs wants them every
         visit, not once. -->
    <label class="eb-toggle" for="eb-show-pdfs" title="PDFs are household documents and game handbooks rather than books; hidden by default.">
      <input type="checkbox" id="eb-show-pdfs" />
      <span>Show PDFs<span id="eb-pdf-count"></span></span>
    </label>
    <button type="button" class="format-chip" id="eb-select-toggle">☐ Select</button>
    <span id="eb-count"></span>
  </div>

  <div id="eb-list" class="eb-shelf" role="list" hidden></div>

  <div class="eb-footer">
    <!-- ⚠️ TRIMMED 2026-08-18 on the owner's standing order ("Let's trim text
         like this all over each of the sites. Only keep what's mandatory and
         keep all the text short and useful"). What went was the explainer —
         that these are the household's own files, shelved from the library,
         riding the same pool as the rest of the estate. The masthead's
         eyebrow already says heygabi.ai and the tagline already says "the
         household's shared shelf", so it was saying a third time what the top
         of the page says twice.
         ⚠️ WHAT STAYED, and must: "no downloads" is a COST/CAPABILITY
         disclosure, not padding. It is the honest answer to the first thing
         somebody wants from a file shelf, the reader is genuinely the only way
         in (there is no download affordance anywhere and a test pins that),
         and a person who does not read it here discovers it by hunting for a
         button that does not exist. Home of record for the reasoning:
         docs/info/ebooks-r2-ingest.md and ROLES.md §1e. Do not grow this
         paragraph back. -->
    <div>
      Read in the browser — nothing is downloaded.
    </div>
    <div style="margin-top:6px">
      Also in the pool: <a href="https://audiobooks.heygabi.ai">audiobooks &#x2192;</a>
    </div>
    <div style="margin-top:6px">
      Manifest generated at: <span id="eb-generated">…</span>
    </div>
  </div>
</div>

<!-- The reading card: filled and shown by openCard(); one dialog, reused. -->
<div id="eb-card-overlay" hidden>
  <div class="eb-card" role="dialog" aria-modal="true" aria-labelledby="eb-card-title">
    <button type="button" class="eb-card-close" id="eb-card-close" aria-label="Close">&#x2715;</button>
    <div class="eb-card-body">
      <div class="eb-card-media" id="eb-card-media"></div>
      <div class="eb-card-info" id="eb-card-info"></div>
    </div>
  </div>
</div>

<!-- Bulk select action bar for ebooks -->
<div id="eb-bulk-bar" hidden>
  <span class="eb-bulk-count" id="eb-bulk-count"></span>
  <button type="button" class="eb-bulk-act" id="eb-bulk-tbr">Add to TBR</button>
  <span class="eb-bulk-progress" id="eb-bulk-progress"></span>
  <button type="button" class="eb-bulk-cancel" id="eb-bulk-cancel">Cancel</button>
</div>

<script>
(function () {
  'use strict';

  var listEl = document.getElementById('eb-list');
  var searchEl = document.getElementById('eb-search');
  var sortEl = document.getElementById('eb-sort');
  var chipsEl = document.getElementById('eb-format-chips');
  var pdfToggleEl = document.getElementById('eb-show-pdfs');
  var pdfCountEl = document.getElementById('eb-pdf-count');
  var countEl = document.getElementById('eb-count');
  var generatedEl = document.getElementById('eb-generated');
  var overlayEl = document.getElementById('eb-card-overlay');
  var cardMediaEl = document.getElementById('eb-card-media');
  var cardInfoEl = document.getElementById('eb-card-info');
  var cardCloseEl = document.getElementById('eb-card-close');

  var allBooks = [];
  var shownBooks = [];      // what the shelf currently renders, in order
  var activeFormats = {};   // format -> true while its chip is toggled on
  var lastFocused = null;   // focus returns to the tapped tile on close

  // The reading card's one extension point. The AUTH module below registers a
  // function here (window.ebooksShelf.onCard) and openCard hands it the book
  // plus an empty slot; this script never learns what goes in it.
  //
  // ⚠️ Same split as the manifest fetch, for the same reason: this half is a
  // plain script that cannot fail on a Firebase hiccup, so a broken or blocked
  // module costs the card its notes block and NOTHING else — never the card,
  // never the shelf.
  var cardHook = null;

  // ------------------------------ the PDF preference ------------------------
  // Owner, 2026-08-17: the PDFs are hidden by default and revealed by a
  // checkbox. They are game handbooks and household documents, not books, and
  // they are the one format with nothing to extract a cover from.
  var PDF_PREF_KEY = 'eb:showPdfs';

  function readPdfPref() {
    // Storage can throw outright (Safari private mode, a locked-down profile),
    // and a dead preference must never take the shelf down with it.
    try {
      return window.localStorage.getItem(PDF_PREF_KEY) === '1';
    } catch (e) {
      return false;
    }
  }

  function writePdfPref(on) {
    try {
      window.localStorage.setItem(PDF_PREF_KEY, on ? '1' : '0');
    } catch (e) { /* preference simply will not persist; the page still works */ }
  }

  var showPdfs = readPdfPref();

  function isHiddenFormat(b) {
    return !showPdfs && String(b.format || '').toLowerCase() === 'pdf';
  }

  // The pool everything else works from: the shelf, the search, the chips and
  // the count all agree on it, so "hidden" means hidden everywhere.
  function eligibleBooks() {
    return allBooks.filter(function (b) { return !isHiddenFormat(b); });
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#x27;');
  }

  function humanSize(bytes) {
    if (typeof bytes !== 'number' || !(bytes >= 0)) return '';
    if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
    if (bytes >= 1024) return Math.round(bytes / 1024) + ' KB';
    return bytes + ' B';
  }

  function humanDate(iso) {
    var d = new Date(iso || '');
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  }

  // Which book-cloth the placeholder spine wears: a stable pick from the
  // title, so the shelf varies but a given book never changes bindings.
  function clothClass(b) {
    var s = String(b.title || b.filename || '');
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return 'cloth-' + ((h % 4) + 1);
  }

  // The cover face: img (lazy) over an always-rendered typographic spine.
  // The spine is the designed default, not an error state - a missing or
  // failed cover image simply leaves the spine showing.
  function coverHtml(b) {
    var hasImg = typeof b.cover_url === 'string' && b.cover_url !== '';
    return '<span class="eb-cover ' + clothClass(b) + (hasImg ? ' has-img' : '') + '">' +
      (hasImg
        ? '<img loading="lazy" decoding="async" alt="" src="' + esc(b.cover_url) + '">'
        : '') +
      '<span class="eb-spine" aria-hidden="true">' +
        '<span class="eb-spine-title">' + esc(b.title) + '</span>' +
        (b.author ? '<span class="eb-spine-author">' + esc(b.author) + '</span>' : '') +
      '</span>' +
      '<span class="eb-fmt">' + esc(b.format) + '</span>' +
    '</span>';
  }

  function wireImageFallback(rootEl) {
    rootEl.querySelectorAll('.eb-cover.has-img img').forEach(function (img) {
      img.addEventListener('error', function () {
        // Broken art falls back to the designed spine, never a broken glyph.
        img.closest('.eb-cover').classList.remove('has-img');
      });
    });
  }

  function sortBooks(books, key) {
    var byText = function (field) {
      return function (a, b) {
        return String(a[field] || '').localeCompare(String(b[field] || '')) ||
               String(a.title || '').localeCompare(String(b.title || ''));
      };
    };
    var sorted = books.slice();
    if (key === 'author') sorted.sort(byText('author'));
    else if (key === 'size') sorted.sort(function (a, b) { return (b.size_bytes || 0) - (a.size_bytes || 0); });
    else if (key === 'modified') sorted.sort(function (a, b) { return String(b.modified || '').localeCompare(String(a.modified || '')); });
    else sorted.sort(byText('title'));
    return sorted;
  }

  function visibleBooks() {
    var q = (searchEl.value || '').toLowerCase().trim();
    var anyFormat = Object.keys(activeFormats).some(function (f) { return activeFormats[f]; });
    return eligibleBooks().filter(function (b) {
      if (anyFormat && !activeFormats[b.format]) return false;
      if (!q) return true;
      return String(b.title || '').toLowerCase().indexOf(q) !== -1 ||
             String(b.author || '').toLowerCase().indexOf(q) !== -1 ||
             String(b.filename || '').toLowerCase().indexOf(q) !== -1;
    });
  }

  function render() {
    var pool = eligibleBooks();
    shownBooks = sortBooks(visibleBooks(), sortEl.value);
    countEl.textContent = shownBooks.length + ' of ' + pool.length + ' ebook' + (pool.length !== 1 ? 's' : '');
    if (shownBooks.length === 0) {
      listEl.innerHTML = '<div class="empty">No ebooks match.</div>';
      return;
    }
    listEl.innerHTML = shownBooks.map(function (b, i) {
      // The element id is the manifest's own `anchor` - the SAME value
      // app/index_push.py builds each ebook's estate-search detail_url from,
      // computed in exactly one place (build_ebook_manifest.ebook_anchor).
      // Never recompute it here: a drifted copy would break every deep link
      // silently, with the page simply failing to scroll.
      var anchorId = typeof b.anchor === 'string' && b.anchor ? ' id="' + esc(b.anchor) + '"' : '';
      return '<button type="button"' + anchorId + ' class="eb-tile" role="listitem" data-idx="' + i + '" aria-haspopup="dialog">' +
        coverHtml(b) +
        '<span class="eb-cap">' +
          '<span class="eb-cap-title">' + esc(b.title) + '</span>' +
          (b.author ? '<span class="eb-cap-author">' + esc(b.author) + '</span>' : '') +
        '</span>' +
      '</button>';
    }).join('');
    wireImageFallback(listEl);
  }

  function renderChips() {
    // Chips describe the ELIGIBLE pool, so an unticked "Show PDFs" leaves no
    // pdf chip to click - the alternative is a chip that filters to nothing.
    var formats = {};
    eligibleBooks().forEach(function (b) { if (b.format) formats[b.format] = (formats[b.format] || 0) + 1; });
    chipsEl.innerHTML = Object.keys(formats).sort().map(function (f) {
      return '<button type="button" class="format-chip" data-format="' + esc(f) + '">' +
        esc(f) + ' (' + formats[f] + ')</button>';
    }).join(' ');
    chipsEl.querySelectorAll('.format-chip').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var f = btn.dataset.format;
        activeFormats[f] = !activeFormats[f];
        btn.classList.toggle('on', !!activeFormats[f]);
        render();
      });
    });
  }

  function renderPdfToggle() {
    var n = allBooks.filter(function (b) { return String(b.format || '').toLowerCase() === 'pdf'; }).length;
    // No PDFs in the library at all -> no control. A checkbox that toggles
    // nothing is furniture.
    pdfToggleEl.closest('.eb-toggle').hidden = n === 0;
    pdfCountEl.textContent = n ? ' (' + n + ')' : '';
    pdfToggleEl.checked = showPdfs;
  }

  pdfToggleEl.addEventListener('change', function () {
    showPdfs = pdfToggleEl.checked;
    writePdfPref(showPdfs);
    // Drop a stale 'pdf' chip selection on the way out: leaving it set would
    // filter the shelf to nothing the moment PDFs come back.
    if (!showPdfs) delete activeFormats.pdf;
    renderChips();
    render();
  });

  // ------------------------------ deep links --------------------------------
  // Estate search links straight at a book: https://ebooks.heygabi.ai/#<anchor>
  function bookByAnchor(anchor) {
    if (!anchor) return null;
    for (var i = 0; i < allBooks.length; i++) {
      if (allBooks[i].anchor === anchor) return allBooks[i];
    }
    return null;
  }

  function currentAnchor() {
    return String(window.location.hash || '').replace(/^#/, '');
  }

  function goToAnchor() {
    var b = bookByAnchor(currentAnchor());
    if (!b) return;  // an unknown hash is left alone; the shelf still renders

    // A deep link to a PDF must NOT be a dead link just because the checkbox
    // is off. Reveal them FOR THIS VISIT ONLY - deliberately without writing
    // the preference: the owner asked for default-off, and following one link
    // is not the same as ticking the box. Silently flipping a stored default
    // because someone clicked a search result is a surprise nobody asked for.
    if (isHiddenFormat(b)) {
      showPdfs = true;
      renderPdfToggle();
      renderChips();
      render();
    }
    // A search or chip filter can also be hiding the target; clear the search
    // rather than leave the link silently doing nothing.
    if (shownBooks.indexOf(b) === -1) {
      searchEl.value = '';
      activeFormats = {};
      renderChips();
      render();
    }
    var el = document.getElementById(b.anchor);
    if (!el) return;
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    el.classList.add('eb-anchored');
    openCard(b);
  }

  // ------------------------------ reading card ------------------------------
  function openCard(b) {
    // `source` is the manifest's honesty flag: 'opf' means title/author were
    // read out of the file itself; 'filename' means they were parsed from
    // the file name and a person should treat them as provisional.
    var provisional = b.source === 'filename'
      ? '<div><span class="eb-provisional" title="Title and author were parsed from the file name, not read from the file&#x27;s own metadata — treat them as provisional.">unverified metadata</span></div>'
      : '';
    // "Also on audio": the file was filed beside an audiobook, so hand the
    // reader the audiobook catalog's own search for this title.
    var audio = b.beside_audiobook
      ? '<a class="eb-audio-link" href="https://audiobooks.heygabi.ai/#' +
          esc(new URLSearchParams({ q: String(b.title || '') }).toString()) +
        '">Also on audio &#x2192;</a>'
      : '';
    var meta =
      '<div class="eb-meta">' +
        '<span class="k">Format</span><span class="v">' + esc(String(b.format || '').toUpperCase()) + '</span>' +
        (b.size_bytes ? '<span class="k">Size</span><span class="v mono">' + humanSize(b.size_bytes) + '</span>' : '') +
        (humanDate(b.modified) ? '<span class="k">Updated</span><span class="v">' + esc(humanDate(b.modified)) + '</span>' : '') +
        (b.beside_audiobook ? '<span class="k">Filed under</span><span class="v"><span class="eb-folder">' + esc(b.beside_audiobook) + '</span></span>' : '') +
      '</div>';
    cardMediaEl.innerHTML = coverHtml(b);
    wireImageFallback(cardMediaEl);
    // READ — viewer phase 1b, 2026-08-17. A link, not a fetch: the reader page
    // does its own sign-in and its own gated request, and the FILE is not
    // reachable from this page at all.
    //
    // ⚠️ BOTH FORMATS since viewer phase 2 (2026-08-17). Until then EPUB cards
    // carried a note instead of a button, because the reader answered an
    // honest "not yet" and a button onto a refusal is a dead affordance
    // (ROLES.md §1e). The reader now opens both, so the note is gone and the
    // button is on every card — INCLUDING the three oversized books, which
    // open over byte ranges like any other (the 393 MiB omnibus in 18 requests
    // totalling 664 KB). ⚠️ There is deliberately NO size gate: it would be
    // dead code, and a refusal card for books that open fine is worse than
    // none. The ONE book that legitimately refuses is the omnibus, until its
    // file reaches R2 — and the Worker's own `file_absent` sentence says so.
    //
    // ⚠️ AND IT IS NOT A PERMISSION CONTROL. `can_download` is NOT consulted
    // here and must not be: reading is the estate's `vis_ebooks` grant, which
    // this reader already holds by virtue of seeing the shelf, while
    // `download` (admin+) governs taking a file away. Hiding Read behind
    // `can_download` would show the shelf to members and let none of them read.
    // The real gate is server-side on every request; this is a link.
    //
    // Relative on purpose: `/ebooks` -> `/read`, `/dev/ebooks` -> `/dev/read`,
    // and `ebooks.heygabi.ai/` -> `ebooks.heygabi.ai/read`. Extensionless and
    // with no trailing slash — both forms break, for two different reasons the
    // read.html header spells out.
    var fmt = String(b.format || '').toLowerCase();
    var read = (fmt === 'pdf' || fmt === 'epub') && b.anchor
      ? '<a class="eb-read" href="read?b=' + encodeURIComponent(b.anchor) + '">Read &#x2192;</a>'
      : '';
    cardInfoEl.innerHTML =
      '<h2 id="eb-card-title">' + esc(b.title) + '</h2>' +
      (b.author ? '<div class="eb-card-author">' + esc(b.author) + '</div>' : '') +
      meta + provisional + audio + read;

    // Content notes: the slot is always drawn, the filling is the module's.
    // Wrapped so a throwing hook loses the notes and not the open card.
    var notesSlot = document.createElement('div');
    notesSlot.className = 'eb-notes';
    cardInfoEl.appendChild(notesSlot);
    if (typeof cardHook === 'function') {
      try {
        cardHook(b, notesSlot);
      } catch (e) {
        console.warn('[ebooks] content notes failed to render:', e);
        notesSlot.remove();
      }
    } else {
      notesSlot.remove();  // nothing registered: no empty rule under the meta
    }

    lastFocused = document.activeElement;
    overlayEl.hidden = false;
    cardCloseEl.focus();
    // Put the book's own anchor in the address bar so the open card is a
    // copyable link - the same URL estate search hands out. replaceState, not
    // location.hash: assigning the hash would re-scroll the page mid-dialog.
    if (b.anchor && typeof window.history.replaceState === 'function') {
      window.history.replaceState(null, '', '#' + b.anchor);
    }
  }

  function closeCard() {
    overlayEl.hidden = true;
    if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
    lastFocused = null;
    if (window.location.hash && typeof window.history.replaceState === 'function') {
      window.history.replaceState(null, '', window.location.pathname + window.location.search);
    }
  }

  listEl.addEventListener('click', function (ev) {
    var tile = ev.target.closest('.eb-tile');
    if (!tile) return;
    if (window._ebSelectMode) { _ebToggleTile(tile); return; }
    var b = shownBooks[Number(tile.dataset.idx)];
    if (b) openCard(b);
  });

  // Back/forward, or a second estate-search link pasted into the same tab.
  window.addEventListener('hashchange', function () {
    if (currentAnchor()) goToAnchor();
    else if (!overlayEl.hidden) closeCard();
  });
  cardCloseEl.addEventListener('click', closeCard);
  overlayEl.addEventListener('click', function (ev) {
    if (ev.target === overlayEl) closeCard();
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && !overlayEl.hidden) closeCard();
  });

  // ------------------------- the shelf's public API -------------------------
  // ⚠️ THE SHELF NO LONGER FETCHES ANYTHING. Until 2026-08-17 this function
  // did a same-origin relative fetch of the manifest file; that file is gone
  // deployment and from git, because the repo is PUBLIC and leaving the
  // manifest there would have put a door in front of an open window.
  //
  // The manifest now arrives from the module below, which holds the Firebase
  // token and calls the gated endpoint. This split is deliberate: the
  // rendering half stays a plain non-module script that cannot fail on a
  // Firebase hiccup, and the AUTH half is the only thing that talks to a
  // network. Nothing here decides who may see the shelf — the Worker does,
  // server-side, on every request.
  window.ebooksShelf = {
    /** Paint the shelf from a manifest object the caller already obtained. */
    render: function (manifest) {
      allBooks = Array.isArray(manifest.ebooks) ? manifest.ebooks : [];
      generatedEl.textContent = manifest.generated_at || 'unknown';
      renderPdfToggle();
      renderChips();
      render();
      // Deep links resolve only once the manifest is in - the tiles (and so
      // their anchor ids) do not exist before this point, which is why the
      // browser's own fragment scroll cannot do this job.
      goToAnchor();
    },
    /** The honest failure state for a reader who IS allowed in. */
    failed: function (sentence) {
      listEl.innerHTML = '<div class="load-error">' + sentence + '</div>';
      generatedEl.textContent = 'unavailable';
    },
    /** Register the reading card's content-notes filler:
     *  `(book, slotEl) => void`, called once per card open. */
    onCard: function (fn) { cardHook = typeof fn === 'function' ? fn : null; },
  };

  // ===== Multi-select mode for bulk TBR =====
  window._ebSelectMode = false;
  var _ebSelected = new Set(); // titles

  var ebSelectToggle = document.getElementById('eb-select-toggle');
  var ebBulkBar = document.getElementById('eb-bulk-bar');
  var ebBulkCount = document.getElementById('eb-bulk-count');
  var ebBulkTbr = document.getElementById('eb-bulk-tbr');
  var ebBulkCancel = document.getElementById('eb-bulk-cancel');
  var ebBulkProgress = document.getElementById('eb-bulk-progress');

  function _ebUpdateBar() {
    var n = _ebSelected.size;
    if (ebBulkBar) ebBulkBar.hidden = n === 0;
    if (ebBulkBar && n > 0) ebBulkBar.style.display = 'flex';
    if (ebBulkCount) ebBulkCount.textContent = n + ' book' + (n === 1 ? '' : 's') + ' selected';
    if (ebBulkProgress) ebBulkProgress.textContent = '';
  }

  function _ebEnterSelect() {
    window._ebSelectMode = true;
    if (ebSelectToggle) { ebSelectToggle.textContent = '✓ Selecting'; ebSelectToggle.classList.add('on'); }
    _ebUpdateBar();
  }

  function _ebExitSelect() {
    window._ebSelectMode = false;
    _ebSelected.clear();
    if (ebSelectToggle) { ebSelectToggle.textContent = '☐ Select'; ebSelectToggle.classList.remove('on'); }
    listEl.querySelectorAll('.eb-selected').forEach(function(el) { el.classList.remove('eb-selected'); });
    listEl.querySelectorAll('.eb-sel-check').forEach(function(el) { el.remove(); });
    if (ebBulkBar) { ebBulkBar.hidden = true; ebBulkBar.style.display = 'none'; }
  }

  function _ebToggleTile(tile) {
    var idx = Number(tile.dataset.idx);
    var b = shownBooks[idx];
    if (!b || !b.title) return;
    var title = b.title;
    if (_ebSelected.has(title)) {
      _ebSelected.delete(title);
      tile.classList.remove('eb-selected');
      var chk = tile.querySelector('.eb-sel-check');
      if (chk) chk.remove();
    } else {
      _ebSelected.add(title);
      tile.classList.add('eb-selected');
      var cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = true; cb.className = 'eb-sel-check';
      tile.querySelector('.eb-cover').appendChild(cb);
    }
    _ebUpdateBar();
  }
  window._ebToggleTile = _ebToggleTile;

  if (ebSelectToggle) {
    ebSelectToggle.addEventListener('click', function() {
      if (window._ebSelectMode) _ebExitSelect();
      else _ebEnterSelect();
    });
  }
  if (ebBulkCancel) ebBulkCancel.addEventListener('click', _ebExitSelect);

  // Bulk TBR bridge — the module script below sets window._ebBulkTbrHandler
  if (ebBulkTbr) {
    ebBulkTbr.addEventListener('click', function() {
      if (typeof window._ebBulkTbrHandler === 'function') {
        window._ebBulkTbrHandler(Array.from(_ebSelected));
      } else {
        alert('Sign in with Google to use bulk TBR.');
      }
    });
  }

  // Expose exit for the module script
  window._ebExitSelect = _ebExitSelect;

  searchEl.addEventListener('input', render);
  sortEl.addEventListener('change', render);
})();
</script>

<!-- Shared identity bar (sign-in chip) AND the permission gate.
     ⚠️ THE GATE IS HERE AND NOT IN THE SHELF SCRIPT, on purpose. This page's
     content is no longer public (owner directive 2026-08-17), so a Firebase
     hiccup can no longer be shrugged off — but the SHELF half above stays a
     plain script that only renders what it is handed, so a broken module can
     only ever fail CLOSED. Nothing below decides access: it fetches, and the
     Worker decides, server-side, on every request. -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
  import { getFirestore } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
  import { FIREBASE_CONFIG, col } from './fb-env.js';
  import { mountAccountModal } from './account-modal.js';
  import { getLiveUser, getIdToken, signInWithGoogle, handleRedirectResult, getSession, resolveSiteAccess } from './identity.js';
  import { renderEbookNotes } from './ebook-notes.js';
  import { bookIdFromTitle, readingListDocId } from './reviews.js';
  // ⚠️ CURTAIN, NOT LOCK. That module's header carries the whole argument; this
  // page takes no view of its own. The books stay gated by the estate's
  // `vis_ebooks` grant, server-side, on the manifest and on every range — on
  // BOTH lanes, and completely untouched by anything below.
  import { DEV_CURTAIN, devLaneVerdict } from './dev-lane.js';

  /** The gated manifest. ⚠️ Its OWN origin — this page is served from
   *  ebooks.heygabi.ai (through the ebooks-door Worker) and from
   *  audiobooks.heygabi.ai; both are named in audiobook-worker's
   *  SITE_ORIGINS, which is what makes the cross-origin call legal. */
  const MANIFEST_URL = 'https://audiobook-api.heygabi.ai/api/ebooks/manifest';

  const gateEl = document.getElementById('eb-gate');
  const gateTitle = document.getElementById('eb-gate-title');
  const gateWhy = document.getElementById('eb-gate-why');
  const gateBtn = document.getElementById('eb-gate-signin');
  const gateProd = document.getElementById('eb-gate-prod');
  const controlsEl = document.getElementById('eb-controls');
  const listEl = document.getElementById('eb-list');

  /** Show one of the closed states. Every one says what happened, what it
   *  needs and how to get it — never a bare status, never a raw body. */
  function closed(title, why, opts) {
    gateTitle.textContent = title;
    gateWhy.textContent = why;
    gateBtn.hidden = !(opts && opts.signIn);
    // ⚠️ Only the dev curtain sets this. Every other closed state is reached on
    // BOTH lanes, and offering "go to the regular shelf" to somebody already on
    // it would be a link to the page they are looking at.
    if (gateProd) gateProd.hidden = !(opts && opts.prod);
    gateEl.hidden = false;
    controlsEl.hidden = true;
    listEl.hidden = true;
  }

  function opened(manifest) {
    gateEl.hidden = true;
    controlsEl.hidden = false;
    listEl.hidden = false;
    // Content notes are registered BEFORE the first render, because a deep
    // link opens a card during render() — a hook installed afterwards would
    // miss exactly the arrival that matters most.
    //
    // ⚠️ `session` is the localStorage mirror (identity.js getSession), NOT
    // the live user, and that is deliberate: the note's document id embeds
    // `displayName.toLowerCase()`, and the book modal on audiobooks.heygabi.ai
    // spells it from the same mirror. Taking the live token's displayName here
    // instead would file the SAME person's notes under a second id whenever
    // the two differ, and one person cannot warn about a topic twice is the
    // rule the id encodes.
    window.ebooksShelf.onCard((book, slot) => {
      renderEbookNotes(db, slot, book, {
        session: getSession(),
        canModerate: canModerateNotes,
      });
    });
    window.ebooksShelf.render(manifest);
  }

  let app = null;
  let db = null;

  // The site role, for the content notes' moderator ✕. Resolved ONCE per page
  // load (resolveSiteAccess memoises), and read at CLICK time rather than at
  // render time — a card can open before the answer settles, and an affordance
  // that never appears is indistinguishable from one that was refused.
  //
  // ⚠️ 'operateClub' is the moderator+ capability the rest of this estate's UI
  // consults for exactly this control (index.html's canModerateWarnings). It
  // is not the gate: firestore.rules' canDeleteUserWarning is, and it fails
  // closed if this answer is generous.
  let _siteAccess = null;
  const canModerateNotes = () =>
    !!_siteAccess && _siteAccess.capabilities.includes('operateClub');

  try {
    app = initializeApp(FIREBASE_CONFIG);
    db = getFirestore(app);
    mountAccountModal(db, app, document.getElementById('identity-bar'));
  } catch (e) {
    console.warn('[ebooks] identity failed to initialise:', e);
    closed(
      'The shelf could not check your sign-in',
      'Sign-in did not load, so the shelf cannot tell who you are. This is a loading problem on our side, not a decision about you — try a refresh, and if it keeps happening tell Mitch.',
      {},
    );
  }

  // A blocked or very slow gstatic must not leave "Checking your sign-in…"
  // on screen forever — the admin.js backstop, ported.
  let resolved = false;
  const backstop = setTimeout(() => {
    if (resolved) return;
    resolved = true;
    closed(
      'The shelf could not check your sign-in',
      'Sign-in is taking too long to load. Try a refresh; if it keeps happening tell Mitch.',
      {},
    );
  }, 8000);

  gateBtn.addEventListener('click', async () => {
    gateBtn.disabled = true;
    try {
      await signInWithGoogle(app);
      await boot();
    } catch (e) {
      gateWhy.textContent = 'Sign-in did not complete. Try again, or tell Mitch if it keeps failing.';
    }
    gateBtn.disabled = false;
  });

  async function boot() {
    if (!app) return;
    const user = await getLiveUser(app).catch(() => null);
    resolved = true;
    clearTimeout(backstop);

    if (!user || !user.uid) {
      closed(
        'The shelf is closed',
        'These are the household’s own ebook files, so the shelf is not public. Sign in with Google and, if you have been given the ebook grant, it will fill in.',
        { signIn: true },
      );
      return;
    }

    // ⚠️ THE DEV-LANE CURTAIN — A CURTAIN, NOT A LOCK (site/dev-lane.js owns
    // every decision; its header is the thing to read). Three things about
    // this call site, each load-bearing:
    //
    //   * AFTER the signed-out branch. Someone who is not signed in must meet
    //     "sign in", not "you need dev access" — the second sends them to ask
    //     a person for something signing in would have given them.
    //   * BEFORE the manifest fetch, so a curtained visitor never sees a book.
    //   * LANE-AWARE, NEVER HOST-AWARE: devLaneVerdict answers 'prod-lane'
    //     immediately, with NO network call, on every promoted page. So
    //     ebooks.heygabi.ai gains no request, no await and no new way to fail
    //     — which matters twice over, because the auth Worker's ME_ORIGINS
    //     does not include that host and the call would be CORS-refused there.
    //   * 'unknown' (no answer, or an answer without the field — identity.js
    //     caches /api/estate/me for ten minutes and an older entry predates
    //     `dev_access`) falls THROUGH and opens the shelf. An outage is not a
    //     permission decision, and nothing here has ever guarded a byte.
    if ((await devLaneVerdict(app)) === 'curtain') {
      closed(DEV_CURTAIN.title, DEV_CURTAIN.why, { prod: true });
      return;
    }

    // Fire-and-forget, alongside the manifest fetch rather than before it: the
    // shelf must not wait on a role answer only the ✕ on somebody else's
    // content note ever needs.
    if (db) resolveSiteAccess(db, app).then((a) => { _siteAccess = a; }).catch(() => {});

    // ⚠️ THE TOKEN COMES FROM identity.getIdToken(app), NOT FROM THE `user`
    // OBJECT. getLiveUser() answers a flat SNAPSHOT — {uid, email,
    // displayName} — with no token getter on it, on purpose. This page asked
    // the snapshot for one and threw `TypeError: … is not a function` for
    // EVERY signed-in visitor, which the catch below reported as "the shelf
    // did not answer" — an outage sentence for something that was not an
    // outage. So the gated shelf has never once rendered a book for anybody.
    // Nothing caught it, because every test and every agent check was the
    // SIGNED-OUT half, where the line never runs. Fixed 2026-08-17 alongside
    // the identical bug in site/reader.js.
    const token = await getIdToken(app);
    if (!token) {
      closed(
        'Your sign-in has lapsed',
        'Sign in again and the shelf will fill in.',
        { signIn: true },
      );
      return;
    }
    let res;
    try {
      res = await fetch(MANIFEST_URL, { headers: { Authorization: 'Bearer ' + token } });
    } catch (e) {
      // ⚠️ An outage is NOT a permission failure (§1e point 5). Mislabelling
      // it sends people asking for access they already hold.
      closed(
        'The shelf did not answer',
        'The shelf’s server did not respond. This is an outage, not a permission decision — try again shortly.',
        {},
      );
      return;
    }

    if (res.ok) {
      let manifest;
      try {
        manifest = await res.json();
      } catch (e) {
        closed('The shelf did not answer', 'The shelf’s answer was unreadable. Try a refresh; if it keeps happening tell Mitch.', {});
        return;
      }
      opened(manifest);
      return;
    }

    // The Worker writes the sentence for each distinct cause — not signed in,
    // awaiting approval, revoked, or approved-without-the-ebook-grant — so
    // the page shows ITS words rather than inventing a fifth meaning here.
    let body = null;
    try { body = await res.json(); } catch (e) { /* no body worth reading */ }
    const said = body && typeof body.detail === 'string' ? body.detail : null;

    if (res.status === 401) {
      closed('The shelf is closed', said || 'Your sign-in has lapsed — sign in again.', { signIn: true });
      return;
    }
    if (res.status === 403) {
      closed('You do not have the ebook shelf yet', said || 'Ask Mitch to switch on “Ebooks” for your account.', {});
      return;
    }
    closed(
      'The shelf did not answer',
      said || 'Something went wrong on the shelf’s server. Try again shortly.',
      {},
    );
  }

  // A redirect sign-in lands back here; resolve it before asking who is live.
  handleRedirectResult(app).catch(() => {}).then(boot);

  // ===== Bulk TBR handler for ebook multi-select =====

  window._ebBulkTbrHandler = async function(titles) {
    const progress = document.getElementById('eb-bulk-progress');
    const tbrBtn = document.getElementById('eb-bulk-tbr');
    if (tbrBtn) tbrBtn.disabled = true;

    const live = await getLiveUser(app).catch(() => null);
    const uid = live && live.uid ? live.uid : null;
    const session = getSession();

    if (!uid || !session) {
      alert('Sign in with Google to add books to your TBR.');
      if (tbrBtn) tbrBtn.disabled = false;
      return;
    }

    const { doc, setDoc, serverTimestamp } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');
    let done = 0;
    let failed = 0;

    for (const title of titles) {
      if (progress) progress.textContent = `Adding ${done + 1} of ${titles.length}\u2026`;
      const bookId = bookIdFromTitle(title);
      const docId = readingListDocId(uid, bookId);
      try {
        await setDoc(doc(db, col('readingLists'), docId), {
          uid,
          displayName: session.displayName,
          bookId,
          bookTitle: title,
          bookCover: '',
          status: 'tbr',
          addedAt: serverTimestamp(),
        }, { merge: true });
      } catch (e) {
        console.warn('[EbookBulkTBR] Failed for:', title, e);
        failed++;
      }
      done++;
    }

    if (progress) {
      progress.textContent = failed > 0
        ? `Done \u2014 ${failed} of ${titles.length} failed.`
        : `Added ${titles.length} to your TBR!`;
      setTimeout(() => { if (progress) progress.textContent = ''; }, 4000);
    }
    if (tbrBtn) tbrBtn.disabled = false;

    if (typeof window._ebExitSelect === 'function') window._ebExitSelect();
  };
</script>
</body>
</html>
